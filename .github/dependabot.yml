version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
    groups:
      # Angular publishes several exact-peer packages. Runtime and build tooling
      # must move together or npm ci can reject the graph with ERESOLVE.
      angular-framework:
        patterns:
          - "@angular/*"
        update-types:
          - "patch"
          - "minor"
      production-runtime:
        dependency-type: "production"
        # Angular is intentionally owned only by angular-framework above. Keep it
        # out of the broad production group even if Dependabot reuses older PR state.
        exclude-patterns:
          - "@angular/*"
        update-types:
          - "patch"
          - "minor"
      frontend-toolchain:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Framework/runtime majors must be coordinated migrations, never isolated PRs.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # PDFKit 0.x minors may contain documented breaking changes. Keep automatic
      # patch maintenance, but require an explicit compatibility migration for minors.
      - dependency-name: "pdfkit"
        update-types:
          - "version-update:semver-minor"
      # V165 intentionally pins the Tailwind/PostCSS integration at 4.2.x. Minor
      # upgrades require an explicit visual compatibility migration and device matrix.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "@tailwindcss/postcss"
        update-types:
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      first-party-actions-runtime:
        patterns:
          - "actions/checkout"
          - "actions/setup-node"
          - "actions/upload-artifact"
      # CodeQL init/analyze are one security toolchain and must never cross major
      # versions independently. Dependabot must update them in one PR.
      codeql-runtime:
        patterns:
          - "github/codeql-action/*"
