name: One-shot secure admin account panel upgrade

on:
  push:
    paths:
      - '.github/workflows/admin-account-panel-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade-admin-account-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Upgrade admin account settings safely
        shell: python
        env:
          ACCOUNT_TEMPLATE_B64: "          ADMIN_METHODS_B64: ""
        run: |
          import base64
          from pathlib import Path
          import os

          path = Path('src/pages/admin/admin-settings.component.ts')
          text = path.read_text(encoding='utf-8')
          account_template = base64.b64decode(os.environ['ACCOUNT_TEMPLATE_B64']).decode('utf-8')
          new_methods = base64.b64decode(os.environ['ADMIN_METHODS_B64']).decode('utf-8')

          start_marker = '        <!-- ACCOUNT TAB -->'
          end_marker = '        <div\n          class="sticky bottom-4'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Account tab template boundaries not found')
          text = text[:start] + account_template + text[end:]

          methods_start = text.find('  newAdminEmail = "";')
          methods_end = text.find('  saveConfig(event: Event)', methods_start)
          if methods_start == -1 or methods_end == -1:
              raise SystemExit('Legacy admin account methods boundaries not found')
          text = text[:methods_start] + new_methods + text[methods_end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/admin-settings.component.ts
          git commit -m 'feat: add real admin password management and remove fake access list'
          git push origin HEAD:main
