# Validates the complete latest tree, including frontend, Vercel Functions and Supabase runtime.
name: Alperler Professional Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v33-booking-notifications-security
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "tsconfig.api.json"
      - "firestore.rules"
      - ".github/workflows/alperler-quality-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "tsconfig.api.json"
      - "firestore.rules"
      - ".github/workflows/alperler-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: alperler-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: API TypeScript quality check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Newsletter Edge Function type check
        id: newsletter_check
        shell: bash
        run: |
          set -o pipefail
          deno check supabase/functions/newsletter-gateway/index.ts 2>&1 | tee deno-newsletter.log

      - name: Upload newsletter diagnostics
        if: failure() && steps.newsletter_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deno-newsletter-log
          path: deno-newsletter.log
          if-no-files-found: error
          retention-days: 2

      - name: Existing Supabase Edge Functions type check
        run: |
          set -euo pipefail
          for file in supabase/functions/*/index.ts; do
            case "$file" in
              supabase/functions/newsletter-gateway/index.ts) continue ;;
            esac
            echo "Checking $file"
            deno check "$file"
          done

      - name: Production build
        run: npm run build
