# Validates the complete latest main tree, including mobile navigation, cloud admin CRUD and account security changes.
name: Alperler Professional Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "firestore.rules"
      - ".github/workflows/alperler-quality-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "firestore.rules"

permissions:
  contents: read

concurrency:
  group: alperler-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript quality check
        run: npm run lint

      - name: Production build
        run: npm run build
