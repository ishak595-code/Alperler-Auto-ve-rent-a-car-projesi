name: Alperler Professional Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "project/apply-professional-hotfix.mjs"

permissions:
  contents: write

concurrency:
  group: alperler-professional-hotfix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply professional hotfixes
        run: node project/apply-professional-hotfix.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript quality check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "alperler-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src index.html
          git commit -m "fix: professional responsive and accessibility hardening"
          git push origin HEAD:main
