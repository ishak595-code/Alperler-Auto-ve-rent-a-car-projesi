name: Alperler Professional Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "project/apply-*-hotfix.mjs"

permissions:
  contents: write

concurrency:
  group: alperler-professional-hotfix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply professional hotfix modules
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(project/apply-*-hotfix.mjs)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No hotfix modules found."
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Running $script"
            node "$script"
          done

      - name: Install and reconcile dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript quality check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "alperler-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src index.html package.json package-lock.json firestore.rules
          if git diff --cached --quiet; then
            echo "No verified source changes to commit."
            exit 0
          fi
          git commit -m "fix: professional responsive accessibility and admin security hardening"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
