# Validates the complete latest tree, including frontend, Vercel Functions and Supabase runtime.
name: Alperler Professional Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v33-booking-notifications-security
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "tsconfig.api.json"
      - "firestore.rules"
      - ".github/workflows/alperler-quality-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "tsconfig.api.json"
      - "firestore.rules"
      - ".github/workflows/alperler-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: alperler-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: API TypeScript quality check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Supabase Edge Function type check
        run: deno check supabase/functions/*/index.ts

      - name: Production build
        run: npm run build
