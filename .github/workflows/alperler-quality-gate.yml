# Validates the complete latest tree, including frontend, Vercel Functions and Supabase runtime.
# V121 PR validation checkpoint: no static catalogue, stale browser cache, URL media authoring or unlabeled TalkBack controls.
name: Alperler Professional Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v33-booking-notifications-security
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "public/**"
      - "project/**"
      - "scripts/**"
      - "index.html"
      - "index.tsx"
      - "server.ts"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "vercel.json"
      - ".vercelignore"
      - ".gitignore"
      - ".env.example"
      - "tsconfig.json"
      - "tsconfig.api.json"
      - ".github/workflows/booking-security-gate.yml"
      - ".github/workflows/alperler-quality-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "public/**"
      - "project/**"
      - "scripts/**"
      - "index.html"
      - "index.tsx"
      - "server.ts"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "vercel.json"
      - ".vercelignore"
      - ".gitignore"
      - ".env.example"
      - "tsconfig.json"
      - "tsconfig.api.json"
      - ".github/workflows/booking-security-gate.yml"
      - ".github/workflows/alperler-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: alperler-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: TalkBack button accessibility guard
        run: npm run a11y:buttons

      - name: TalkBack date accessibility guard
        run: npm run a11y:dates

      - name: Rental and sale vehicle truth/media guard
        run: npm run media:vehicles

      - name: Vercel Hobby function budget guard
        run: npm run vercel:functions

      - name: Premium customer design system guard
        run: npm run design:premium

      - name: Installable standalone PWA guard
        run: npm run pwa:installability

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: API TypeScript quality check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Validate Vercel SPA deployment config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const angular = JSON.parse(fs.readFileSync('angular.json', 'utf8'));
          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const outputPath = angular.projects?.app?.architect?.build?.options?.outputPath;
          const angularBase = typeof outputPath === 'string' ? outputPath : outputPath?.base;
          const normalizedBase = String(angularBase || '').replace(/^\.\//, '').replace(/\/$/, '');
          if (!normalizedBase || vercel.outputDirectory !== normalizedBase) {
            throw new Error(`Vercel outputDirectory (${vercel.outputDirectory}) does not match Angular outputPath (${normalizedBase})`);
          }
          const spaRewrite = Array.isArray(vercel.rewrites) && vercel.rewrites.some(
            (rule) => rule?.source === '/(.*)' && rule?.destination === '/index.html'
          );
          if (!spaRewrite) throw new Error('Missing SPA catch-all rewrite to /index.html');
          if (vercel.framework !== 'angular') throw new Error('Vercel framework must remain angular');
          console.log('Vercel/Angular deployment configuration is consistent.');
          NODE

      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Newsletter Edge Function type check
        id: newsletter_check
        shell: bash
        run: |
          set -o pipefail
          deno check --node-modules-dir=auto supabase/functions/newsletter-gateway/index.ts 2>&1 | tee deno-newsletter.log

      - name: Upload newsletter diagnostics
        if: failure() && steps.newsletter_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deno-newsletter-log
          path: deno-newsletter.log
          if-no-files-found: error
          retention-days: 2

      - name: Analytics ingest Edge Function type check
        id: analytics_ingest_check
        shell: bash
        run: |
          set -o pipefail
          deno check --node-modules-dir=auto supabase/functions/analytics-ingest/index.ts 2>&1 | tee deno-analytics-ingest.log

      - name: Upload analytics ingest diagnostics
        if: failure() && steps.analytics_ingest_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deno-analytics-ingest-log
          path: deno-analytics-ingest.log
          if-no-files-found: error
          retention-days: 2

      - name: Analytics identity Edge Function type check
        run: deno check --node-modules-dir=auto supabase/functions/analytics-link/index.ts

      - name: Existing Supabase Edge Functions type check
        run: |
          set -euo pipefail
          for file in supabase/functions/*/index.ts; do
            case "$file" in
              supabase/functions/newsletter-gateway/index.ts|supabase/functions/analytics-ingest/index.ts|supabase/functions/analytics-link/index.ts) continue ;;
            esac
            echo "Checking $file"
            deno check --node-modules-dir=auto "$file"
          done

      - name: Production build
        id: production_build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee angular-build.log

      - name: Upload production build diagnostics
        if: failure() && steps.production_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-log
          path: angular-build.log
          if-no-files-found: error
          retention-days: 2
