# Validates frontend, Vercel Functions, SEO build inputs and cloud rules on every development branch and main.
name: Alperler Professional Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "src/**"
      - "api/**"
      - "scripts/**"
      - "public/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "tsconfig.api.json"
      - "firestore.rules"
      - "vercel.json"
      - ".github/workflows/alperler-quality-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "scripts/**"
      - "public/**"
      - "project/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - "tsconfig.api.json"
      - "firestore.rules"
      - "vercel.json"
      - ".github/workflows/alperler-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: alperler-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: API TypeScript quality check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build

      - name: Reject stale production SEO markers
        run: |
          if grep -R "alperrentacar.online\|picsum.photos/id/1072\|+905320000000" dist public -n 2>/dev/null; then
            echo "Stale or unverified SEO marker found in build output."
            exit 1
          fi
