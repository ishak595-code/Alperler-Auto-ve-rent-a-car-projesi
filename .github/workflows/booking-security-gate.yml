name: Booking and Integration Security Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v33-booking-notifications-security
    paths:
      - "src/services/booking.service.ts"
      - "src/services/persistent-car.service.ts"
      - "src/services/car.service.ts"
      - "src/services/catalog.service.ts"
      - "src/services/public-detail-data.service.ts"
      - "src/services/partner-request.service.ts"
      - "src/services/newsletter.service.ts"
      - "src/pages/track-car.component.ts"
      - "src/app.routes.ts"
      - "src/pages/admin/admin-layout.component.ts"
      - "src/pages/admin/admin-site-settings-hub.component.ts"
      - "src/pages/admin/admin-reservations.component.ts"
      - "src/pages/admin/admin-partner-requests.component.ts"
      - "src/pages/admin/admin-branch-partner-requests.component.ts"
      - "src/pages/admin/admin-subscribers.component.ts"
      - "src/pages/admin/admin-legal-center.component.ts"
      - "src/pages/admin/admin-team.component.ts"
      - "src/pages/legal.component.ts"
      - "src/components/customer-footer-v70.component.ts"
      - "src/components/navbar.component.ts"
      - "src/pages/appointment.component.ts"
      - "api/catalog.ts"
      - "api/partner.ts"
      - "api/bookings.ts"
      - "api/payments.ts"
      - "vercel.json"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "project/**"
      - ".vercelignore"
      - ".github/workflows/booking-security-gate.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify cloud and deployment safety invariants
        shell: bash
        run: |
          set -euo pipefail

          # Supabase is the only active application database/auth runtime.
          test ! -e src/firebase.ts
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e project/apply-admin-auth-security-hotfix.mjs
          ! grep -Fq '"firebase"' package.json
          ! grep -Fq '"@google/genai"' package.json
          ! grep -R --line-number --fixed-string 'firebase/firestore' src api || false
          ! grep -R --line-number --fixed-string 'firebase/auth' src api || false
          ! grep -R --line-number --fixed-string '../firebase' src api || false

          # Deployment hygiene.
          grep -Fq 'public/*.zip' .vercelignore
          grep -Fq '*.zip' .vercelignore

          # Transactional runtime must exist. Related Vercel endpoints may share
          # one function to remain within the Hobby 12-function deployment budget.
          test -f api/bookings.ts
          test -f api/catalog.ts
          test -f api/partner.ts
          grep -Fq 'operation === "resume"' api/partner.ts
          grep -Fq 'partner-upload-resume' api/partner.ts
          test -f src/services/catalog.service.ts
          test -f src/services/public-detail-data.service.ts
          test -f supabase/functions/booking-gateway/index.ts
          test -f supabase/functions/booking-notify/index.ts
          test -f supabase/functions/partner-request-gateway/index.ts
          test -f supabase/functions/partner-upload-resume/index.ts
          test -f supabase/migrations/202608140002_alperler_rls_policies_v1.sql

          # Vehicle and tour runtime identity must be canonical. Historical columns
          # may remain for audit, but active routing and booking creation must never
          # resolve metadata legacy IDs again.
          ! grep -Fq 'metadata["legacyId"]' src/services/catalog.service.ts
          ! grep -Fq 'metadata["legacyId"]' src/services/public-detail-data.service.ts
          ! grep -Fq 'metadata->>legacyId' supabase/functions/booking-gateway/index.ts
          grep -Fq 'legacy_item_id: null' supabase/functions/booking-gateway/index.ts
          grep -Fq 'type RentalDuration = "hourly" | "daily" | "weekly" | "monthly" | "longterm"' supabase/functions/booking-gateway/index.ts
          grep -Fq 'bookings_no_approved_rental_overlap' supabase/functions/booking-gateway/index.ts

          # Tracking must use authenticated operations data and must never regress to demo telemetry.
          grep -Fq 'BookingService' src/pages/track-car.component.ts
          grep -Fq 'adminAreaGuard('\''operations'\'')' src/app.routes.ts
          ! grep -Fq 'Ahmet Yılmaz' src/pages/track-car.component.ts
          ! grep -Fq 'GPS Bağlantısı Aktif' src/pages/track-car.component.ts
          ! grep -Fq 'Math.random' src/pages/track-car.component.ts

          # Newsletter is public only through its hardened gateway. Subscriber
          # management remains admin-only and consent changes keep an audit trail.
          test -f supabase/functions/newsletter-gateway/index.ts
          test -f supabase/migrations/20260817181500_v90_newsletter_consent_audit.sql
          grep -Fq 'consume_rate_limit' supabase/functions/newsletter-gateway/index.ts
          grep -Fq 'newsletter_consent_events_admin_read' supabase/migrations/20260817181500_v90_newsletter_consent_audit.sql
          grep -Fq 'private.can_manage_operations()' supabase/migrations/20260817181500_v90_newsletter_consent_audit.sql

          # Admin legal center must remain inside the authenticated, lazy-loaded Site Settings hub.
          test -f src/pages/admin/admin-legal-center.component.ts
          test -f src/pages/admin/admin-site-settings-hub.component.ts
          grep -Fq "const loadAdminSiteSettingsHub = () => import('./pages/admin/admin-site-settings-hub.component')" src/app.routes.ts
          grep -Fq "path: 'legal', loadComponent: loadAdminSiteSettingsHub" src/app.routes.ts
          grep -Fq "settingsSection: 'legal'" src/app.routes.ts
          grep -Fq "adminAreaGuard('settings')" src/app.routes.ts

          # Never send booking/customer payloads to public test endpoints.
          ! grep -R --line-number --fixed-string 'httpbin.org' src api supabase/functions

          # Service-role secrets are server-side only. The browser source may
          # reference publishable Supabase configuration, never the service key.
          ! grep -R --line-number --fixed-string 'SUPABASE_SERVICE_ROLE_KEY' src
          ! grep -R --line-number --fixed-string 'sb_secret_' src api supabase

          # CarService must remain on the canonical Supabase catalog and booking services.
          grep -Fq 'CatalogService' src/services/car.service.ts
          grep -Fq 'BookingService' src/services/car.service.ts

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check browser booking integration
        run: npm run lint

      - name: Type-check transactional APIs
        run: npx tsc --noEmit -p tsconfig.api.json
