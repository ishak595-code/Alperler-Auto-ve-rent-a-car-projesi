name: Booking and Integration Security Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v33-booking-notifications-security
    paths:
      - "src/services/booking.service.ts"
      - "src/services/car.service.ts"
      - "src/services/catalog.service.ts"
      - "src/services/partner-request.service.ts"
      - "src/pages/admin/admin-reservations.component.ts"
      - "src/pages/admin/admin-partner-requests.component.ts"
      - "src/pages/appointment.component.ts"
      - "index.tsx"
      - "api/catalog.ts"
      - "api/partner-requests.ts"
      - "api/partner-upload-resume.ts"
      - "api/bookings.ts"
      - "api/_lib/sms.ts"
      - "api/_lib/booking-notification-template.ts"
      - "supabase/**"
      - ".env.example"
      - ".vercelignore"
      - ".github/workflows/booking-security-gate.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify cloud and deployment safety invariants
        shell: bash
        run: |
          set -euo pipefail

          # Production runtime is Supabase-first. Obsolete Firebase-era source
          # must not be reintroduced into the deployable application tree.
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firebase-applet-config.json
          test ! -e firebase-blueprint.json
          test ! -e src/firebase.ts
          test ! -e api/_lib/firestore-rest.ts
          test ! -e src/services/persistent-car.service.ts
          test ! -e src/providers/legacy-webhook-safety.provider.ts
          ! grep -R --line-number -E 'firebase/firestore|from[[:space:]]+["'"'][^"'"']*firebase' src api || exit 1
          ! grep -Fq 'PersistentCarService' index.tsx
          ! grep -Fq 'provideLegacyWebhookSafety' index.tsx

          # Deployment hygiene.
          grep -Fq 'public/*.zip' .vercelignore
          grep -Fq '*.zip' .vercelignore

          # Transactional runtime must exist. Booking persistence and delivery
          # live in Supabase Edge Functions; Vercel only proxies server boundaries.
          test -f api/bookings.ts
          test -f api/catalog.ts
          test -f api/partner-upload-resume.ts
          test -f src/services/catalog.service.ts
          test -f supabase/functions/booking-gateway/index.ts
          test -f supabase/functions/booking-notify/index.ts
          test -f supabase/functions/partner-request-gateway/index.ts
          test -f supabase/functions/partner-upload-resume/index.ts
          test -f supabase/migrations/202608140002_alperler_rls_policies_v1.sql

          # Never send booking/customer payloads to public test endpoints.
          ! grep -R --line-number --fixed-string 'httpbin.org' src api supabase/functions

          # Service-role secrets are server-side only. Browser source may
          # reference publishable Supabase configuration, never the service key.
          ! grep -R --line-number --fixed-string 'SUPABASE_SERVICE_ROLE_KEY' src
          ! grep -R --line-number --fixed-string 'sb_secret_' src api supabase

          # CarService must stay on the current catalog/booking abstraction.
          grep -Fq 'CatalogService' src/services/car.service.ts
          grep -Fq 'BookingService' src/services/car.service.ts

          # Production-domain environment contract must not regress to placeholders.
          grep -Fq 'PUBLIC_APP_URL=https://alperrentacar.online' .env.example
          ! grep -Fq 'https://example.com' .env.example
          ! grep -Fq 'FIREBASE_PROJECT_ID' .env.example

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check browser booking integration
        run: npm run lint

      - name: Type-check transactional APIs
        run: npx tsc --noEmit -p tsconfig.api.json
