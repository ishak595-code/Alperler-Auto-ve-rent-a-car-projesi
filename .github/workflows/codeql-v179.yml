name: V179 CodeQL Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  contents: read
  actions: read

concurrency:
  group: v179-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: javascript-typescript-security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: "/language:javascript-typescript"
