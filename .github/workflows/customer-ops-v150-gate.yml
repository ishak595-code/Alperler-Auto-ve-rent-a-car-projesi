name: Customer Operations V150 Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/components/accessible-native-date.component.ts"
      - "src/components/booking-success-overlay.component.ts"
      - "src/components/customer-mobile-dock.component.ts"
      - "src/components/account-profile-settings-v225.component.ts"
      - "src/models/site-config.model.ts"
      - "src/pages/account-dashboard-v150.component.ts"
      - "src/pages/account-login.component.ts"
      - "src/pages/account-wallet.component.ts"
      - "src/pages/contact-entry.component.ts"
      - "src/pages/home-v71.component.ts"
      - "src/pages/booking-checkout.component.ts"
      - "src/pages/tour-detail.component.ts"
      - "src/pages/admin/admin-homepage.component.ts"
      - "src/services/accessibility-runtime.service.ts"
      - "src/services/auth.service.ts"
      - "src/services/customer-booking-actions.service.ts"
      - "src/services/customer-wallet.service.ts"
      - "src/services/customer-saved-cards-v225.service.ts"
      - "src/services/profile-admin-bridge.service.ts"
      - "src/services/booking-success*"
      - "src/services/pwa-runtime.service.ts"
      - "src/app.component.ts"
      - "src/app.routes.ts"
      - "src/runtime-stability.css"
      - "scripts/check-date-controls.mjs"
      - "index.tsx"
      - "public/manifest.json"
      - "public/service-worker.js"
      - "public/offline.html"
      - "supabase/migrations/*v150*"
      - ".github/workflows/customer-ops-v150-gate.yml"

permissions:
  contents: read

jobs:
  customer-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Verify customer and accessibility invariants
        shell: bash
        run: |
          set -euo pipefail

          # V161 date contract: the visible surface is one semantic button with its
          # accessible name on that exact button. Chromium's native type=date internals
          # are intentionally absent because Samsung TalkBack may expose an anonymous
          # nested picker control. The owned calendar is a modal dialog with named days.
          grep -Fq 'class="date-surface"' src/components/accessible-native-date.component.ts
          grep -Fq '[attr.aria-label]="triggerAccessibleName()"' src/components/accessible-native-date.component.ts
          grep -Fq 'aria-haspopup="dialog"' src/components/accessible-native-date.component.ts
          grep -Fq '<strong>Tarihi seç</strong>' src/components/accessible-native-date.component.ts
          grep -Fq 'role="dialog"' src/components/accessible-native-date.component.ts
          grep -Fq 'aria-modal="true"' src/components/accessible-native-date.component.ts
          grep -Fq '[attr.aria-label]="day.ariaLabel"' src/components/accessible-native-date.component.ts
          grep -Fq 'aria-label="Önceki ay"' src/components/accessible-native-date.component.ts
          grep -Fq 'aria-label="Sonraki ay"' src/components/accessible-native-date.component.ts
          grep -Fq 'aria-label="Takvimi kapat"' src/components/accessible-native-date.component.ts
          grep -Fq 'onDialogKeydown' src/components/accessible-native-date.component.ts
          grep -Fq 'onDayKeydown' src/components/accessible-native-date.component.ts
          grep -Fq 'focus({ preventScroll: true })' src/components/accessible-native-date.component.ts
          ! grep -Fq 'type="date"' src/components/accessible-native-date.component.ts
          ! grep -Fq 'native-date-control' src/components/accessible-native-date.component.ts
          ! grep -Fq 'showPicker' src/components/accessible-native-date.component.ts
          ! grep -Fq 'Takvimden seçin' src/components/accessible-native-date.component.ts
          ! grep -Fq 'aria-describedby' src/components/accessible-native-date.component.ts

          # All customer booking surfaces stay on the same shared calendar engine.
          grep -Fq 'AccessibleNativeDateComponent' src/pages/home-v71.component.ts
          grep -Fq 'app-accessible-native-date' src/pages/home-v71.component.ts
          grep -Fq 'AccessibleNativeDateComponent' src/pages/booking-checkout.component.ts
          grep -Fq 'app-accessible-native-date' src/pages/booking-checkout.component.ts
          grep -Fq 'AccessibleNativeDateComponent' src/pages/tour-detail.component.ts
          grep -Fq 'app-accessible-native-date' src/pages/tour-detail.component.ts

          # Interactive controls own stable semantics. Runtime accessibility mutation
          # must not rewrite focused controls behind the application's components.
          ! grep -Fq 'AccessibilityRuntimeService' src/app.component.ts
          ! grep -Fq 'accessibilityRuntime.start' src/app.component.ts
          grep -Fq 'aria-label="Bu turu rezerve et"' src/pages/tour-detail.component.ts
          grep -Fq '[attr.inert]="reservationOpen()' src/pages/tour-detail.component.ts
          grep -Fq 'focusAfterRender' src/pages/tour-detail.component.ts

          # Quick planner uses the requested order and admin-configurable visible labels,
          # with deterministic accessible-name fallbacks for every interactive control.
          grep -Fq 'const defaults:PlannerFieldKey[]=["service","pickup","duration","date"]' src/pages/home-v71.component.ts
          grep -Fq "[attr.aria-label]=\"homeContent().plannerDurationLabel || 'Kiralama süresini seç'\"" src/pages/home-v71.component.ts
          grep -Fq "[attr.aria-label]=\"homeContent().plannerStartTimeLabel || 'Alış saatini seç'\"" src/pages/home-v71.component.ts
          grep -Fq "[attr.aria-label]=\"homeContent().plannerEndTimeLabel || 'İade saatini seç'\"" src/pages/home-v71.component.ts
          grep -Fq 'plannerFieldOrder' src/pages/admin/admin-homepage.component.ts
          grep -Fq 'plannerEnabled' src/pages/admin/admin-homepage.component.ts
          grep -Fq 'plannerVariant' src/pages/admin/admin-homepage.component.ts
          grep -Fq 'plannerServiceOptions' src/pages/admin/admin-homepage.component.ts
          grep -Fq 'plannerDurationOptions' src/pages/admin/admin-homepage.component.ts

          # Checkout and contact are separate concepts. A stale checkout may never own /contact after refresh.
          grep -Fq "path: 'booking-checkout'" src/app.routes.ts
          grep -Fq 'checkoutGuard' src/app.routes.ts
          grep -Fq 'navigate(["/booking-checkout"]' src/pages/contact-entry.component.ts

          # Admin access uses the same confirmed Supabase identity as the customer
          # profile, verifies admin_users and preserves the requested admin route.
          # AccountLogin must NOT eagerly instantiate AuthService because both auth
          # services would otherwise race to consume the one-time recovery hash.
          grep -Fq "path: 'admin/login', loadComponent:" src/app.routes.ts
          grep -Fq "returnUrl: state.url || '/admin'" src/app.routes.ts
          grep -Fq 'alperler_customer_session_v1' src/services/auth.service.ts
          grep -Fq 'admin_users?user_id=eq.' src/services/profile-admin-bridge.service.ts
          grep -Fq 'alperler_admin_session_v1' src/services/profile-admin-bridge.service.ts
          grep -Fq 'window.location.assign(this.safeAdminTarget(target))' src/services/profile-admin-bridge.service.ts
          grep -Fq 'adminReturnTarget()' src/pages/account-login.component.ts
          grep -Fq 'await this.adminBridge.openAdmin(adminTarget)' src/pages/account-login.component.ts
          grep -Fq 'this.injector.get(AuthService)' src/pages/account-login.component.ts
          ! grep -Fq 'readonly adminAuth=inject(AuthService)' src/pages/account-login.component.ts
          grep -Fq 'await this.auth.changePassword(this.password)' src/pages/account-login.component.ts
          grep -Fq 'ProfileAdminBridgeService' src/pages/account-dashboard-v150.component.ts

          # Chrome owns the native Install app / Add to Home screen flow. V162 keeps
          # registration and release checks in one dedicated runtime coordinator. The
          # release identifier may advance; customer-ops validates the cache contract,
          # while the dedicated PWA gate validates installability and browser behavior.
          grep -Fq "import { startPwaRuntime }" index.tsx
          grep -Fq 'startPwaRuntime();' index.tsx
          grep -Fq 'navigator.serviceWorker.register(SERVICE_WORKER_URL' src/services/pwa-runtime.service.ts
          grep -Fq "updateViaCache: 'none'" src/services/pwa-runtime.service.ts
          ! grep -Eq "addEventListener[[:space:]]*\([[:space:]]*['\"]beforeinstallprompt['\"]" index.tsx src/services/pwa-runtime.service.ts
          ! grep -Fq '__alperlerInstallPrompt' index.tsx src/services/pwa-runtime.service.ts
          ! grep -Fq 'PwaInstallPromptComponent' src/app.component.ts
          ! grep -Fq '<app-pwa-install-prompt>' src/app.component.ts
          test ! -f src/components/pwa-install-prompt.component.ts
          test ! -f src/services/pwa-install.service.ts
          grep -Fq '"display": "standalone"' public/manifest.json
          grep -Fq '"display_override": ["standalone"]' public/manifest.json
          grep -Eq "^const RELEASE = 'v[0-9]+([-._][A-Za-z0-9-]+)*';$" public/service-worker.js
          grep -Fq 'const SHELL_CACHE = `${CACHE_PREFIX}${RELEASE}-shell`;' public/service-worker.js
          grep -Fq 'const STATIC_CACHE = `${CACHE_PREFIX}${RELEASE}-static`;' public/service-worker.js
          grep -Fq "const OFFLINE_URL = '/offline.html'" public/service-worker.js
          test -f public/offline.html
          grep -Fq '@media (max-width:639px) and (pointer:coarse)' src/components/customer-mobile-dock.component.ts
          grep -Fq '(max-width:950px) and (max-height:500px) and (pointer:coarse)' src/components/customer-mobile-dock.component.ts
          grep -Fq '(display-mode:fullscreen)' src/components/customer-mobile-dock.component.ts

          # Customer booking state and cancellation stay account-bound and auditable.
          test -f supabase/migrations/20260822090500_v150_customer_booking_self_cancel.sql
          grep -Fq 'customer_user_id = v_user_id' supabase/migrations/20260822090500_v150_customer_booking_self_cancel.sql
          grep -Fq "booking_cancelled_by_customer" supabase/migrations/20260822090500_v150_customer_booking_self_cancel.sql
          grep -Fq 'customer_cancel_booking' src/services/customer-booking-actions.service.ts
          grep -Fq "Talebiniz başarıyla gönderildi" src/components/booking-success-overlay.component.ts

          # The customer wallet may contain provider-tokenized saved cards and private
          # documents. Provider tokens must never cross into browser source.
          grep -Fq 'CustomerSavedCardsV225Service' src/pages/account-wallet.component.ts
          grep -Fq 'Kayıtlı kartlarım' src/pages/account-wallet.component.ts
          grep -Fq 'IDENTITY_FRONT' src/pages/account-wallet.component.ts
          grep -Fq 'IDENTITY_BACK' src/pages/account-wallet.component.ts
          grep -Fq 'DRIVING_LICENSE_FRONT' src/pages/account-wallet.component.ts
          grep -Fq 'DRIVING_LICENSE_BACK' src/pages/account-wallet.component.ts
          grep -Fq 'capture="environment"' src/pages/account-wallet.component.ts
          ! grep -Eq 'cardUserKey|cardToken|utoken|ctoken' src/pages/account-wallet.component.ts src/services/customer-saved-cards-v225.service.ts
          grep -Fq "window.open('about:blank','_blank')" src/services/customer-wallet.service.ts
          grep -Fq 'preview.location.replace(url)' src/services/customer-wallet.service.ts
          grep -Fq 'customer_documents?id=eq.' src/services/customer-wallet.service.ts
          grep -Fq 'DOCUMENT_STORAGE_CLEANUP_PENDING' src/services/customer-wallet.service.ts
          ! grep -Fq 'Harcama Görünümüm' src/pages/account-wallet.component.ts

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full accessibility control audit
        run: |
          npm run a11y:buttons
          npm run a11y:dates

      - name: Frontend type check
        run: npm run lint

      - name: API type check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build
