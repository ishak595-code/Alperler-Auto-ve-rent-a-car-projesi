name: One-off V85 homepage renderer sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-v85-home-renderer-sync.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Replace legacy homepage section renderer
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/home-v71.component.ts')
          text = path.read_text()
          import_anchor = 'import { VehicleListItemComponent } from "../components/vehicle-list-item.component";\n'
          if import_anchor not in text:
            raise SystemExit('Home import anchor missing')
          text = text.replace(import_anchor, import_anchor + 'import { DynamicHomeSectionComponent } from "../components/dynamic-home-section.component";\n', 1)
          imports_anchor = 'imports: [CommonModule, FormsModule, MatIconModule, RouterLink, VehicleListItemComponent],'
          if imports_anchor not in text:
            raise SystemExit('Home component imports anchor missing')
          text = text.replace(imports_anchor, 'imports: [CommonModule, FormsModule, MatIconModule, RouterLink, VehicleListItemComponent, DynamicHomeSectionComponent],', 1)
          start_marker = '      @for (section of managedSections(); track section.sectionKey) {'
          end_marker = '    </main>\n  `,'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('Legacy section block markers missing')
          replacement = '''      @for (section of managedSections(); track section.sectionKey) {\n        <app-dynamic-home-section [section]="section"></app-dynamic-home-section>\n      }\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          layout = Path('src/services/homepage-layout.service.ts')
          source = layout.read_text()
          old = 'maxItems: Math.max(1, Math.min(24, Number(row.max_items || 6))),'
          new = 'maxItems: Math.max(1, Math.floor(Number(row.max_items || 6))),'
          if old not in source:
            raise SystemExit('Homepage layout maxItems clamp anchor missing')
          layout.write_text(source.replace(old, new, 1))
      - name: Commit renderer sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home-v71.component.ts src/services/homepage-layout.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "V85: render homepage sections from dynamic database contract"
          git push origin HEAD:main
