name: One-off V86 admin navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-v86-admin-nav.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Patch shared admin layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/admin/admin-layout.component.ts')
          s=p.read_text()
          s=s.replace('<button (click)="closeSidebar()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition-colors">','<button (click)="closeSidebar()" aria-label="Admin menüsünü kapat" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition-colors">',1)
          anchor='''      <!-- Main Content (Full Screen if not dashboard) -->\n      <main class="w-full min-h-screen bg-slate-50" [class.pt-16]="showLayout()">'''
          replacement='''      @if (!showLayout()) {\n        <nav class="fixed top-0 left-0 right-0 z-40 flex h-14 items-center gap-2 border-b border-slate-200 bg-white/95 px-3 shadow-sm backdrop-blur" aria-label="Admin sayfa gezinmesi">\n          <button type="button" (click)="goBack()" aria-label="Önceki admin sayfasına dön" class="flex min-h-10 items-center gap-2 rounded-xl bg-slate-100 px-3 text-sm font-black text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">← <span>Geri</span></button>\n          <a routerLink="/admin/dashboard" aria-label="Admin kontrol paneline git" class="flex min-h-10 items-center rounded-xl bg-slate-950 px-3 text-sm font-black text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">Kontrol Paneli</a>\n          <span class="ml-auto max-w-[42vw] truncate text-xs font-bold text-slate-500">{{ adminPageTitle() }}</span>\n        </nav>\n      }\n\n      <!-- Main Content -->\n      <main class="w-full min-h-screen bg-slate-50" [class.pt-16]="showLayout()" [class.pt-14]="!showLayout()">'''
          if anchor not in s: raise SystemExit('main content anchor missing')
          s=s.replace(anchor,replacement,1)
          method_anchor='''  closeSidebar() {\n    this.isSidebarOpen.set(false);\n  }\n\n  logout() {'''
          method_repl='''  closeSidebar() {\n    this.isSidebarOpen.set(false);\n  }\n\n  goBack() {\n    if (typeof window !== 'undefined' && window.history.length > 1) this.location.back();\n    else void this.router.navigate(['/admin/dashboard']);\n  }\n\n  adminPageTitle(): string {\n    const path = this.location.path().split('?')[0];\n    const labels: Record<string,string> = { homepage: 'Ana Sayfa Vitrini', campaigns: 'Kampanyalar', media: 'Fotoğraf & Video', 'catalog-editor': 'Katalog Editörü', reservations: 'Rezervasyonlar', 'partner-requests': 'Araç Başvuruları', 'branch-partner-requests': 'Şube Başvuruları', feedback: 'Mesaj Kutusu', subscribers: 'Bülten Merkezi', team: 'Ekip & Yetkiler', assignments: 'Görev Merkezi', branches: 'Şubeler', whatsapp: 'WhatsApp Ayarları', 'system-health': 'Sistem Sağlığı', audit: 'İşlem Geçmişi', analytics: 'Ziyaretçi Analitiği', settings: 'Site Ayarları', blog: 'Blog' };\n    const segment = path.replace(/^\\/admin\\/?/, '').split('/')[0] || 'dashboard';\n    return labels[segment] || 'Admin';\n  }\n\n  logout() {'''
          if method_anchor not in s: raise SystemExit('method anchor missing')
          s=s.replace(method_anchor,method_repl,1)
          p.write_text(s)
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/oneoff-v86-admin-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/admin-layout.component.ts .github/workflows/oneoff-v86-admin-nav.yml
          git commit -m "V86.2: add shared accessible admin back navigation"
          git push origin HEAD:main
