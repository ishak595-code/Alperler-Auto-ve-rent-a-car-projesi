name: One-off V86 theme renderer sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-v86-theme-renderer.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Patch dynamic homepage renderer
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/dynamic-home-section.component.ts')
          s=p.read_text()
          s=s.replace("<p class=\"section-kicker\">{{ badge('Araç Sahipleri') }}</p>", "@if (profileImage()) { <img class=\"section-profile\" [src]=\"profileImage()\" [alt]=\"section.title + ' profil görseli'\" loading=\"lazy\" /> }\n                <p class=\"section-kicker\">{{ badge('Araç Sahipleri') }}</p>",1)
          s=s.replace("<p class=\"section-kicker\">{{ badge('AlperAuto') }}</p>", "@if (profileImage()) { <img class=\"section-profile\" [src]=\"profileImage()\" [alt]=\"section.title + ' profil görseli'\" loading=\"lazy\" /> }\n                <p class=\"section-kicker\">{{ badge('AlperAuto') }}</p>",1)
          s=s.replace("<p class=\"section-kicker\">{{ badge(defaultBadge()) }}</p>", "@if (profileImage()) { <img class=\"section-profile\" [src]=\"profileImage()\" [alt]=\"section.title + ' profil görseli'\" loading=\"lazy\" /> }\n                <p class=\"section-kicker\">{{ badge(defaultBadge()) }}</p>",1)
          s=s.replace("  coverImage(): string { return this.safeImage(String(this.setting('coverImage', '') || '')); }", "  profileImage(): string { return this.safeImage(String(this.setting('profileImage', '') || '')); }\n  coverImage(): string { return this.safeImage(String(this.setting('coverImage', '') || '')); }")
          s=s.replace("['light','soft','dark','brand'].includes(theme)", "['light','soft','dark','brand','ocean','emerald','sunset','violet','sand','graphite'].includes(theme)")
          anchor=".theme-soft{background-color:#f4f7fb}.theme-dark{background-color:#050b18;color:#fff}.theme-brand{background:linear-gradient(145deg,#071124,#0b2347);color:#fff}"
          repl=".theme-soft{background-color:#f4f7fb}.theme-dark{background-color:#050b18;color:#fff}.theme-brand{background:linear-gradient(145deg,#071124,#0b2347);color:#fff}.theme-ocean{background:linear-gradient(145deg,#062a4e,#0b5b83);color:#fff}.theme-emerald{background:linear-gradient(145deg,#052e2b,#0f766e);color:#fff}.theme-sunset{background:linear-gradient(145deg,#7c2d12,#ea580c);color:#fff}.theme-violet{background:linear-gradient(145deg,#3b0764,#7c3aed);color:#fff}.theme-sand{background:#f6f0e4;color:#3f3528}.theme-graphite{background:linear-gradient(145deg,#111827,#374151);color:#fff}"
          if anchor not in s: raise SystemExit('theme anchor missing')
          s=s.replace(anchor,repl,1)
          dark=".theme-dark .section-desc,.theme-brand .section-desc{color:#9fb0c7}.theme-dark .section-kicker,.theme-brand .section-kicker{color:#93c5fd}.theme-dark .view-all,.theme-brand .view-all{color:#bfdbfe}"
          dark2=".theme-dark .section-desc,.theme-brand .section-desc,.theme-ocean .section-desc,.theme-emerald .section-desc,.theme-sunset .section-desc,.theme-violet .section-desc,.theme-graphite .section-desc{color:#d2dbea}.theme-dark .section-kicker,.theme-brand .section-kicker,.theme-ocean .section-kicker,.theme-emerald .section-kicker,.theme-sunset .section-kicker,.theme-violet .section-kicker,.theme-graphite .section-kicker{color:#bfdbfe}.theme-dark .view-all,.theme-brand .view-all,.theme-ocean .view-all,.theme-emerald .view-all,.theme-sunset .view-all,.theme-violet .view-all,.theme-graphite .view-all{color:#dbeafe}"
          if dark not in s: raise SystemExit('dark theme anchor missing')
          s=s.replace(dark,dark2,1)
          card=".theme-dark .partner-card,.theme-brand .partner-card,.theme-dark .promo-card,.theme-brand .promo-card{background:rgba(8,18,35,.86);color:#fff}"
          card2=".theme-dark .partner-card,.theme-brand .partner-card,.theme-ocean .partner-card,.theme-emerald .partner-card,.theme-sunset .partner-card,.theme-violet .partner-card,.theme-graphite .partner-card,.theme-dark .promo-card,.theme-brand .promo-card,.theme-ocean .promo-card,.theme-emerald .promo-card,.theme-sunset .promo-card,.theme-violet .promo-card,.theme-graphite .promo-card{background:rgba(8,18,35,.86);color:#fff}"
          if card not in s: raise SystemExit('card theme anchor missing')
          s=s.replace(card,card2,1)
          css_anchor=".section-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1rem}"
          s=s.replace(css_anchor, css_anchor+".section-profile{width:48px;height:48px;margin-bottom:.55rem;border-radius:14px;object-fit:cover;border:1px solid rgba(148,163,184,.3);box-shadow:0 8px 22px rgba(15,23,42,.16)}",1)
          p.write_text(s)
      - name: Commit and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-v86-theme-renderer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dynamic-home-section.component.ts .github/workflows/oneoff-v86-theme-renderer.yml
          git commit -m "V86.1: render ten dynamic homepage themes"
          git push origin HEAD:main
