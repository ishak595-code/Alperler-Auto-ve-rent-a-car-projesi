name: Ops V236 Safe Egress

on:
  push:
    branches: [v236-cached-egress-hardening]
    paths: [.github/workflows/ops-v236-safe-egress.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v236-cached-egress-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply quality-safe egress hardening
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/services/catalog-media.service.ts')
          s=p.read_text()
          s2=s.replace('"cache-control": "3600"','"cache-control": "31536000"').replace('["cacheControl", "3600"]','["cacheControl", "31536000"]')
          if s2==s: raise SystemExit('catalog cache patch not applied')
          p.write_text(s2)

          p=Path('src/services/branch-media-v171.service.ts')
          s=p.read_text()
          s2=s.replace('"cache-control":"3600"','"cache-control":"31536000"').replace('["cacheControl","3600"]','["cacheControl","31536000"]')
          if s2==s: raise SystemExit('branch media cache patch not applied')
          p.write_text(s2)

          p=Path('src/services/branch-listing-media-v171.service.ts')
          s=p.read_text()
          s=s.replace('private readonly auth=inject(BranchPortalAuthService);private readonly bucket="catalog-media";private readonly _progress=signal(0);', 'private readonly auth=inject(BranchPortalAuthService);private readonly bucket="catalog-media";private readonly tusThreshold=6*1024*1024;private readonly tusChunkSize=6*1024*1024;private readonly browserCacheSeconds="31536000";private readonly _progress=signal(0);')
          old='try{const upload=await fetch(`${SUPABASE_PROJECT_URL}/storage/v1/object/${this.bucket}/${path.split("/").map(encodeURIComponent).join("/")}`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,authorization:`Bearer ${token}`,"content-type":file.type,"cache-control":"3600","x-upsert":"false"},body:file});if(!upload.ok)throw new Error(`LISTING_MEDIA_UPLOAD_${upload.status}`);this._progress.set(65);'
          new='try{if(file.size>=this.tusThreshold)await this.uploadTus(file,path,token);else await this.uploadStandard(file,path,token);this._progress.set(65);'
          if old not in s: raise SystemExit('branch listing upload block not found')
          s=s.replace(old,new)
          needle='  private async requiredToken():Promise<string>{const token=await this.auth.getAccessToken();if(!token)throw new Error("BRANCH_SESSION_REQUIRED");return token;}\n'
          insert='''  private async uploadStandard(file:File,path:string,token:string):Promise<void>{const upload=await fetch(`${SUPABASE_PROJECT_URL}/storage/v1/object/${this.bucket}/${path.split("/").map(encodeURIComponent).join("/")}`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,authorization:`Bearer ${token}`,"content-type":file.type,"cache-control":this.browserCacheSeconds,"x-upsert":"false"},body:file});if(!upload.ok)throw new Error(`LISTING_MEDIA_UPLOAD_${upload.status}`);}\n  private async uploadTus(file:File,path:string,token:string):Promise<void>{const metadata=[["bucketName",this.bucket],["objectName",path],["contentType",file.type],["cacheControl",this.browserCacheSeconds]].map(([key,value])=>`${key} ${btoa(unescape(encodeURIComponent(value)))}`).join(",");const create=await fetch(`${SUPABASE_PROJECT_URL}/storage/v1/upload/resumable`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,authorization:`Bearer ${token}`,"Tus-Resumable":"1.0.0","Upload-Length":String(file.size),"Upload-Metadata":metadata,"x-upsert":"false"}});if(!create.ok)throw new Error(`LISTING_MEDIA_TUS_CREATE_${create.status}`);const location=create.headers.get("location");if(!location)throw new Error("LISTING_MEDIA_TUS_LOCATION_MISSING");const uploadUrl=new URL(location,SUPABASE_PROJECT_URL).toString();let offset=Number(create.headers.get("upload-offset")||0);while(offset<file.size){const end=Math.min(offset+this.tusChunkSize,file.size);const chunk=file.slice(offset,end,file.type);let response:Response|undefined;let lastError:unknown;for(const delay of [0,800,2000,5000]){if(delay)await new Promise(resolve=>setTimeout(resolve,delay));try{response=await fetch(uploadUrl,{method:"PATCH",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,authorization:`Bearer ${token}`,"Tus-Resumable":"1.0.0","Upload-Offset":String(offset),"Content-Type":"application/offset+octet-stream"},body:chunk});if(response.ok)break;if(![409,412,429,500,502,503,504].includes(response.status))throw new Error(`LISTING_MEDIA_TUS_PATCH_${response.status}`);}catch(error){lastError=error;response=undefined;}}if(!response?.ok)throw lastError instanceof Error?lastError:new Error("LISTING_MEDIA_TUS_UPLOAD_FAILED");const nextOffset=Number(response.headers.get("upload-offset"));offset=Number.isFinite(nextOffset)&&nextOffset>offset?nextOffset:end;this._progress.set(Math.min(60,Math.round(offset/file.size*60)));}}\n'''+needle
          if needle not in s: raise SystemExit('branch listing insertion point not found')
          p.write_text(s.replace(needle,insert))

          p=Path('src/services/branch-portal.service.ts')
          s=p.read_text()
          old='''    const response = await fetch(`${SUPABASE_PROJECT_URL}/storage/v1/object/vehicle-media/${path}`, {\n      method: "POST",\n      headers: {\n        apikey: SUPABASE_PUBLISHABLE_KEY,\n        authorization: `Bearer ${token}`,\n        "content-type": file.type,\n        "x-upsert": "false",\n      },\n      body: file,\n    });\n    if (!response.ok) throw new Error("IMAGE_UPLOAD_FAILED");\n'''
          new='''    if (file.size >= 6 * 1024 * 1024) {\n      await this.uploadVehicleImageTus(file, path, token);\n    } else {\n      const response = await fetch(`${SUPABASE_PROJECT_URL}/storage/v1/object/vehicle-media/${path}`, {\n        method: "POST",\n        headers: {\n          apikey: SUPABASE_PUBLISHABLE_KEY,\n          authorization: `Bearer ${token}`,\n          "content-type": file.type,\n          "cache-control": "31536000",\n          "x-upsert": "false",\n        },\n        body: file,\n      });\n      if (!response.ok) throw new Error("IMAGE_UPLOAD_FAILED");\n    }\n'''
          if old not in s: raise SystemExit('legacy branch image block not found')
          s=s.replace(old,new)
          needle='  async acceptPolicy(policyId: string): Promise<void> {\n'
          helper='''  private async uploadVehicleImageTus(file: File, path: string, token: string): Promise<void> {\n    const metadata = [\n      ["bucketName", "vehicle-media"],\n      ["objectName", path],\n      ["contentType", file.type],\n      ["cacheControl", "31536000"],\n    ].map(([key, value]) => `${key} ${btoa(unescape(encodeURIComponent(value)))}`).join(",");\n    const create = await fetch(`${SUPABASE_PROJECT_URL}/storage/v1/upload/resumable`, {\n      method: "POST",\n      headers: {\n        apikey: SUPABASE_PUBLISHABLE_KEY,\n        authorization: `Bearer ${token}`,\n        "Tus-Resumable": "1.0.0",\n        "Upload-Length": String(file.size),\n        "Upload-Metadata": metadata,\n        "x-upsert": "false",\n      },\n    });\n    if (!create.ok) throw new Error("IMAGE_UPLOAD_FAILED");\n    const location = create.headers.get("location");\n    if (!location) throw new Error("IMAGE_UPLOAD_FAILED");\n    const uploadUrl = new URL(location, SUPABASE_PROJECT_URL).toString();\n    let offset = Number(create.headers.get("upload-offset") || 0);\n    while (offset < file.size) {\n      const end = Math.min(offset + 6 * 1024 * 1024, file.size);\n      const response = await fetch(uploadUrl, {\n        method: "PATCH",\n        headers: {\n          apikey: SUPABASE_PUBLISHABLE_KEY,\n          authorization: `Bearer ${token}`,\n          "Tus-Resumable": "1.0.0",\n          "Upload-Offset": String(offset),\n          "Content-Type": "application/offset+octet-stream",\n        },\n        body: file.slice(offset, end, file.type),\n      });\n      if (!response.ok) throw new Error("IMAGE_UPLOAD_FAILED");\n      const nextOffset = Number(response.headers.get("upload-offset"));\n      offset = Number.isFinite(nextOffset) && nextOffset > offset ? nextOffset : end;\n    }\n  }\n\n'''+needle
          if needle not in s: raise SystemExit('legacy branch helper insertion point not found')
          p.write_text(s.replace(needle,helper))

          p=Path('vercel.json')
          s=p.read_text()
          old='''    { "source": "/catalog-media/:path*", "headers": [\n      { "key": "Cache-Control", "value": "public, max-age=86400, stale-while-revalidate=604800" }\n    ]},'''
          new='''    { "source": "/catalog-media/:path*", "headers": [\n      { "key": "Cache-Control", "value": "public, max-age=31536000, immutable" },\n      { "key": "CDN-Cache-Control", "value": "public, max-age=31536000, immutable" }\n    ]},'''
          if old not in s: raise SystemExit('vercel cache route not found')
          p.write_text(s.replace(old,new))

          Path('scripts/check-v236-egress-quality.mjs').write_text('''import fs from "node:fs";\nconst fail=[];const read=(p)=>fs.readFileSync(p,"utf8");\nconst catalog=read("src/services/catalog-media.service.ts");const branchListing=read("src/services/branch-listing-media-v171.service.ts");const branchMedia=read("src/services/branch-media-v171.service.ts");const branchPortal=read("src/services/branch-portal.service.ts");const branchPortalUi=read("src/pages/branch-portal.component.ts");const vercel=JSON.parse(read("vercel.json"));const must=(ok,msg)=>{if(!ok)fail.push(msg)};\nmust(catalog.includes("readonly maxUploadBytes = 50 * 1024 * 1024"),"canonical catalog 50 MB limit changed");must(catalog.includes("\\\"video/mp4\\\"")&&catalog.includes("\\\"video/webm\\\""),"canonical catalog video support changed");must(catalog.includes("\\\"cache-control\\\": \\\"31536000\\\"")&&catalog.includes("[\\\"cacheControl\\\", \\\"31536000\\\"]"),"canonical catalog long cache missing");must(!catalog.includes("catalogImageTargetBytes")&&!catalog.includes("prepareCatalogImage"),"catalog must not impose destructive byte-target recompression");\nmust(branchListing.includes("50*1024*1024"),"branch listing 50 MB media limit changed");must(branchListing.includes("file.type.startsWith(\\\"video/\\\")"),"branch listing video support changed");must(branchListing.includes("tusThreshold=6*1024*1024")&&branchListing.includes("uploadTus(file,path,token)"),"branch listing large-media TUS path missing");must(branchListing.includes("browserCacheSeconds=\\\"31536000\\\""),"branch listing long cache missing");\nmust(branchMedia.includes("maxUploadBytes=50*1024*1024"),"branch studio 50 MB media limit changed");must(branchMedia.includes("[\\\"cacheControl\\\",\\\"31536000\\\"]"),"branch studio long cache missing");\nmust(branchPortal.includes("file.size > 10 * 1024 * 1024"),"legacy branch vehicle image 10 MB limit changed");must(branchPortal.includes("\\\"cacheControl\\\", \\\"31536000\\\"")&&branchPortal.includes("uploadVehicleImageTus"),"legacy branch image reliable upload/cache hardening missing");must(branchPortalUi.includes(".slice(0, 30)"),"branch vehicle 30-photo gallery limit changed");\nconst route=(vercel.headers||[]).find((h)=>h.source==="/catalog-media/:path*");const headers=new Map((route?.headers||[]).map((h)=>[h.key,h.value]));must(headers.get("Cache-Control")==="public, max-age=31536000, immutable","browser immutable cache missing");must(headers.get("CDN-Cache-Control")==="public, max-age=31536000, immutable","Vercel CDN cache missing");\nif(fail.length){console.error(fail.join("\\n"));process.exit(1)}console.log("V236 egress guard passed: image quality is not byte-capped; 30-photo branch gallery and 50 MB image/video media limits stay intact; large uploads use resumable transport and immutable browser/CDN caching is enforced.");\n''')
      - run: npm ci
      - run: node scripts/check-v236-egress-quality.mjs
      - run: node scripts/check-vehicle-media.mjs
      - run: npm run lint
      - run: npm run typecheck:api
      - run: npm run build
      - name: Commit verified safe change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/catalog-media.service.ts src/services/branch-media-v171.service.ts src/services/branch-listing-media-v171.service.ts src/services/branch-portal.service.ts vercel.json scripts/check-v236-egress-quality.mjs
          git commit -m "perf(media): reduce cached egress without lowering quality"
          git push origin HEAD:v236-cached-egress-hardening
