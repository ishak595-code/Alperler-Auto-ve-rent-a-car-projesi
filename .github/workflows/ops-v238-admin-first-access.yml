name: OPS V238 Secure Admin First Access

on:
  push:
    branches:
      - v238-profile-navigation-integrity

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v238-profile-navigation-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply secure admin first-access UX
        run: python3 scripts/ops/patch-v238-admin-first-access.py
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: V238 regression contract
        run: node scripts/check-v238-profile-navigation-integrity.mjs
      - name: Frontend TypeScript
        run: npm run lint
      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Production build
        run: npm run build
      - name: Commit secure admin first access
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/navbar.component.ts src/pages/admin/admin-login.component.ts src/services/auth.service.ts scripts/check-v238-profile-navigation-integrity.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "V238: add secure first admin access from mobile menu"
            git push origin HEAD:v238-profile-navigation-integrity
          fi