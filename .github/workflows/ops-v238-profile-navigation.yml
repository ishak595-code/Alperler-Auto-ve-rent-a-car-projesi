name: OPS V238 Profile Navigation Integrity

on:
  push:
    branches:
      - v238-profile-navigation-integrity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v238-profile-navigation-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply V238 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Navigation: Search is dock-only on mobile.
          p = Path('src/services/navigation-config.service.ts')
          s = p.read_text()
          old = "return this._items().filter((item) => item.surface === surface && !item.archivedAt && (includeInactive || item.isActive)).sort((a,b) => a.sortOrder-b.sortOrder || a.label.localeCompare(b.label,'tr'));"
          new = "return this._items().filter((item) => item.surface === surface && !item.archivedAt && (includeInactive || item.isActive) && !this.isForbiddenMobileMenuSearch(item)).sort((a,b) => a.sortOrder-b.sortOrder || a.label.localeCompare(b.label,'tr'));"
          if old not in s: raise SystemExit('itemsFor anchor missing')
          s = s.replace(old, new, 1)

          old = "async addPreset(surface:NavigationSurface,preset:NavigationPreset):Promise<void>{\n    const token=await this.requiredToken();const route=this.safeRoute(preset.route);if(!route)throw new Error('Bu hazır butonun bağlantısı uygulamadaki bir sayfayla eşleşmiyor.');"
          new = "async addPreset(surface:NavigationSurface,preset:NavigationPreset):Promise<void>{\n    if(surface==='MOBILE_MENU'&&(preset.key==='search'||preset.route==='/search'))throw new Error('Arama mobil alt barda sabittir ve hamburger menüye tekrar eklenemez.');\n    const token=await this.requiredToken();const route=this.safeRoute(preset.route);if(!route)throw new Error('Bu hazır butonun bağlantısı uygulamadaki bir sayfayla eşleşmiyor.');"
          if old not in s: raise SystemExit('addPreset anchor missing')
          s = s.replace(old, new, 1)

          old = "async addCustom(surface:NavigationSurface,input:{label:string;icon:string;route:string}):Promise<void>{\n    const token=await this.requiredToken();const label=input.label.trim().slice(0,60);const icon=input.icon.trim().slice(0,60)||'link';const route=this.safeRoute(input.route);if(!label||!route)throw new Error('Geçerli bir buton adı ve çalışan site içi bağlantı girin.');"
          new = "async addCustom(surface:NavigationSurface,input:{label:string;icon:string;route:string}):Promise<void>{\n    const token=await this.requiredToken();const label=input.label.trim().slice(0,60);const icon=input.icon.trim().slice(0,60)||'link';const route=this.safeRoute(input.route);if(!label||!route)throw new Error('Geçerli bir buton adı ve çalışan site içi bağlantı girin.');if(surface==='MOBILE_MENU'&&route==='/search')throw new Error('Arama mobil alt barda sabittir ve hamburger menüye tekrar eklenemez.');"
          if old not in s: raise SystemExit('addCustom anchor missing')
          s = s.replace(old, new, 1)

          old = "if(item.archivedAt)throw new Error('Kaldırılmış bir butonu düzenlemeden önce geri yükleyin.');const token=await this.requiredToken();const route=this.safeRoute(item.route);if(!route)throw new Error('Bu bağlantı uygulamadaki geçerli bir müşteri sayfasına gitmiyor.');"
          new = "if(item.archivedAt)throw new Error('Kaldırılmış bir butonu düzenlemeden önce geri yükleyin.');const token=await this.requiredToken();const route=this.safeRoute(item.route);if(!route)throw new Error('Bu bağlantı uygulamadaki geçerli bir müşteri sayfasına gitmiyor.');if(item.surface==='MOBILE_MENU'&&(item.itemKey==='search'||route==='/search'))throw new Error('Arama mobil alt barda sabittir ve hamburger menüye tekrar eklenemez.');"
          if old not in s: raise SystemExit('updateItem anchor missing')
          s = s.replace(old, new, 1)

          old = "async restoreItem(id:string):Promise<void>{const item=this._items().find((candidate)=>candidate.id===id&&candidate.archivedAt);if(!item)throw new Error('Geri yüklenecek buton bulunamadı.');const route=this.safeRoute(item.route);if(!route)throw new Error('Bu butonun eski bağlantısı artık geçerli değil. Önce aynı butonu hazır seçeneklerden yeniden ekleyin.');const token=await this.requiredToken();"
          new = "async restoreItem(id:string):Promise<void>{const item=this._items().find((candidate)=>candidate.id===id&&candidate.archivedAt);if(!item)throw new Error('Geri yüklenecek buton bulunamadı.');const route=this.safeRoute(item.route);if(!route)throw new Error('Bu butonun eski bağlantısı artık geçerli değil. Önce aynı butonu hazır seçeneklerden yeniden ekleyin.');if(item.surface==='MOBILE_MENU'&&(item.itemKey==='search'||route==='/search'))throw new Error('Arama mobil alt barda sabittir ve hamburger menüye geri yüklenemez.');const token=await this.requiredToken();"
          if old not in s: raise SystemExit('restoreItem anchor missing')
          s = s.replace(old, new, 1)

          anchor = "  private safeRoute(value:string):string{"
          helper = "  private isForbiddenMobileMenuSearch(item:NavigationItem):boolean{return item.surface==='MOBILE_MENU'&&(item.itemKey==='search'||item.route.split('?')[0].split('#')[0]==='/search');}\n"
          if anchor not in s: raise SystemExit('safeRoute anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)

          # 2) Profile settings: remove duplicated referral surface and keep profile/security only.
          p = Path('src/components/account-profile-settings-v225.component.ts')
          s = p.read_text()
          s = s.replace("import { RouterLink } from '@angular/router';\n", '')
          s = s.replace('imports:[CommonModule,FormsModule,RouterLink,AccountSecurityV223Component],', 'imports:[CommonModule,FormsModule,AccountSecurityV223Component],')
          start = s.find('    <section class="referral-card"')
          end = s.find('    <section class="security-launch"', start)
          if start < 0 or end < 0: raise SystemExit('referral template anchors missing')
          s = s[:start] + s[end:]
          s = s.replace('.profile-settings,.referral-card,.security-launch', '.profile-settings,.security-launch')
          s = s.replace('.section-head p,.security-launch p,.referral-head p', '.section-head p,.security-launch p')
          s = s.replace('.section-head h2,.security-launch h2,.referral-head h2', '.section-head h2,.security-launch h2')
          s = s.replace('.section-head span,.security-launch span,.referral-head span', '.section-head span,.security-launch span')
          s = re.sub(r'\.referral-card\{.*?\.referral-loading\{[^}]*\}', '', s, count=1)
          s = s.replace(',.invite-actions button:focus-visible,.campaign-link:focus-visible', '')
          s = s.replace(',.referral-head', '')
          s = s.replace(',.campaign-link', '')
          s = s.replace('.reward-grid{grid-template-columns:repeat(3,1fr)}', '')
          s = s.replace('.referral-stats{grid-template-columns:repeat(4,1fr)}', '')
          s = s.replace("  readonly referralNotice=signal('');\n  readonly referralError=signal('');\n", '')
          s = re.sub(r"\n  referralLink\(\):string\{.*?\n  async shareReferralLink\(\):Promise<void>\{.*?await this\.copyReferralLink\(\);\}", '', s, count=1, flags=re.S)
          p.write_text(s)

          # 3) Canonical referral component shown directly on Profile landing.
          referral = r'''import { CommonModule } from '@angular/common';
          import { Component, OnInit, inject, signal } from '@angular/core';
          import { RouterLink } from '@angular/router';
          import { CustomerAccountService } from '../services/customer-account.service';

          @Component({
            selector:'app-account-referral-v238',
            standalone:true,
            imports:[CommonModule,RouterLink],
            template:`
              <section class="referral-card" aria-labelledby="account-referral-title">
                <header class="referral-head">
                  <div>
                    <p>ARKADAŞINI DAVET ET</p>
                    <h2 id="account-referral-title">Sen de kazan, arkadaşın da kazansın</h2>
                    <span>Kişisel davet bağlantınızı paylaşın. Arkadaşınız uygun kiralama, araç satın alma veya tur işlemini tamamladığında ödüller hesabınıza işlenir.</span>
                  </div>
                  <a routerLink="/campaigns" class="campaign-link">Kampanyalı Araçları ve Fırsatları Gör</a>
                </header>

                @if(account.referralSummary(); as referral){
                  @if(account.loyaltySettings(); as settings){
                    <div class="referral-body">
                      <div class="invite-box">
                        <span class="invite-label">KİŞİSEL DAVET KODUNUZ</span>
                        <strong>{{referral.code}}</strong>
                        <label class="invite-link"><span>Davet bağlantısı</span><input [value]="referralLink()" readonly aria-label="Kişisel davet bağlantısı" /></label>
                        <div class="invite-actions">
                          <button type="button" (click)="copyReferralLink()">Davet Linkini Kopyala</button>
                          <button type="button" class="secondary" (click)="shareReferralLink()">Paylaş</button>
                        </div>
                        @if(notice()){<p class="notice" role="status">{{notice()}}</p>}
                        @if(error()){<p class="error" role="alert">{{error()}}</p>}
                      </div>

                      <div class="reward-grid" aria-label="Davet ödülleri">
                        <article><span>KİRALAMA</span><strong>+{{settings.referral_rental_inviter_points | number:'1.0-0'}} puan</strong><p>Arkadaşınız +{{settings.referral_rental_invitee_points | number:'1.0-0'}} puan@if(settings.referral_checkout_discount_enabled && settings.referral_rental_invitee_discount>0){ ve {{discountText(settings.referral_rental_invitee_discount)}} davet avantajı} alabilir.</p></article>
                        <article><span>ARAÇ SATIŞI</span><strong>+{{settings.referral_sale_inviter_points | number:'1.0-0'}} puan</strong><p>Arkadaşınız +{{settings.referral_sale_invitee_points | number:'1.0-0'}} puan@if(settings.referral_checkout_discount_enabled && settings.referral_sale_invitee_discount>0){ ve {{discountText(settings.referral_sale_invitee_discount)}} davet avantajı} alabilir.</p></article>
                        <article><span>TUR</span><strong>+{{settings.referral_tour_inviter_points | number:'1.0-0'}} puan</strong><p>Arkadaşınız +{{settings.referral_tour_invitee_points | number:'1.0-0'}} puan@if(settings.referral_checkout_discount_enabled && settings.referral_tour_invitee_discount>0){ ve {{discountText(settings.referral_tour_invitee_discount)}} davet avantajı} alabilir.</p></article>
                      </div>

                      <p class="stack-note">{{settings.allow_campaign_referral_stack?'Uygun kampanyalarda davet avantajı kampanyalı fiyatla birlikte kullanılabilir.':'Davet avantajı ile kampanya indirimi aynı işlemde birlikte kullanılamaz.'}}</p>
                      <div class="referral-stats">
                        <div><span>Kayıt olan</span><strong>{{referral.registered}}</strong></div>
                        <div><span>Bekleyen</span><strong>{{referral.pending}}</strong></div>
                        <div><span>Ödüllenen</span><strong>{{referral.rewarded}}</strong></div>
                        <div><span>Kazanılan puan</span><strong>{{referral.pointsEarned | number:'1.0-0'}}</strong></div>
                      </div>
                      @if(account.nextReferralMilestone(); as milestone){<div class="milestone"><span>Sonraki davet ödülü</span><strong>{{milestone.remaining}} başarılı davet sonra +{{milestone.bonus | number:'1.0-0'}} bonus puan</strong></div>}
                    </div>
                  } @else { <p class="loading" role="status">Davet programı ayarları şu anda yüklenemedi.</p> }
                } @else { <p class="loading" role="status">Davet kodunuz hazırlanıyor. Profilinizi yenileyip tekrar deneyin.</p> }
              </section>
            `,
            styles:[`
              :host{display:block;margin-top:.85rem}.referral-card{overflow:hidden;border:1px solid #37485f;border-radius:18px;background:linear-gradient(145deg,#0c1725,#08111d);color:#f4f6f8}.referral-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:16px;border-bottom:1px solid #263548}.referral-head>div{max-width:720px}.referral-head p{margin:0;color:#c6a15b;font-size:.56rem;font-weight:950;letter-spacing:.14em}.referral-head h2{margin:.25rem 0 0;font:700 clamp(1.05rem,4vw,1.8rem)/1.08 Georgia,serif}.referral-head span{display:block;margin-top:.35rem;color:#98a6b8;font-size:.68rem;line-height:1.5}.campaign-link{display:inline-flex;min-height:44px;flex:none;align-items:center;border:1px solid #6f5a31;border-radius:11px;background:#1b1820;padding:0 .85rem;color:#f6d78b;font-size:.64rem;font-weight:950;text-decoration:none}.referral-body{display:grid;gap:14px;padding:14px}.invite-box{border:1px solid #304158;border-radius:15px;background:#07101c;padding:13px}.invite-label{display:block;color:#94a3b8;font-size:.55rem;font-weight:950;letter-spacing:.12em}.invite-box>strong{display:block;margin:.35rem 0 .8rem;color:#f6d78b;font:800 1.35rem/1 Georgia,serif;letter-spacing:.08em}.invite-link{display:grid;gap:.35rem}.invite-link span{color:#cbd5e1;font-size:.6rem;font-weight:850}.invite-link input{width:100%;min-height:44px;border:1px solid #304158;border-radius:10px;background:#050b13;padding:0 .7rem;color:#cbd5e1;font:inherit}.invite-actions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.65rem}.invite-actions button{min-height:44px;border:0;border-radius:10px;background:#315e86;padding:0 .85rem;color:#fff;font-size:.64rem;font-weight:950}.invite-actions .secondary{border:1px solid #304158;background:#0e1724}.notice,.error{margin:.6rem 0 0;font-size:.64rem;font-weight:850}.notice{color:#86efac}.error{color:#fda4af}.reward-grid{display:grid;gap:.7rem}.reward-grid article{border:1px solid #263548;border-radius:14px;background:#0b1420;padding:12px}.reward-grid article>span{color:#94a3b8;font-size:.54rem;font-weight:950;letter-spacing:.1em}.reward-grid article>strong{display:block;margin:.32rem 0;color:#f6d78b;font-size:.92rem}.reward-grid article p{margin:0;color:#9daabd;font-size:.64rem;line-height:1.5}.stack-note{margin:0;border-left:3px solid #c6a15b;background:#121721;padding:.7rem .8rem;color:#cbd5e1;font-size:.64rem;line-height:1.5}.referral-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem}.referral-stats div,.milestone{border:1px solid #263548;border-radius:12px;background:#08111e;padding:.7rem}.referral-stats span,.milestone span{display:block;color:#8492a6;font-size:.55rem;font-weight:850}.referral-stats strong,.milestone strong{display:block;margin-top:.2rem;color:#fff;font-size:.82rem}.milestone strong{color:#f6d78b}.loading{margin:0;padding:16px;color:#aab5c4;font-size:.68rem}.campaign-link:focus-visible,.invite-actions button:focus-visible,input:focus-visible{outline:3px solid #7899b8;outline-offset:3px}@media(min-width:720px){.reward-grid{grid-template-columns:repeat(3,1fr)}.referral-stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:620px){.referral-head{align-items:stretch;flex-direction:column}.campaign-link{width:100%;justify-content:center}}
            `]
          })
          export class AccountReferralV238Component implements OnInit {
            readonly account=inject(CustomerAccountService);
            readonly notice=signal('');
            readonly error=signal('');
            async ngOnInit():Promise<void>{if(!this.account.referralSummary()||!this.account.loyaltySettings())await this.account.refresh().catch(()=>undefined);}
            referralLink():string{return this.account.referralLink();}
            discountText(value:number):string{const settings=this.account.loyaltySettings();if(!settings||!settings.referral_checkout_discount_enabled||value<=0)return'';const formatted=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(value);return settings.referral_checkout_discount_mode==='PERCENT'?`%${formatted}`:`${formatted} TL`;}
            async copyReferralLink():Promise<void>{this.notice.set('');this.error.set('');const link=this.referralLink();if(!link){this.error.set('Davet bağlantısı şu anda hazırlanamadı.');return;}try{await navigator.clipboard.writeText(link);this.notice.set('Davet bağlantısı kopyalandı.');}catch{this.error.set('Davet bağlantısı kopyalanamadı. Bağlantıyı alandan seçip kopyalayabilirsiniz.');}}
            async shareReferralLink():Promise<void>{this.notice.set('');this.error.set('');const link=this.referralLink();if(!link){this.error.set('Davet bağlantısı şu anda hazırlanamadı.');return;}if(typeof navigator.share==='function'){try{await navigator.share({title:'Alperler Rent A Car',text:'Alperler Rent A Car davet bağlantımla katıl, uygun işlemlerde sen de avantaj kazan.',url:link});this.notice.set('Davet bağlantısı paylaşım için hazırlandı.');return;}catch(e){if(e instanceof DOMException&&e.name==='AbortError')return;}}await this.copyReferralLink();}
          }
          '''
          referral = '\n'.join(line[10:] if line.startswith('          ') else line for line in referral.splitlines()) + '\n'
          Path('src/components/account-referral-v238.component.ts').write_text(referral)

          # 4) Account landing: one wallet entry only (shell nav), useful appointment shortcut, referral visible immediately.
          p = Path('src/pages/account-dashboard-v150.component.ts')
          s = p.read_text()
          import_anchor = "import { ProfileAdminBridgeService } from '../services/profile-admin-bridge.service';\n"
          if import_anchor not in s: raise SystemExit('dashboard import anchor missing')
          s = s.replace(import_anchor, import_anchor + "import { AccountReferralV238Component } from '../components/account-referral-v238.component';\n", 1)
          s = s.replace('imports: [CommonModule, RouterLink],', 'imports: [CommonModule, RouterLink, AccountReferralV238Component],', 1)
          wallet_header = '            <a routerLink="/account/wallet">Cüzdan ve Belgeler</a>\n'
          if wallet_header not in s: raise SystemExit('dashboard header wallet anchor missing')
          s = s.replace(wallet_header, '', 1)
          wallet_tool = '            <a routerLink="/account/wallet"><small>HESABIM</small><strong>Cüzdan</strong></a>'
          if wallet_tool not in s: raise SystemExit('dashboard tool wallet anchor missing')
          s = s.replace(wallet_tool, '            <a routerLink="/appointment"><small>RANDEVU</small><strong>Randevu Al</strong></a>', 1)
          tools_end = '          </section>\n\n          <section class="overview"'
          if tools_end not in s: raise SystemExit('dashboard tools end anchor missing')
          s = s.replace(tools_end, '          </section>\n\n          <app-account-referral-v238 />\n\n          <section class="overview"', 1)
          p.write_text(s)

          # 5) Source-of-truth migration matching the live V238 repair.
          migration = Path('supabase/migrations/20260903002500_v238_remove_duplicate_mobile_menu_search.sql')
          migration.write_text("""-- V238: Search belongs to the fixed mobile dock only.\nupdate public.navigation_items\nset is_active = false,\n    archived_at = coalesce(archived_at, now()),\n    updated_at = now()\nwhere surface = 'MOBILE_MENU'\n  and item_key = 'search'\n  and archived_at is null;\n""")

          # 6) Regression contract.
          guard = r'''import fs from 'node:fs';
          const read=(p)=>fs.readFileSync(p,'utf8');
          const nav=read('src/services/navigation-config.service.ts');
          const dash=read('src/pages/account-dashboard-v150.component.ts');
          const profile=read('src/components/account-profile-settings-v225.component.ts');
          const referral=read('src/components/account-referral-v238.component.ts');
          const shell=read('src/pages/account-shell.component.ts');
          const migration=read('supabase/migrations/20260903002500_v238_remove_duplicate_mobile_menu_search.sql');
          const assert=(ok,msg)=>{if(!ok){console.error(`V238 FAIL: ${msg}`);process.exitCode=1;}};
          assert(nav.includes("isForbiddenMobileMenuSearch"),'mobile menu runtime Search guard missing');
          assert(nav.includes("surface==='MOBILE_MENU'&&(preset.key==='search'||preset.route==='/search')"),'preset Search reinsertion guard missing');
          assert(nav.includes("surface==='MOBILE_MENU'&&route==='/search'"),'custom Search reinsertion guard missing');
          assert(nav.includes("['search', 'Ara', 'search', '/search']"),'bottom dock Search must remain');
          assert(!dash.includes('routerLink="/account/wallet">Cüzdan ve Belgeler'),'duplicate dashboard wallet header action remains');
          assert(!dash.includes('<small>HESABIM</small><strong>Cüzdan</strong>'),'duplicate dashboard wallet tool remains');
          assert(dash.includes('routerLink="/appointment"><small>RANDEVU</small><strong>Randevu Al</strong>'),'replacement appointment shortcut missing');
          assert(dash.includes('<app-account-referral-v238 />'),'referral is not visible on Profile landing');
          assert(referral.includes('ARKADAŞINI DAVET ET')&&referral.includes('Davet Linkini Kopyala')&&referral.includes('Paylaş'),'canonical referral experience incomplete');
          assert(!profile.includes('class="referral-card"')&&!profile.includes('referralLink()'),'old duplicate referral surface remains in settings');
          const walletMentions=(shell.match(/Cüzdan ve Belgeler/g)||[]).length;
          assert(walletMentions===1,`account shell must own exactly one canonical wallet entry, found ${walletMentions}`);
          assert(migration.includes("surface = 'MOBILE_MENU'")&&migration.includes("item_key = 'search'")&&migration.includes('archived_at'),'migration does not archive mobile-menu Search');
          if(!process.exitCode)console.log('V238 profile/navigation integrity guard passed.');
          '''
          guard = '\n'.join(line[10:] if line.startswith('          ') else line for line in guard.splitlines()) + '\n'
          Path('scripts/check-v238-profile-navigation-integrity.mjs').write_text(guard)
          PY
      - name: Install exact dependency graph
        run: npm ci
      - name: V238 profile and navigation guard
        run: node scripts/check-v238-profile-navigation-integrity.mjs
      - name: Lint
        run: npm run lint --if-present
      - name: Frontend TypeScript
        run: npx tsc -p tsconfig.json --noEmit
      - name: Vercel API TypeScript
        run: npx tsc -p api/tsconfig.json --noEmit
      - name: Production build
        run: npm run build
      - name: Commit V238 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/navigation-config.service.ts src/components/account-profile-settings-v225.component.ts src/components/account-referral-v238.component.ts src/pages/account-dashboard-v150.component.ts scripts/check-v238-profile-navigation-integrity.mjs supabase/migrations/20260903002500_v238_remove_duplicate_mobile_menu_search.sql
          if git diff --cached --quiet; then
            echo "No V238 source changes to commit."
          else
            git commit -m "V238: remove duplicate account navigation and surface referrals"
            git push origin HEAD:v238-profile-navigation-integrity
          fi