name: V101 Responsive Booking Social A11y Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v101-responsive-booking-social-a11y-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply responsive and booking cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def require_change(path, new_text, old_text):
              if new_text == old_text:
                  raise SystemExit(f'No change produced for {path}')
              Path(path).write_text(new_text)

          # Homepage sections: independent phone/tablet/desktop visibility.
          path='src/components/dynamic-home-section.component.ts'
          text=Path(path).read_text()
          old=text
          text=text.replace(
              "return [`theme-${['light','soft','dark','brand','ocean','emerald','sunset','violet','sand','graphite'].includes(theme) ? theme : 'light'}`, `width-${['standard','wide','full'].includes(width) ? width : 'wide'}`];",
              "const classes = [`theme-${['light','soft','dark','brand','ocean','emerald','sunset','violet','sand','graphite'].includes(theme) ? theme : 'light'}`, `width-${['standard','wide','full'].includes(width) ? width : 'wide'}`];\n    if (!this.boolSetting('showOnMobile', true)) classes.push('hide-mobile');\n    if (!this.boolSetting('showOnTablet', true)) classes.push('hide-tablet');\n    if (!this.boolSetting('showOnDesktop', true)) classes.push('hide-desktop');\n    return classes;"
          )
          text=text.replace(
              "  private setting(key: string, fallback: unknown): unknown { const settings = this.section.settings && typeof this.section.settings === 'object' ? this.section.settings : {}; return Object.prototype.hasOwnProperty.call(settings, key) ? settings[key] : fallback; }",
              "  private setting(key: string, fallback: unknown): unknown { const settings = this.section.settings && typeof this.section.settings === 'object' ? this.section.settings : {}; return Object.prototype.hasOwnProperty.call(settings, key) ? settings[key] : fallback; }\n  private boolSetting(key: string, fallback: boolean): boolean { const value = this.setting(key, fallback); return typeof value === 'boolean' ? value : fallback; }"
          )
          marker='    @media(min-width:720px){.view-all{display:flex}'
          if marker not in text: raise SystemExit('Dynamic section media marker missing')
          text=text.replace(marker, "    @media(max-width:767px){.hide-mobile{display:none!important}}@media(min-width:768px) and (max-width:1023px){.hide-tablet{display:none!important}}@media(min-width:1024px){.hide-desktop{display:none!important}}\n"+marker,1)
          require_change(path,text,old)

          # Admin homepage: device toggles within each section editor.
          path='src/pages/admin/admin-homepage.component.ts'
          text=Path(path).read_text(); old=text
          toolbar=re.search(r'(\s*<div class="editor-toolbar">.*?</div>)(\s*<div class="editor-grid">)',text,re.S)
          if not toolbar: raise SystemExit('Admin homepage editor toolbar missing')
          device='''\n                  <fieldset class="device-visibility" [attr.aria-label]="section.title + ' cihaz görünürlüğü'">\n                    <legend>Cihaz görünürlüğü</legend>\n                    <label><input type="checkbox" [ngModel]="boolSetting(section,'showOnMobile',true)" (ngModelChange)="setSetting(section,'showOnMobile',$event)" [name]="section.sectionKey + '-mobile'" [attr.aria-label]="section.title + ' bölümünü telefonda göster'" /><span>Telefon</span></label>\n                    <label><input type="checkbox" [ngModel]="boolSetting(section,'showOnTablet',true)" (ngModelChange)="setSetting(section,'showOnTablet',$event)" [name]="section.sectionKey + '-tablet'" [attr.aria-label]="section.title + ' bölümünü tablette göster'" /><span>Tablet</span></label>\n                    <label><input type="checkbox" [ngModel]="boolSetting(section,'showOnDesktop',true)" (ngModelChange)="setSetting(section,'showOnDesktop',$event)" [name]="section.sectionKey + '-desktop'" [attr.aria-label]="section.title + ' bölümünü bilgisayarda göster'" /><span>Bilgisayar</span></label>\n                  </fieldset>'''
          text=text[:toolbar.end(1)] + device + text[toolbar.end(1):]
          text=text.replace(
              "  setting(section: HomepageSectionRecord, key: string, fallback = ''): any { return Object.prototype.hasOwnProperty.call(section.settings || {}, key) ? section.settings[key] : fallback; }",
              "  setting(section: HomepageSectionRecord, key: string, fallback: any = ''): any { return Object.prototype.hasOwnProperty.call(section.settings || {}, key) ? section.settings[key] : fallback; }\n  boolSetting(section: HomepageSectionRecord, key: string, fallback = true): boolean { const value = this.setting(section, key, fallback); return typeof value === 'boolean' ? value : fallback; }"
          )
          css_marker='.editor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem}'
          if css_marker not in text: raise SystemExit('Admin homepage CSS marker missing')
          text=text.replace(css_marker,css_marker+'.device-visibility{display:flex;flex-wrap:wrap;gap:.45rem;border:1px solid #dbe4ef;border-radius:14px;background:#f8fafc;padding:.7rem}.device-visibility legend{padding:0 .25rem;color:#475569;font-size:.62rem;font-weight:950;text-transform:uppercase;letter-spacing:.05em}.device-visibility label{display:flex;min-height:42px;align-items:center;gap:.4rem;border-radius:10px;background:#fff;padding:0 .7rem;font-size:.68rem;font-weight:900}.device-visibility input{width:18px;height:18px}',1)
          require_change(path,text,old)

          # Rental detail: one clear CTA; all selections and totals live in checkout.
          path='src/pages/car-detail.component.ts'
          text=Path(path).read_text(); old=text
          replacement='''\n          <aside id="rental-reservation" class="rounded-2xl border border-blue-200 bg-white p-4 shadow-xl shadow-blue-950/5 sm:p-6 lg:sticky lg:top-[116px]" aria-labelledby="reservation-title">\n            <p class="text-xs font-black uppercase tracking-wider text-blue-600">Rezervasyon</p>\n            <h2 id="reservation-title" class="mt-1 font-serif text-2xl font-black">Bu aracı rezerve edin</h2>\n            <p class="mt-2 text-sm leading-6 text-slate-500">Tarih, teslim ve iade noktası, şoför tercihi ve ek hizmetlerin tamamını tek rezervasyon ekranında seçin.</p>\n            <div class="mt-5 rounded-2xl bg-slate-950 p-4 text-white"><span class="text-xs font-bold uppercase text-blue-300">Günlük başlangıç fiyatı</span><strong class="mt-1 block text-3xl">{{ vehicle.price | turkishCurrency }}</strong><p class="mt-2 text-xs leading-5 text-slate-400">Nihai tutar rezervasyondaki tarih ve hizmet seçimlerinize göre otomatik güncellenir.</p></div>\n            <button type="button" (click)="reserve(vehicle)" [disabled]="vehicle.isAvailable === false" aria-label="Bu araç için rezervasyon oluştur" class="mt-4 flex min-h-14 w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 font-black text-white shadow-lg shadow-blue-600/20 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"><mat-icon aria-hidden="true">event_available</mat-icon>Rezervasyon Oluştur</button>\n            <button type="button" (click)="whatsappInquiry()" aria-label="Bu araç hakkında WhatsApp ile bilgi al" class="mt-2 flex min-h-12 w-full items-center justify-center gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-5 font-black text-emerald-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"><mat-icon aria-hidden="true">chat</mat-icon>WhatsApp ile Sor</button>\n          </aside>'''
          text,n=re.subn(r'\n\s*<aside id="rental-calculator".*?</aside>',replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('Rental calculator block missing')
          text=re.sub(r'<button type="button" \(click\)="reserveFromSticky\(vehicle\)"[^>]*>.*?</button>', '<button type="button" (click)="reserve(vehicle)" [disabled]="vehicle.isAvailable === false" aria-label="Bu araç için rezervasyon oluştur" class="flex min-h-12 items-center justify-center gap-2 rounded-xl bg-slate-950 font-black text-white disabled:bg-slate-300 disabled:text-slate-500"><mat-icon aria-hidden="true">event_available</mat-icon>Rezervasyon Oluştur</button>', text, count=1, flags=re.S)
          reserve='''  reserve(vehicle: Car): void {\n    if (vehicle.isAvailable === false) return;\n    const hasDates = this.validDates();\n    this.dateError.set("");\n    this.carService.setBookingRequest({\n      type: "RENTAL", item: vehicle, itemName: `${vehicle.brand || ""} ${vehicle.model || ""}`.trim(), image: vehicle.image || vehicle.images?.[0],\n      basePrice: Number(vehicle.price || 0), totalPrice: hasDates ? this.totalPrice() : Number(vehicle.price || 0),\n      startDate: hasDates ? this.startDate() : undefined, endDate: hasDates ? this.endDate() : undefined,\n      days: hasDates ? this.totalDays() : undefined, rentalDuration: "daily", withDriver: vehicle.driverOption === "WITH_DRIVER"\n    });\n    void this.router.navigate(["/contact"]);\n  }'''
          text,n=re.subn(r'  reserve\(vehicle: Car\): void \{.*?\n  \}',reserve,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('Reserve method missing')
          require_change(path,text,old)

          # Booking checkout copy makes central pricing behavior explicit.
          path='src/pages/booking-checkout.component.ts'
          text=Path(path).read_text(); old=text
          text=text.replace('<h2 id="rental-details-title" class="mb-5 text-lg font-black text-white">1. Kiralama Detayları</h2>', '<h2 id="rental-details-title" class="text-lg font-black text-white">1. Kiralama Detayları</h2><p class="mb-5 mt-1 text-sm leading-6 text-slate-400">Tarih, teslimat, şoför tercihi ve ek hizmetler değiştikçe tahmini toplam otomatik güncellenir.</p>',1)
          require_change(path,text,old)

          # Social links: do not claim success until the refreshed live config matches.
          path='src/pages/admin/admin-footer.component.ts'
          text=Path(path).read_text(); old=text
          social_re=re.compile(r'''      const current = this\.carService\.getConfig\(\);\n      await this\.catalog\.saveConfig\(\{\n        \.\.\.current,\n        instagramUrl: this\.instagramUrl\.trim\(\),\n        tiktokUrl: this\.tiktokUrl\.trim\(\),\n        youtubeUrl: this\.youtubeUrl\.trim\(\),\n        twitterUrl: this\.xUrl\.trim\(\),\n        facebookUrl: this\.facebookUrl\.trim\(\),\n      \}\);\n      await this\.carService\.refreshCloudCatalog\(true\);\n      this\.form = \{ \.\.\.this\.footer\.settings\(\) \};\n      this\.toast\.show\('Footer ve sosyal medya ayarları kaydedildi ve siteye uygulandı\.', 'success'\);''')
          desired='''      const desired = {\n        instagramUrl: this.instagramUrl.trim(), tiktokUrl: this.tiktokUrl.trim(), youtubeUrl: this.youtubeUrl.trim(),\n        twitterUrl: this.xUrl.trim(), facebookUrl: this.facebookUrl.trim(),\n      };\n      const current = this.carService.getConfig()();\n      await this.catalog.saveConfig({ ...current, ...desired });\n      await this.carService.refreshCloudCatalog(true);\n      const verified = this.carService.getConfig()();\n      const mismatch = Object.entries(desired).some(([key, value]) => String((verified as any)[key] || '').trim() !== value);\n      if (mismatch) throw new Error('Sosyal medya bağlantıları kaydedildi olarak doğrulanamadı. Lütfen tekrar deneyin.');\n      this.instagramUrl = verified.instagramUrl || ''; this.tiktokUrl = verified.tiktokUrl || ''; this.youtubeUrl = verified.youtubeUrl || '';\n      this.xUrl = verified.twitterUrl || ''; this.facebookUrl = verified.facebookUrl || '';\n      this.form = { ...this.footer.settings() };\n      this.toast.show('Footer ve sosyal medya bağlantıları doğrulandı ve siteye uygulandı.', 'success');'''
          text,n=social_re.subn(desired,text,count=1)
          if n!=1: raise SystemExit('Admin footer social save block missing')
          require_change(path,text,old)

          # Runtime a11y: protect icon-only anchors as well as form controls/buttons.
          path='src/services/accessibility-runtime.service.ts'
          text=Path(path).read_text(); old=text
          text=text.replace("if (control.matches('input,select,textarea,button')) {\n      this.ensureAccessibleName(control);\n    }", "if (control.matches('input,select,textarea,button,a[href]')) {\n      this.ensureAccessibleName(control);\n    }",1)
          text=text.replace("if (control.tagName === 'BUTTON' && this.visibleText(control)) return true;", "if ((control.tagName === 'BUTTON' || control.tagName === 'A') && this.visibleText(control)) return true;",1)
          text=text.replace("add: 'Ekle', remove: 'Kaldır', expand_more: 'Seçenekler', more_vert: 'Seçenekler',", "add: 'Ekle', remove: 'Kaldır', expand_more: 'Seçenekler', more_vert: 'Seçenekler',\n        event_available: 'Rezervasyon', call: 'Telefonla ara', share: 'Paylaş', chevron_left: 'Önceki', chevron_right: 'Sonraki', tune: 'Ayarlar', save: 'Kaydet',",1)
          text=text.replace("    if (control.tagName === 'SELECT') return 'Seçim';", "    if (control.tagName === 'A') { const icon = control.querySelector('mat-icon')?.textContent?.trim(); const title = control.getAttribute('title')?.trim(); if (title) return title; const names: Record<string,string> = { home:'Ana sayfa', call:'Telefonla ara', chat:'Mesaj gönder', event_available:'Rezervasyon', arrow_back:'Geri', search:'Ara', favorite:'Favoriler', favorite_border:'Favoriler' }; if (icon && names[icon]) return names[icon]; return 'Bağlantıyı aç'; }\n    if (control.tagName === 'SELECT') return 'Seçim';",1)
          require_change(path,text,old)

          # Optional real-distance pricing hook; no rate is invented.
          path='src/models/site-config.model.ts'
          text=Path(path).read_text(); old=text
          text=text.replace('  pricePerHour?: number;\n  flatPrice?: number;', '  pricePerHour?: number;\n  pricePerKm?: number;\n  flatPrice?: number;',1)
          require_change(path,text,old)
          PY
      - name: Verify requested behavior
        run: |
          grep -q 'showOnMobile' src/pages/admin/admin-homepage.component.ts
          grep -q 'hide-tablet' src/components/dynamic-home-section.component.ts
          grep -q 'id="rental-reservation"' src/pages/car-detail.component.ts
          ! grep -q 'id="rental-calculator"' src/pages/car-detail.component.ts
          grep -q 'Rezervasyon Oluştur' src/pages/car-detail.component.ts
          grep -q 'bağlantıları doğrulandı' src/pages/admin/admin-footer.component.ts
          grep -q "a\[href\]" src/services/accessibility-runtime.service.ts
          git diff --check
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.api.json
      - run: npm run build
      - name: Commit V101
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dynamic-home-section.component.ts src/pages/admin/admin-homepage.component.ts src/pages/car-detail.component.ts src/pages/booking-checkout.component.ts src/pages/admin/admin-footer.component.ts src/services/accessibility-runtime.service.ts src/models/site-config.model.ts
          git commit -m "V101: responsive controls booking cleanup social verification and a11y"
          git push origin main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/v101-responsive-booking-social-a11y-once.yml
          git commit -m "ci: remove V101 one-shot workflow"
          git push origin main
