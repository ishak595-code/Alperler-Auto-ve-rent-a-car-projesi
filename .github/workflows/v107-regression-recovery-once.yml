# Retry marker: apply the verified V107 recovery exactly once.
name: V107 Regression Recovery Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v107-regression-recovery-once.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Recover approved mobile and booking flows
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))
              print("patched", path)

          home = "src/pages/home-v71.component.ts"
          replace_once(home,
              '.hero-copy-block{transform:none}.hero-stage{display:block;padding-top:1.05rem;padding-bottom:1.4rem}.desktop-search,.planner,.trust-row{display:none!important}',
              '.hero-copy-block,.planner{transform:none}.hero-stage{display:block;padding-top:1.05rem;padding-bottom:1.4rem}.desktop-search{display:none!important}.trust-row{margin-bottom:.15rem}')

          booking = "src/pages/booking-checkout.component.ts"
          replace_once(booking, 'import { AccessibleDateFieldComponent } from "../components/accessible-date-field.component";\n', '')
          replace_once(booking, 'imports: [CommonModule, FormsModule, MatIconModule, AccessibleDateFieldComponent],', 'imports: [CommonModule, FormsModule, MatIconModule],')
          old_dates = '''                <div class="[--date-bg:#020617] [--date-border:#334155] [--date-color:#fff] [--date-muted:#94a3b8]">
                  <app-accessible-date-field label="Alış tarihi" [value]="startDate" [min]="today" (valueChange)="setStartDate($event)" />
                </div>

                <div class="[--date-bg:#020617] [--date-border:#334155] [--date-color:#fff] [--date-muted:#94a3b8]">
                  <app-accessible-date-field label="İade tarihi" [value]="endDate" [min]="startDate || today" (valueChange)="setEndDate($event)" />
                </div>'''
          new_dates = '''                <label for="booking-start-date" class="block">
                  <span class="mb-2 block text-xs font-bold uppercase text-slate-400">Alış Tarihi</span>
                  <input id="booking-start-date" type="date" [min]="today" [(ngModel)]="startDate" (ngModelChange)="setStartDate($event)" aria-label="Araç alış tarihi seç" title="Araç alış tarihi seç" class="min-h-12 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500" />
                </label>

                <label for="booking-end-date" class="block">
                  <span class="mb-2 block text-xs font-bold uppercase text-slate-400">İade Tarihi</span>
                  <input id="booking-end-date" type="date" [min]="startDate || today" [(ngModel)]="endDate" (ngModelChange)="setEndDate($event)" aria-label="Araç iade tarihi seç" title="Araç iade tarihi seç" class="min-h-12 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500" />
                </label>'''
          replace_once(booking, old_dates, new_dates)
          old_extras_button = '''              <button type="button" (click)="openExtras()" class="mt-5 flex min-h-14 w-full items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-950 px-4 text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400" aria-label="Teslimat, şoför tercihi ve ek hizmetleri seç">
                <span class="flex min-w-0 items-center gap-3">
                  <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-blue-500/15 text-blue-300"><mat-icon aria-hidden="true">tune</mat-icon></span>
                  <span class="min-w-0">
                    <strong class="block text-sm text-white">Teslimat, Şoför ve Ek Hizmetler</strong>
                    <small class="block truncate text-xs text-slate-400">{{ extrasButtonSummary() }}</small>
                  </span>
                </span>
                <mat-icon aria-hidden="true">chevron_right</mat-icon>
              </button>'''
          new_extras_button = '''              <div class="mt-5 grid gap-3 sm:grid-cols-3" aria-label="Hızlı hizmet seçenekleri">
                @for (extra of quickExtras(); track extra.id) {
                  <label class="flex min-h-14 items-center gap-3 rounded-xl border border-slate-700 bg-slate-950 px-4" [class.opacity-50]="extraUnavailable(extra)">
                    <input type="checkbox" class="h-5 w-5" [checked]="isExtraSelected(extra.id)" [disabled]="extraLocked(extra) || extraUnavailable(extra)" (change)="toggleExtra(extra)" [attr.aria-label]="extra.label + ' seçeneğini aç veya kapat'" />
                    <span class="min-w-0"><strong class="block text-sm text-white">{{ extra.label }}</strong><small class="block text-xs text-slate-400">{{ extraPriceLabel(extra) }}</small></span>
                  </label>
                }
              </div>

              <button type="button" (click)="openExtras()" class="mt-4 flex min-h-14 w-full items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-950 px-4 text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400" aria-label="Teslimat ve diğer hizmetleri seç">
                <span class="flex min-w-0 items-center gap-3">
                  <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-blue-500/15 text-blue-300"><mat-icon aria-hidden="true">tune</mat-icon></span>
                  <span class="min-w-0">
                    <strong class="block text-sm text-white">Teslimat ve Diğer Hizmetler</strong>
                    <small class="block truncate text-xs text-slate-400">{{ extrasButtonSummary() }}</small>
                  </span>
                </span>
                <mat-icon aria-hidden="true">chevron_right</mat-icon>
              </button>'''
          replace_once(booking, old_extras_button, new_extras_button)
          replace_once(booking,
              '  readonly pickupChoices = computed(() => this.buildLocationChoices(this.branchService.pickupPoints(), "pickupLocations"));',
              '  readonly quickExtras = computed(() => this.rentalExtras().filter((item) => ["driver", "child-seat", "extra-protection"].includes(item.id)));\n\n  readonly pickupChoices = computed(() => this.buildLocationChoices(this.branchService.pickupPoints(), "pickupLocations"));')

          detail = "src/pages/car-detail.component.ts"
          p = Path(detail)
          text = p.read_text()
          changes = {
              'bg-slate-50 pb-32 text-slate-950': 'bg-slate-950 pb-32 text-slate-100',
              'border-slate-200 bg-white': 'border-slate-800 bg-slate-900',
              'bg-slate-50 p-3': 'bg-slate-950 p-3',
              'divide-slate-100': 'divide-slate-800',
              'text-slate-500': 'text-slate-400',
              'text-slate-600': 'text-slate-300',
              'text-blue-700': 'text-blue-300',
              'border-blue-200 bg-white': 'border-blue-900/60 bg-slate-900',
              'referrerpolicy="no-referrer" ': '',
          }
          for old, new in changes.items():
              if old not in text:
                  raise SystemExit(f"{detail}: missing expected token {old!r}")
              text = text.replace(old, new)
          p.write_text(text)

          old_bar = '''        <div class="fixed inset-x-0 bottom-0 z-[70] border-t border-slate-200 bg-white/95 p-2 pb-[max(.5rem,env(safe-area-inset-bottom))] backdrop-blur lg:hidden" aria-label="Araç hızlı işlemleri">
          <div class="mx-auto grid max-w-2xl grid-cols-3 gap-2">
            <a [href]="phoneHref()" aria-label="Telefonla ara" class="flex min-h-12 items-center justify-center gap-1 rounded-xl bg-slate-100 px-2 text-sm font-black text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"><mat-icon aria-hidden="true">call</mat-icon><span>Ara</span></a>
            <button type="button" (click)="whatsappInquiry()" aria-label="WhatsApp ile bilgi al" class="flex min-h-12 items-center justify-center gap-1 rounded-xl bg-emerald-600 px-2 text-sm font-black text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400"><mat-icon aria-hidden="true">chat</mat-icon><span>WhatsApp</span></button>
            <button type="button" (click)="reserve(vehicle)" [disabled]="vehicle.isAvailable === false" aria-label="Bu araç için rezervasyon oluştur" class="flex min-h-12 items-center justify-center gap-1 rounded-xl bg-slate-950 px-2 text-sm font-black text-white disabled:bg-slate-300 disabled:text-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"><mat-icon aria-hidden="true">event_available</mat-icon><span>Rezerve Et</span></button>
          </div>
        </div>'''
          new_bar = '''        <div class="fixed inset-x-0 bottom-0 z-[70] border-t border-slate-700 bg-slate-950/98 p-2 pb-[max(.5rem,env(safe-area-inset-bottom))] backdrop-blur lg:hidden" aria-label="Araç hızlı işlemleri">
          <div class="mx-auto grid max-w-2xl grid-cols-3 gap-2">
            <a [href]="phoneHref()" aria-label="Telefonla ara" class="flex min-h-12 min-w-0 items-center justify-center rounded-xl bg-slate-100 px-1 text-xs font-black text-slate-900 no-underline whitespace-nowrap focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">Ara</a>
            <button type="button" (click)="whatsappInquiry()" aria-label="WhatsApp ile bilgi al" class="min-h-12 min-w-0 rounded-xl bg-emerald-600 px-1 text-xs font-black text-white whitespace-nowrap focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">WhatsApp</button>
            <button type="button" (click)="reserve(vehicle)" [disabled]="vehicle.isAvailable === false" aria-label="Bu araç için rezervasyon oluştur" class="min-h-12 min-w-0 rounded-xl bg-blue-600 px-1 text-xs font-black text-white whitespace-nowrap disabled:bg-slate-700 disabled:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">Rezerve Et</button>
          </div>
        </div>'''
          replace_once(detail, old_bar, new_bar)

          dock = "src/components/customer-mobile-dock.component.ts"
          replace_once(dock, 'import { NavigationConfigService } from "../services/navigation-config.service";\n', 'import { NavigationConfigService } from "../services/navigation-config.service";\nimport { CarService } from "../services/car.service";\n')
          replace_once(dock, '  readonly navigation = inject(NavigationConfigService);\n  readonly hidden = signal(false);', '  readonly navigation = inject(NavigationConfigService);\n  private readonly carService = inject(CarService);\n  readonly hidden = signal(false);')
          replace_once(dock, '    const shouldHide =\n      path.startsWith("/admin") ||', '    const bookingCheckoutActive = path.startsWith("/contact") && this.carService.getBookingRequest() !== null;\n    const shouldHide =\n      bookingCheckoutActive ||\n      path.startsWith("/admin") ||')

          home_text = Path(home).read_text(); booking_text = Path(booking).read_text(); detail_text = Path(detail).read_text(); dock_text = Path(dock).read_text()
          assert '.desktop-search,.planner,.trust-row{display:none!important}' not in home_text
          assert '.desktop-search{display:none!important}' in home_text and '<aside class="planner"' in home_text
          assert 'AccessibleDateFieldComponent' not in booking_text and '<app-accessible-date-field' not in booking_text and 'type="date"' in booking_text and 'quickExtras' in booking_text
          assert 'rental-calculator' not in detail_text and '>Ara</a>' in detail_text and '>WhatsApp</button>' in detail_text and '>Rezerve Et</button>' in detail_text
          assert 'bookingCheckoutActive' in dock_text
          print('V107 regression invariants passed')
          PY

      - name: Verify TypeScript and production build
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit recovered customer flow and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v107-regression-recovery-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V107: recover mobile planner rental detail and booking flow"
          git push origin HEAD:main
