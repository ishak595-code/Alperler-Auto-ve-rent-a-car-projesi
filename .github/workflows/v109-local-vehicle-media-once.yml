name: V109 Local Vehicle Media Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v109-local-vehicle-media-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Download and localize canonical vehicle media
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/v109_localize_vehicle_media.py
          test "$(find public/media/vehicles -type f -name '*.webp' | wc -l)" -eq 25
          node scripts/check-vehicle-media.mjs
          git diff --check

      - name: Validate application after migration
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npx tsc -p tsconfig.api.json --noEmit
          npm run build

      - name: Commit verified V109 migration
        run: |
          set -euo pipefail
          rm -f .github/workflows/v109-local-vehicle-media-once.yml scripts/v109_localize_vehicle_media.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V109: localize all rental and sale vehicle media"
          git push origin HEAD:main
