name: V110 Accessible Buttons Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v110-accessible-buttons-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Label every detected icon-only button
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, flags=0):
              p=Path(path); text=p.read_text(encoding='utf-8')
              new,count=re.subn(pattern,replacement,text,count=1,flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: pattern not found: {pattern[:100]}')
              p.write_text(new,encoding='utf-8'); print('patched',path)

          g='src/components/gemini-advisor.component.ts'
          sub(g,r'<button\s*\n\s*\(click\)="showWelcomeBubble\.set\(false\)"', '<button\n                  type="button"\n                  (click)="showWelcomeBubble.set(false)"\n                  aria-label="Karşılama mesajını kapat"')
          sub(g,r'<button\s*\n\s*\(click\)="toggleConversationMode\(\)"\s*\n\s*class="absolute top-4 right-4', '<button\n                type="button"\n                (click)="toggleConversationMode()"\n                aria-label="Sesli görüşme modunu kapat"\n                class="absolute top-4 right-4')
          sub(g,r'<button\s*\n\s*\(click\)="toggleVoice\(\)"\s*\n\s*class="p-4 rounded-full bg-slate-800', '<button\n                  type="button"\n                  (click)="toggleVoice()"\n                  [attr.aria-label]="isVoiceEnabled() ? \'Asistan sesini kapat\' : \'Asistan sesini aç\'"\n                  class="p-4 rounded-full bg-slate-800')
          sub(g,r'<button\s*\n\s*\(click\)="stopSpeaking\(\)"\s*\n\s*class="p-4 rounded-full bg-red-500/20', '<button\n                  type="button"\n                  (click)="stopSpeaking()"\n                  aria-label="Asistan konuşmasını durdur"\n                  class="p-4 rounded-full bg-red-500/20')

          t='src/components/toast.component.ts'
          sub(t,r'<button\s*\n\s*\(click\)="toastService\.remove\(toast\.id\)"', '<button\n            type="button"\n            (click)="toastService.remove(toast.id)"\n            aria-label="Bildirimi kapat"')

          b='src/pages/admin/admin-blog.component.ts'
          sub(b,r'<button \(click\)="editPost\(post\)" class=', '<button type="button" (click)="editPost(post)" [attr.aria-label]="post.title + \' yazısını düzenle\'" class=')
          sub(b,r'<button \(click\)="deletePost\(post\.id\)" class=', '<button type="button" (click)="deletePost(post.id)" [attr.aria-label]="post.title + \' yazısını sil\'" class=')

          p='src/pages/track-car.component.ts'
          sub(p,r'<button \(click\)="goBack\(\)" class=', '<button type="button" (click)="goBack()" aria-label="Canlı takip ekranından geri dön" class=')
          sub(p,r'<button title="Yakınlaştır" class=', '<button type="button" title="Yakınlaştır" aria-label="Haritayı yakınlaştır" class=')
          sub(p,r'<button title="Uzaklaştır" class=', '<button type="button" title="Uzaklaştır" aria-label="Haritayı uzaklaştır" class=')
          sub(p,r'<button title="Aracı Ortala" class=', '<button type="button" title="Aracı Ortala" aria-label="Aracı haritada ortala" class=')
          sub(p,r'<button class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 transition-colors active:scale-95">', '<button type="button" aria-label="Sürücüyü telefonla ara" class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 transition-colors active:scale-95">')
          PY
          rm -f scripts/v109-unlabeled-buttons.txt
          git diff --check

      - name: Enforce accessibility and media guards
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run a11y:buttons
          npm run media:vehicles
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit verified fixes
        run: |
          set -euo pipefail
          rm -f .github/workflows/v110-accessible-buttons-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V110: eliminate unlabeled icon buttons"
          git push origin HEAD:main
