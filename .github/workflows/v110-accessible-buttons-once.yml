name: V110 Accessible Buttons Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v110-accessible-buttons-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Label all detected icon-only buttons
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:80]}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print('patched', path, old.strip().splitlines()[0])

          g = 'src/components/gemini-advisor.component.ts'
          replace(g,
'''                <button
                  (click)="showWelcomeBubble.set(false)"
                  class="absolute -top-2 -right-2 text-slate-400 hover:text-slate-600"
                >''',
'''                <button
                  type="button"
                  (click)="showWelcomeBubble.set(false)"
                  aria-label="Karşılama mesajını kapat"
                  class="absolute -top-2 -right-2 text-slate-400 hover:text-slate-600"
                >''')
          replace(g,
'''              <button
                (click)="toggleConversationMode()"
                class="absolute top-4 right-4 text-white/70 hover:text-white p-2"
              >''',
'''              <button
                type="button"
                (click)="toggleConversationMode()"
                aria-label="Sesli görüşme modunu kapat"
                class="absolute top-4 right-4 text-white/70 hover:text-white p-2"
              >''')
          replace(g,
'''                <button
                  (click)="toggleVoice()"
                  class="p-4 rounded-full bg-slate-800 hover:bg-slate-700 transition-colors border border-slate-700"''',
'''                <button
                  type="button"
                  (click)="toggleVoice()"
                  [attr.aria-label]="isVoiceEnabled() ? 'Asistan sesini kapat' : 'Asistan sesini aç'"
                  class="p-4 rounded-full bg-slate-800 hover:bg-slate-700 transition-colors border border-slate-700"''')
          replace(g,
'''                <button
                  (click)="stopSpeaking()"
                  class="p-4 rounded-full bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 transition-colors"
                >''',
'''                <button
                  type="button"
                  (click)="stopSpeaking()"
                  aria-label="Asistan konuşmasını durdur"
                  class="p-4 rounded-full bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 transition-colors"
                >''')

          t = 'src/components/toast.component.ts'
          replace(t,
'''          <button
            (click)="toastService.remove(toast.id)"
            class="text-slate-400 hover:text-slate-600"
          >''',
'''          <button
            type="button"
            (click)="toastService.remove(toast.id)"
            aria-label="Bildirimi kapat"
            class="text-slate-400 hover:text-slate-600"
          >''')

          b = 'src/pages/admin/admin-blog.component.ts'
          replace(b,
'''                         <button (click)="editPost(post)" class="p-2 bg-white/90 text-blue-600 rounded-full hover:bg-white shadow backdrop-blur-sm transition-all transform opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0" title="Düzenle">''',
'''                         <button type="button" (click)="editPost(post)" [attr.aria-label]="post.title + ' yazısını düzenle'" class="p-2 bg-white/90 text-blue-600 rounded-full hover:bg-white shadow backdrop-blur-sm transition-all transform opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0" title="Düzenle">''')
          replace(b,
'''                         <button (click)="deletePost(post.id)" class="p-2 bg-white/90 text-red-600 rounded-full hover:bg-red-50 shadow backdrop-blur-sm transition-all transform opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 delay-75" title="Sil">''',
'''                         <button type="button" (click)="deletePost(post.id)" [attr.aria-label]="post.title + ' yazısını sil'" class="p-2 bg-white/90 text-red-600 rounded-full hover:bg-red-50 shadow backdrop-blur-sm transition-all transform opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 delay-75" title="Sil">''')

          p = 'src/pages/track-car.component.ts'
          replace(p,
'''            <button (click)="goBack()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-500 hover:text-slate-900 shadow-sm border border-slate-200 transition-colors">''',
'''            <button type="button" (click)="goBack()" aria-label="Canlı takip ekranından geri dön" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-500 hover:text-slate-900 shadow-sm border border-slate-200 transition-colors">''')
          replace(p,
'''          <button title="Yakınlaştır" class="w-12 h-12 bg-white rounded-xl shadow-lg border border-slate-200 text-slate-700 hover:text-blue-600 hover:bg-slate-50 transition-colors flex items-center justify-center active:scale-95">''',
'''          <button type="button" title="Yakınlaştır" aria-label="Haritayı yakınlaştır" class="w-12 h-12 bg-white rounded-xl shadow-lg border border-slate-200 text-slate-700 hover:text-blue-600 hover:bg-slate-50 transition-colors flex items-center justify-center active:scale-95">''')
          replace(p,
'''          <button title="Uzaklaştır" class="w-12 h-12 bg-white rounded-xl shadow-lg border border-slate-200 text-slate-700 hover:text-blue-600 hover:bg-slate-50 transition-colors flex items-center justify-center active:scale-95">''',
'''          <button type="button" title="Uzaklaştır" aria-label="Haritayı uzaklaştır" class="w-12 h-12 bg-white rounded-xl shadow-lg border border-slate-200 text-slate-700 hover:text-blue-600 hover:bg-slate-50 transition-colors flex items-center justify-center active:scale-95">''')
          replace(p,
'''          <button title="Aracı Ortala" class="w-12 h-12 bg-white rounded-xl shadow-lg border border-slate-200 text-blue-600 hover:bg-blue-50 transition-colors flex items-center justify-center active:scale-95 mt-2">''',
'''          <button type="button" title="Aracı Ortala" aria-label="Aracı haritada ortala" class="w-12 h-12 bg-white rounded-xl shadow-lg border border-slate-200 text-blue-600 hover:bg-blue-50 transition-colors flex items-center justify-center active:scale-95 mt-2">''')
          replace(p,
'''            <button class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 transition-colors active:scale-95">''',
'''            <button type="button" aria-label="Sürücüyü telefonla ara" class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 transition-colors active:scale-95">''')
          PY
          rm -f scripts/v109-unlabeled-buttons.txt
          git diff --check

      - name: Validate zero unlabeled buttons and application
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run a11y:buttons
          npm run media:vehicles
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit verified accessibility cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/v110-accessible-buttons-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V110: eliminate unlabeled icon buttons"
          git push origin HEAD:main
