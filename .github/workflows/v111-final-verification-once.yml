name: V111 Final Verification Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v111-final-verification-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TalkBack accessibility guard
        run: npm run a11y:buttons

      - name: Rental and sale media guard
        run: npm run media:vehicles

      - name: Frontend TypeScript
        run: npm run lint

      - name: API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: All Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done

      - name: Production build
        run: npm run build

      - name: Remove verifier after success
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v111-final-verification-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: verify V111 final media and accessibility tree"
          git push origin HEAD:main
