name: V112 Authoritative Vehicle Data Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v112-authoritative-vehicle-data-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Make rental and sale catalogue server authoritative
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn):
              p=Path(path); before=p.read_text(encoding='utf-8'); after=fn(before)
              if before==after: raise SystemExit(f'{path}: no change produced')
              p.write_text(after,encoding='utf-8'); print('patched',path)

          def car_service(text):
              text, a = re.subn(r'\n    effect\(\(\) =>\s*\n?\s*localStorage\.setItem\(\s*\n?\s*"db_cars_v12"[\s\S]*?\n    \);', '', text, count=1)
              text, b = re.subn(r'\n    effect\(\(\) =>\s*\n?\s*localStorage\.setItem\(\s*\n?\s*"db_saleCars_v12"[\s\S]*?\n    \);', '', text, count=1)
              text, c = re.subn(r'\n    this\.readStorage\("db_cars_v12", \(value\) => \{[\s\S]*?\n    \}\);', '', text, count=1)
              text, d = re.subn(r'\n    this\.readStorage\("db_saleCars_v12", \(value\) => \{[\s\S]*?\n    \}\);', '', text, count=1)
              if (a,b,c,d)!=(1,1,1,1): raise SystemExit(f'car.service cache blocks {(a,b,c,d)}')
              marker='    localStorage.removeItem("db_faqs");\n'
              if marker not in text: raise SystemExit('car.service purge marker missing')
              purge='''    localStorage.removeItem("db_faqs");\n\n    // Supabase is the authority for rental/sale inventory. Remove every old\n    // browser snapshot so a previous app version cannot restore stale media.\n    for (let index = localStorage.length - 1; index >= 0; index -= 1) {\n      const key = localStorage.key(index);\n      if (key && (key.startsWith("db_cars") || key.startsWith("db_saleCars"))) {\n        localStorage.removeItem(key);\n      }\n    }\n'''
              return text.replace(marker,purge,1)
          patch('src/services/car.service.ts',car_service)

          def catalog_service(text):
              text,n=re.subn(r'async loadVehicles\(fresh = false\): Promise<Vehicle\[\]> \{\s*return this\.loadList<Vehicle>\("vehicles", fresh\);\s*\}', 'async loadVehicles(_fresh = false): Promise<Vehicle[]> {\n    // Rental and sale inventory is always fetched fresh; stale catalogue responses are forbidden.\n    return this.loadList<Vehicle>("vehicles", true);\n  }', text,count=1)
              if n!=1: raise SystemExit('catalog.service loadVehicles not found')
              old='        listingOrigin: row["listing_origin"] || undefined,\n        updatedAt: row["updated_at"],'
              if old not in text: raise SystemExit('catalog.service createdAt insertion point missing')
              return text.replace(old,'        listingOrigin: row["listing_origin"] || undefined,\n        createdAt: row["created_at"] || undefined,\n        updatedAt: row["updated_at"],',1)
          patch('src/services/catalog.service.ts',catalog_service)

          def admin_editor(text):
              text,n1=re.subn(r'\n\s*images: record\.images\.filter\(Boolean\)\.slice\(0, 30\),','',text,count=1)
              text,n2=re.subn(r'\n\s*cover_image: record\.coverImage\?\.trim\(\) \|\| record\.images\[0\] \|\| null,','',text,count=1)
              if (n1,n2)!=(1,1): raise SystemExit(f'admin editor media fields {(n1,n2)}')
              return text
          patch('src/services/catalog-admin-editor.service.ts',admin_editor)

          def catalog_api(text):
              anchor='''function booleanValue(value: unknown): boolean {\n  return value === true;\n}\n'''
              if anchor not in text: raise SystemExit('api booleanValue anchor missing')
              helper='''function booleanValue(value: unknown): boolean {\n  return value === true;\n}\n\nconst VEHICLE_MEDIA_PREFIX =\n  "https://hrztrgjvgdnaurejnsgs.supabase.co/storage/v1/object/public/catalog-media/";\n\nfunction trustedVehicleMediaUrl(value: unknown): value is string {\n  return typeof value === "string" && value.trim().startsWith(VEHICLE_MEDIA_PREFIX);\n}\n'''
              text=text.replace(anchor,helper,1)
              text,ncache=re.subn(r'case "vehicles":\s*return "public, max-age=30, s-maxage=120, stale-while-revalidate=3600";', 'case "vehicles":\n      return "no-store";',text,count=1)
              if ncache!=1: raise SystemExit('api vehicle cache rule missing')
              old='''  const images = Array.isArray(input.images)\n    ? input.images.filter((value: unknown) => typeof value === "string" && value.length <= 2048).slice(0, 30)\n    : [];'''
              if old not in text: raise SystemExit('api normalize images block missing')
              new='''  const submittedImages = Array.isArray(input.images)\n    ? input.images.filter((value: unknown) => typeof value === "string" && value.length <= 2048).slice(0, 30)\n    : [];\n  const submittedCover = clean(input.image, 2048);\n  if (submittedImages.some((value: string) => !trustedVehicleMediaUrl(value))) {\n    throw new Error("VEHICLE_MEDIA_STORAGE_ONLY");\n  }\n  if (submittedCover && !trustedVehicleMediaUrl(submittedCover)) {\n    throw new Error("VEHICLE_MEDIA_STORAGE_ONLY");\n  }\n  const images = submittedImages;'''
              text=text.replace(old,new,1)
              text,ncover=re.subn(r'cover_image: clean\(input\.image, 2048\) \|\| images\[0\] \|\| null,','cover_image: submittedCover || images[0] || null,',text,count=1)
              if ncover!=1: raise SystemExit('api cover field missing')
              oldmap='''    cloudStockCode: row.stock_code,\n    updatedAt: row.updated_at,'''
              if oldmap not in text: raise SystemExit('api mapper insertion point missing')
              newmap='''    cloudStockCode: row.stock_code,\n    publicationStatus: row.publication_status,\n    publishedAt: row.published_at || undefined,\n    scheduledAt: row.scheduled_at || undefined,\n    branchId: row.branch_id || undefined,\n    listingOrigin: row.listing_origin || undefined,\n    createdAt: row.created_at || undefined,\n    updatedAt: row.updated_at,'''
              return text.replace(oldmap,newmap,1)
          patch('api/catalog.ts',catalog_api)

          def guard(text):
              marker='if (/async\\s+addExternal\\s*\\(/.test(service)) failures.push("CatalogMediaService still exposes addExternal()");\n'
              if marker not in text: raise SystemExit('media guard marker missing')
              extra='''const carService = fs.readFileSync("src/services/car.service.ts", "utf8");\nconst adminEditor = fs.readFileSync("src/services/catalog-admin-editor.service.ts", "utf8");\nconst catalogApi = fs.readFileSync("api/catalog.ts", "utf8");\nif (carService.includes('localStorage.setItem("db_cars') || carService.includes('localStorage.setItem("db_saleCars')) failures.push("vehicle catalogue is still persisted to browser storage");\nif (carService.includes('this.readStorage("db_cars') || carService.includes('this.readStorage("db_saleCars')) failures.push("vehicle catalogue can still restore stale browser storage");\nif (/images:\\s*record\\.images/.test(adminEditor) || /cover_image:\\s*record\\.coverImage/.test(adminEditor)) failures.push("admin vehicle metadata save can still overwrite media authority");\nif (!catalogApi.includes("VEHICLE_MEDIA_STORAGE_ONLY") || !catalogApi.includes("trustedVehicleMediaUrl")) failures.push("public vehicle API does not reject third-party media");\n'''
              return text.replace(marker,marker+extra,1)
          patch('scripts/check-vehicle-media.mjs',guard)
          PY
          git diff --check

      - name: Validate authoritative catalogue
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run media:vehicles
          npm run a11y:buttons
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit verified core hardening
        run: |
          set -euo pipefail
          rm -f .github/workflows/v112-authoritative-vehicle-data-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V112: make rental and sale catalogue server authoritative"
          git push origin HEAD:main
