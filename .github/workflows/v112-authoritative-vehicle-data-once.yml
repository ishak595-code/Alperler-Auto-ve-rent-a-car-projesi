name: V112A Retire Vehicle Cache Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v112-authoritative-vehicle-data-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Remove rental and sale browser snapshots
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          p=Path('src/services/car.service.ts')
          text=p.read_text(encoding='utf-8')
          patterns=[
            r'\n    effect\(\(\) =>\n      localStorage\.setItem\(\n        "db_cars_v12",[\s\S]*?\n    \);',
            r'\n    effect\(\(\) =>\n      localStorage\.setItem\(\n        "db_saleCars_v12",[\s\S]*?\n    \);',
            r'\n    this\.readStorage\("db_cars_v12", \(value\) => \{[\s\S]*?\n    \}\);',
            r'\n    this\.readStorage\("db_saleCars_v12", \(value\) => \{[\s\S]*?\n    \}\);',
          ]
          for pattern in patterns:
            text,count=re.subn(pattern,'',text,count=1)
            if count!=1: raise SystemExit(f'cache block missing: {pattern}')
          marker='    localStorage.removeItem("db_faqs");\n'
          if marker not in text: raise SystemExit('purge marker missing')
          text=text.replace(marker, marker + '''\n    // Vehicle inventory is server-authoritative. Purge every historical local\n    // rental/sale snapshot before the current cloud catalogue is loaded.\n    for (let index = localStorage.length - 1; index >= 0; index -= 1) {\n      const key = localStorage.key(index);\n      if (key && (key.startsWith("db_cars") || key.startsWith("db_saleCars"))) {\n        localStorage.removeItem(key);\n      }\n    }\n''',1)
          p.write_text(text,encoding='utf-8')
          PY
          if grep -q 'localStorage.setItem("db_cars' src/services/car.service.ts; then exit 1; fi
          if grep -q 'localStorage.setItem("db_saleCars' src/services/car.service.ts; then exit 1; fi
          if grep -q 'this.readStorage("db_cars' src/services/car.service.ts; then exit 1; fi
          if grep -q 'this.readStorage("db_saleCars' src/services/car.service.ts; then exit 1; fi
          git diff --check
      - name: Validate application
        run: |
          npm ci --no-audit --no-fund
          npm run a11y:buttons
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build
      - name: Commit verified cache retirement
        run: |
          rm -f .github/workflows/v112-authoritative-vehicle-data-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V112A: retire stale rental and sale browser cache"
          git push origin HEAD:main
