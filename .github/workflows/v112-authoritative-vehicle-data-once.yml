name: V112 Authoritative Vehicle Data Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v112-authoritative-vehicle-data-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Remove stale vehicle state and hard-coded sale detail fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8'); print('patched',path)
          def replace(path, old, new, expected=1):
              text=read(path); count=text.count(old)
              if count != expected: raise SystemExit(f'{path}: expected {expected}, found {count}: {old[:100]}')
              write(path,text.replace(old,new))

          # Vehicle catalogue is server-authoritative. Never restore stale browser copies.
          path='src/services/car.service.ts'; text=read(path)
          rental_effect='''    effect(() =>\n      localStorage.setItem(\n        "db_cars_v12",\n        JSON.stringify(this._inventory().filter((vehicle) => vehicle.category === "RENTAL")),\n      ),\n    );\n'''
          sale_effect='''    effect(() =>\n      localStorage.setItem(\n        "db_saleCars_v12",\n        JSON.stringify(this._inventory().filter((vehicle) => vehicle.category === "SALE")),\n      ),\n    );\n'''
          if rental_effect not in text or sale_effect not in text: raise SystemExit('vehicle persistence effects not found')
          text=text.replace(rental_effect,'').replace(sale_effect,'')
          rental_load=re.compile(r'''    this\.readStorage\("db_cars_v12", \(value\) => \{.*?\n    \}\);\n''',re.S)
          sale_load=re.compile(r'''    this\.readStorage\("db_saleCars_v12", \(value\) => \{.*?\n    \}\);\n''',re.S)
          text,n1=rental_load.subn('',text,count=1); text,n2=sale_load.subn('',text,count=1)
          if (n1,n2)!=(1,1): raise SystemExit(f'vehicle cache restore blocks mismatch {(n1,n2)}')
          marker='''    localStorage.removeItem("db_config");\n    localStorage.removeItem("db_faqs");\n'''
          purge='''    localStorage.removeItem("db_config");\n    localStorage.removeItem("db_faqs");\n\n    // Vehicle inventory is authoritative in Supabase. Purge every historical\n    // browser-side vehicle snapshot so old images/specs can never overwrite\n    // the current rental/sale catalogue after an app update.\n    for (let index = localStorage.length - 1; index >= 0; index -= 1) {\n      const key = localStorage.key(index);\n      if (key && (key.startsWith("db_cars") || key.startsWith("db_saleCars"))) {\n        localStorage.removeItem(key);\n      }\n    }\n'''
          if marker not in text: raise SystemExit('storage purge marker missing')
          text=text.replace(marker,purge,1)
          write(path,text)

          # Vehicle reads must bypass stale edge/browser catalogue copies.
          path='src/services/catalog.service.ts'; text=read(path)
          old='''  async loadVehicles(fresh = false): Promise<Vehicle[]> {\n    return this.loadList<Vehicle>("vehicles", fresh);\n  }'''
          new='''  async loadVehicles(_fresh = false): Promise<Vehicle[]> {\n    // Vehicles change from the admin panel and must never be hydrated from an\n    // old CDN/browser response. Rental and sale inventory is always fresh.\n    return this.loadList<Vehicle>("vehicles", true);\n  }'''
          if old not in text: raise SystemExit('loadVehicles block missing')
          write(path,text.replace(old,new,1))

          # Admin metadata save cannot overwrite media. catalog_media is sole media authority.
          path='src/services/catalog-admin-editor.service.ts'; text=read(path)
          text,n1=re.subn(r'''\n      images: record\.images\.filter\(Boolean\)\.slice\(0, 30\),\n      cover_image: record\.coverImage\?\.trim\(\) \|\| record\.images\[0\] \|\| null,''','',text,count=1)
          if n1!=1: raise SystemExit('admin vehicle media write fields not found')
          write(path,text)

          # Public API rejects third-party vehicle media and returns full dynamic provenance.
          path='api/catalog.ts'; text=read(path)
          insert_after='''function booleanValue(value: unknown): boolean {\n  return value === true;\n}\n'''
          helper='''function booleanValue(value: unknown): boolean {\n  return value === true;\n}\n\nconst VEHICLE_MEDIA_PREFIX =\n  "https://hrztrgjvgdnaurejnsgs.supabase.co/storage/v1/object/public/catalog-media/";\n\nfunction trustedVehicleMediaUrl(value: unknown): value is string {\n  return typeof value === "string" && value.trim().startsWith(VEHICLE_MEDIA_PREFIX);\n}\n'''
          if insert_after not in text: raise SystemExit('api helper insertion point missing')
          text=text.replace(insert_after,helper,1)
          text=text.replace('''    case "vehicles":\n      return "public, max-age=30, s-maxage=120, stale-while-revalidate=3600";''','''    case "vehicles":\n      return "no-store";''',1)
          old_images='''  const images = Array.isArray(input.images)\n    ? input.images.filter((value: unknown) => typeof value === "string" && value.length <= 2048).slice(0, 30)\n    : [];'''
          new_images='''  const submittedImages = Array.isArray(input.images)\n    ? input.images.filter((value: unknown) => typeof value === "string" && value.length <= 2048).slice(0, 30)\n    : [];\n  const submittedCover = clean(input.image, 2048);\n  if (submittedImages.some((value: string) => !trustedVehicleMediaUrl(value))) {\n    throw new Error("VEHICLE_MEDIA_STORAGE_ONLY");\n  }\n  if (submittedCover && !trustedVehicleMediaUrl(submittedCover)) {\n    throw new Error("VEHICLE_MEDIA_STORAGE_ONLY");\n  }\n  const images = submittedImages;'''
          if old_images not in text: raise SystemExit('normalizeVehicle images block missing')
          text=text.replace(old_images,new_images,1)
          text=text.replace('''    cover_image: clean(input.image, 2048) || images[0] || null,''','''    cover_image: submittedCover || images[0] || null,''',1)
          old_updated='''    cloudStockCode: row.stock_code,\n    updatedAt: row.updated_at,'''
          new_updated='''    cloudStockCode: row.stock_code,\n    publicationStatus: row.publication_status,\n    publishedAt: row.published_at || undefined,\n    scheduledAt: row.scheduled_at || undefined,\n    branchId: row.branch_id || undefined,\n    listingOrigin: row.listing_origin || undefined,\n    createdAt: row.created_at || undefined,\n    updatedAt: row.updated_at,'''
          if old_updated not in text: raise SystemExit('vehicle mapper provenance point missing')
          text=text.replace(old_updated,new_updated,1)
          write(path,text)

          # Direct Supabase mapper must also expose the real listing creation time.
          path='src/services/catalog.service.ts'; text=read(path)
          old='''        listingOrigin: row["listing_origin"] || undefined,\n        updatedAt: row["updated_at"],'''
          new='''        listingOrigin: row["listing_origin"] || undefined,\n        createdAt: row["created_at"] || undefined,\n        updatedAt: row["updated_at"],'''
          if old not in text: raise SystemExit('direct mapper createdAt point missing')
          write(path,text.replace(old,new,1))

          # Remove fake/FOMO sale detail state and hard-coded fallback claims.
          path='src/pages/sale-car-detail.component.ts'; text=read(path)
          fomo=re.compile(r'''          <!-- FOMO Overlay -->\n          <div class="absolute top-4 left-4 z-40 flex flex-col gap-2">.*?          </div>\n\n          <swiper-container''',re.S)
          replacement='''          @if (car()?.badge) {\n            <div class="absolute top-4 left-4 z-40 rounded-md bg-slate-950/85 px-3 py-1.5 text-xs font-bold tracking-wider text-white shadow-lg backdrop-blur">\n              {{ car()?.badge }}\n            </div>\n          }\n\n          <swiper-container'''
          text,n=fomo.subn(replacement,text,count=1)
          if n!=1: raise SystemExit('sale FOMO overlay not found')
          premium=re.compile(r'''\n          <!-- Premium Badge Overlay -->\n          <div class="absolute bottom-0 right-0 z-10 flex flex-col items-end">.*?          </div>\n''',re.S)
          text,n=premium.subn('\n',text,count=1)
          if n!=1: raise SystemExit('fake premium overlay not found')
          text=text.replace('''                    car()?.createdAt || "05 Nisan 2026"''','''                    listingDate(car())''',1)
          text=text.replace('''                    car()?.warranty || "Yok"''','''                    car()?.warranty || "Belirtilmedi"''',1)
          text=text.replace('''  viewersCount = signal(Math.floor(Math.random() * 25) + 8);\n''','',1)
          generic=re.compile(r'''    // Provide a generic fallback so the button always appears for all cars\n    if \(!specs\) \{.*?\n    \}\n\s*\n    return specs;''',re.S)
          text,n=generic.subn('''    // Do not fabricate technical values. If this exact model has no verified\n    // specification record, the technical panel stays hidden.\n    return specs;''',text,count=1)
          if n!=1: raise SystemExit('generic technical fallback not found')
          method_anchor='''  goBack() {\n'''
          method='''  listingDate(car: Car | null): string {\n    const value = car?.createdAt || car?.updatedAt;\n    if (!value) return "Tarih bilgisi yok";\n    const date = new Date(value);\n    return Number.isNaN(date.getTime())\n      ? "Tarih bilgisi yok"\n      : new Intl.DateTimeFormat("tr-TR", { day: "2-digit", month: "long", year: "numeric" }).format(date);\n  }\n\n  goBack() {\n'''
          if method_anchor not in text: raise SystemExit('sale detail method anchor missing')
          text=text.replace(method_anchor,method,1)
          old_seo='''          const pageTitle = `Fırsat Aracı: ${found.title || found.brand + " " + found.model} 💎 | ${config.companyName}`;\n\n          this.seoService.updateSeoTags({\n            title: pageTitle,\n            description: `Yeni sahibini bekleyen kusursuz ${found.brand} ${found.model} (${found.year}). Detaylı ekspertiz raporu ve kaçırılmayacak fiyat avantajıyla hemen inceleyin ve hayallerinize kavuşun.`,\n            keywords: `${found.brand} güvenilir ikinci el araba, ${found.model} sahibinden garantili, Yüksekova fırsat araçları, Hakkari premium oto galeri, ekspertizli satılık arabalar`,'''
          new_seo='''          const pageTitle = `${found.title || found.brand + " " + found.model} | ${config.companyName}`;\n\n          this.seoService.updateSeoTags({\n            title: pageTitle,\n            description: `${found.year || ""} ${found.brand} ${found.model} satılık araç ilanı. Fiyat, kilometre, donanım ve kayıtlı araç bilgilerini inceleyin.`,\n            keywords: `${found.brand} ${found.model}, satılık araç, Yüksekova araç ilanı, Hakkari otomobil`,'''
          if old_seo not in text: raise SystemExit('sale SEO hard-coded claims block missing')
          text=text.replace(old_seo,new_seo,1)
          write(path,text)

          # Regression guard covers browser cache, admin writes and public API URL acceptance.
          path='scripts/check-vehicle-media.mjs'; text=read(path)
          extra='''\nconst carService = fs.readFileSync("src/services/car.service.ts", "utf8");\nconst adminEditor = fs.readFileSync("src/services/catalog-admin-editor.service.ts", "utf8");\nconst catalogApi = fs.readFileSync("api/catalog.ts", "utf8");\nif (carService.includes('localStorage.setItem("db_cars') || carService.includes('localStorage.setItem("db_saleCars')) failures.push("vehicle catalogue is still persisted to browser storage");\nif (carService.includes('this.readStorage("db_cars') || carService.includes('this.readStorage("db_saleCars')) failures.push("vehicle catalogue can still restore stale browser storage");\nif (/images:\s*record\.images/.test(adminEditor) || /cover_image:\s*record\.coverImage/.test(adminEditor)) failures.push("admin vehicle metadata save can still overwrite media authority");\nif (!catalogApi.includes("VEHICLE_MEDIA_STORAGE_ONLY") || !catalogApi.includes("trustedVehicleMediaUrl")) failures.push("public vehicle API does not reject third-party media");\n'''
          marker='''if (/async\\s+addExternal\\s*\\(/.test(service)) failures.push("CatalogMediaService still exposes addExternal()");\n'''
          if marker not in text: raise SystemExit('vehicle media guard insertion marker missing')
          text=text.replace(marker,marker+extra,1)
          write(path,text)
          PY
          git diff --check

      - name: Verify application and permanent guards
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run media:vehicles
          npm run a11y:buttons
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit verified V112 hardening
        run: |
          set -euo pipefail
          rm -f .github/workflows/v112-authoritative-vehicle-data-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V112: make all vehicle data server authoritative"
          git push origin HEAD:main
