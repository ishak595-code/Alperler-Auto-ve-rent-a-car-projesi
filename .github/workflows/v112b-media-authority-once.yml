name: V112B Vehicle Media Authority Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v112b-media-authority-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Lock vehicle media to Alperler Storage
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          # Admin saveVehicle must never persist image fields; catalog_media owns them.
          p=Path('src/services/catalog-admin-editor.service.ts'); text=p.read_text(encoding='utf-8')
          start=text.index('  async saveVehicle(record: VehicleAdminRecord): Promise<void> {')
          end=text.index('  async saveTour(record: TourAdminRecord): Promise<void> {',start)
          block=text[start:end]
          block,n1=re.subn(r'\n\s*images: record\.images\.filter\(Boolean\)\.slice\(0, 30\),','',block,count=1)
          block,n2=re.subn(r'\n\s*cover_image: record\.coverImage\?\.trim\(\) \|\| record\.images\[0\] \|\| null,','',block,count=1)
          if (n1,n2)!=(1,1): raise SystemExit(f'admin vehicle media fields {(n1,n2)}')
          text=text[:start]+block+text[end:]; p.write_text(text,encoding='utf-8')

          # Vehicle public reads are always fresh and include the real created_at.
          p=Path('src/services/catalog.service.ts'); text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'async loadVehicles\(fresh = false\): Promise<Vehicle\[\]> \{\s*return this\.loadList<Vehicle>\("vehicles", fresh\);\s*\}', 'async loadVehicles(_fresh = false): Promise<Vehicle[]> {\n    return this.loadList<Vehicle>("vehicles", true);\n  }',text,count=1)
          if n!=1: raise SystemExit('loadVehicles not found')
          marker='        listingOrigin: row["listing_origin"] || undefined,\n        updatedAt: row["updated_at"],'
          if marker not in text: raise SystemExit('direct vehicle createdAt marker missing')
          text=text.replace(marker,'        listingOrigin: row["listing_origin"] || undefined,\n        createdAt: row["created_at"] || undefined,\n        updatedAt: row["updated_at"],',1)
          p.write_text(text,encoding='utf-8')

          # Vercel vehicle API forbids external vehicle media and disables response caching.
          p=Path('api/catalog.ts'); text=p.read_text(encoding='utf-8')
          anchor='function booleanValue(value: unknown): boolean {\n  return value === true;\n}\n'
          if anchor not in text: raise SystemExit('boolean helper marker missing')
          text=text.replace(anchor,anchor+'\nconst VEHICLE_MEDIA_PREFIX = "https://hrztrgjvgdnaurejnsgs.supabase.co/storage/v1/object/public/catalog-media/";\n\nfunction trustedVehicleMediaUrl(value: unknown): value is string {\n  return typeof value === "string" && value.trim().startsWith(VEHICLE_MEDIA_PREFIX);\n}\n',1)
          text,n=re.subn(r'case "vehicles":\s*return "public, max-age=30, s-maxage=120, stale-while-revalidate=3600";', 'case "vehicles":\n      return "no-store";',text,count=1)
          if n!=1: raise SystemExit('vehicle cache rule missing')
          old='''  const images = Array.isArray(input.images)\n    ? input.images.filter((value: unknown) => typeof value === "string" && value.length <= 2048).slice(0, 30)\n    : [];'''
          if old not in text: raise SystemExit('normalize images block missing')
          new='''  const submittedImages = Array.isArray(input.images)\n    ? input.images.filter((value: unknown) => typeof value === "string" && value.length <= 2048).slice(0, 30)\n    : [];\n  const submittedCover = clean(input.image, 2048);\n  if (submittedImages.some((value: string) => !trustedVehicleMediaUrl(value))) {\n    throw new Error("VEHICLE_MEDIA_STORAGE_ONLY");\n  }\n  if (submittedCover && !trustedVehicleMediaUrl(submittedCover)) {\n    throw new Error("VEHICLE_MEDIA_STORAGE_ONLY");\n  }\n  const images = submittedImages;'''
          text=text.replace(old,new,1)
          text,n=re.subn(r'cover_image: clean\(input\.image, 2048\) \|\| images\[0\] \|\| null,','cover_image: submittedCover || images[0] || null,',text,count=1)
          if n!=1: raise SystemExit('cover normalization missing')
          marker='    cloudStockCode: row.stock_code,\n    updatedAt: row.updated_at,'
          if marker not in text: raise SystemExit('api mapper marker missing')
          text=text.replace(marker,'    cloudStockCode: row.stock_code,\n    publicationStatus: row.publication_status,\n    publishedAt: row.published_at || undefined,\n    scheduledAt: row.scheduled_at || undefined,\n    branchId: row.branch_id || undefined,\n    listingOrigin: row.listing_origin || undefined,\n    createdAt: row.created_at || undefined,\n    updatedAt: row.updated_at,',1)
          p.write_text(text,encoding='utf-8')

          # Extend regression guard without confusing tour media fields with vehicle media.
          p=Path('scripts/check-vehicle-media.mjs'); text=p.read_text(encoding='utf-8')
          marker='if (/async\\s+addExternal\\s*\\(/.test(service)) failures.push("CatalogMediaService still exposes addExternal()");\n'
          if marker not in text: raise SystemExit('guard marker missing')
          extra='''const carService = fs.readFileSync("src/services/car.service.ts", "utf8");\nconst adminEditor = fs.readFileSync("src/services/catalog-admin-editor.service.ts", "utf8");\nconst catalogApi = fs.readFileSync("api/catalog.ts", "utf8");\nconst vehicleSaveStart = adminEditor.indexOf("async saveVehicle(record: VehicleAdminRecord)");\nconst vehicleSaveEnd = adminEditor.indexOf("async saveTour(record: TourAdminRecord)", vehicleSaveStart);\nconst vehicleSave = adminEditor.slice(vehicleSaveStart, vehicleSaveEnd);\nif (carService.includes('localStorage.setItem("db_cars') || carService.includes('localStorage.setItem("db_saleCars')) failures.push("vehicle catalogue is still persisted to browser storage");\nif (carService.includes('this.readStorage("db_cars') || carService.includes('this.readStorage("db_saleCars')) failures.push("vehicle catalogue can still restore stale browser storage");\nif (/images:\\s*record\\.images/.test(vehicleSave) || /cover_image:\\s*record\\.coverImage/.test(vehicleSave)) failures.push("saveVehicle can still overwrite media authority");\nif (!catalogApi.includes("VEHICLE_MEDIA_STORAGE_ONLY") || !catalogApi.includes("trustedVehicleMediaUrl") || !catalogApi.includes('case "vehicles":\\n      return "no-store"')) failures.push("vehicle API media/cache guard missing");\n'''
          text=text.replace(marker,marker+extra,1); p.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Validate media authority
        run: |
          npm ci --no-audit --no-fund
          npm run media:vehicles
          npm run a11y:buttons
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build
      - name: Commit verified media authority
        run: |
          rm -f .github/workflows/v112b-media-authority-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V112B: enforce vehicle media authority across app and API"
          git push origin HEAD:main
