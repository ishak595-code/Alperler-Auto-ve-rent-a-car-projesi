name: V116 Vehicle Truth UI Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v116-vehicle-truth-ui-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Make all vehicle cards and cloud records authoritative
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          # Local error placeholder, never a third-party fallback request.
          placeholder=Path('public/icons/vehicle-placeholder.svg')
          placeholder.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Araç görseli mevcut değil</title><desc id="desc">Alperler Auto yerel araç görseli yedeği</desc><rect width="800" height="500" fill="#e2e8f0"/><path d="M195 322h410l-35-103c-9-27-34-45-62-45H292c-28 0-53 18-62 45l-35 103Z" fill="#64748b"/><path d="M251 244h298l-19-53H270l-19 53Z" fill="#cbd5e1"/><circle cx="280" cy="329" r="48" fill="#0f172a"/><circle cx="520" cy="329" r="48" fill="#0f172a"/><circle cx="280" cy="329" r="22" fill="#cbd5e1"/><circle cx="520" cy="329" r="22" fill="#cbd5e1"/><rect x="160" y="287" width="480" height="59" rx="22" fill="#475569"/><text x="400" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#334155">ALPERLER AUTO</text></svg>''',encoding='utf-8')

          # Small/common list card: remove remote Unsplash error fallback.
          p=Path('src/components/vehicle-list-item.component.ts'); text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'image\.src = "https://images\.unsplash\.com/[^";]+";', 'image.src = "/icons/vehicle-placeholder.svg";',text,count=1)
          if n!=1: raise SystemExit('vehicle-list-item external fallback not found')
          p.write_text(text,encoding='utf-8')

          # Full vehicle card: same local fallback and no fabricated assurance blocks.
          p=Path('src/components/vehicle-card.component.ts'); text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'image\.src =\s*\n\s*"https://images\.unsplash\.com/[^";]+";', 'image.src = "/icons/vehicle-placeholder.svg";',text,count=1)
          if n!=1: raise SystemExit('vehicle-card external fallback not found')
          assurance=re.compile(r'''\n        <div\n          class="mt-3 mb-2 flex flex-col gap-1\.5 text-\[11px\] sm:text-xs font-semibold text-slate-700"\n        >[\s\S]*?\n        </div>\n\n        <div\n          class="flex flex-col sm:flex-row''')
          text,n=assurance.subn('''\n        <div\n          class="flex flex-col sm:flex-row''',text,count=1)
          if n!=1: raise SystemExit('vehicle-card fabricated assurance block not found')
          text=text.replace('{{ t().car.premiumGallery }}','{{ car.availability || "Satışta" }}',1)
          text=text.replace('{{ t().car.location }}','{{ car.location || carService.getConfig()().address || "Konum belirtilmedi" }}',1)
          text=text.replace('(withDriver ? car.price + 1500 : car.price) | turkishCurrency','(withDriver ? car.price + (car.driverDailyFee || 0) : car.price) | turkishCurrency',1)
          p.write_text(text,encoding='utf-8')

          # Typed dynamic driver fee.
          p=Path('src/models/car.model.ts'); text=p.read_text(encoding='utf-8')
          marker="  driverOption?: 'WITH_DRIVER' | 'WITHOUT_DRIVER' | 'BOTH';\n"
          if marker not in text: raise SystemExit('driverOption model marker missing')
          text=text.replace(marker,marker+'  driverDailyFee?: number;\n',1)
          p.write_text(text,encoding='utf-8')

          # Cloud vehicle means cloud truth only. Never inherit static fallback business facts.
          p=Path('src/services/car.service.ts'); text=p.read_text(encoding='utf-8')
          pattern=re.compile(r'''  private mergeVehicleWithFallback\(vehicle: Vehicle\): Vehicle \{[\s\S]*?\n  \}\n\n  private replaceVehicleCatalog''')
          replacement='''  private mergeVehicleWithFallback(vehicle: Vehicle): Vehicle {\n    if (vehicle.cloudId) {\n      return {\n        ...vehicle,\n        images: Array.isArray(vehicle.images) ? vehicle.images : [],\n        gallery: Array.isArray(vehicle.gallery)\n          ? vehicle.gallery\n          : Array.isArray(vehicle.images)\n            ? vehicle.images\n            : [],\n        videos: Array.isArray(vehicle.videos) ? vehicle.videos : [],\n      };\n    }\n\n    const fallback = fallbackInventory.find(\n      (candidate) => String(candidate.id) === String(vehicle.id),\n    );\n    return {\n      ...(fallback || {}),\n      ...vehicle,\n      category: vehicle.category || fallback?.category || "RENTAL",\n    } as Vehicle;\n  }\n\n  private replaceVehicleCatalog'''
          text,n=pattern.subn(replacement,text,count=1)
          if n!=1: raise SystemExit('cloud fallback merge block not found')
          p.write_text(text,encoding='utf-8')

          # Generic API may validate legacy media input but never writes media columns
          # or shadow media fields. Only catalog_media/file upload owns media.
          p=Path('api/catalog.ts'); text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'\n    images,\n    cover_image: submittedCover \|\| images\[0\] \|\| null,','',text,count=1)
          if n!=1: raise SystemExit('generic API media column writes not found')
          old='    metadata: { ...input, legacyId: id, cloudId: undefined, cloudStockCode: undefined },'
          new='''    metadata: (() => {\n      const { image: _image, images: _images, gallery: _gallery, videos: _videos, expertReport: _expertReport, viewers: _viewers, viewersCount: _viewersCount, cloudId: _cloudId, cloudStockCode: _cloudStockCode, ...businessMetadata } = input;\n      return { ...businessMetadata, legacyId: id };\n    })(),'''
          if old not in text: raise SystemExit('generic API raw metadata spread not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # Expand permanent media regression checks.
          p=Path('scripts/check-vehicle-media.mjs'); text=p.read_text(encoding='utf-8')
          append='''\nconst vehicleUiFiles = [\n  "src/components/vehicle-list-item.component.ts",\n  "src/components/vehicle-card.component.ts",\n  "src/pages/car-detail.component.ts",\n  "src/pages/sale-car-detail.component.ts",\n];\nfor (const file of vehicleUiFiles) {\n  const source = fs.readFileSync(file, "utf8");\n  if (/images\\.unsplash\\.com|wikimedia\\.org|commons\\.wikimedia/i.test(source)) failures.push(`${file} still contains a third-party vehicle image URL`);\n}\nif (!fs.existsSync("public/icons/vehicle-placeholder.svg")) failures.push("local vehicle error placeholder is missing");\nif (/\.\.\.safeFallback[\\s\\S]*\.\.\.vehicle/.test(carService)) failures.push("cloud vehicles can still inherit static fallback facts");\nconst normalizeStart2 = catalogApi.indexOf("function normalizeVehicle");\nconst normalizeEnd2 = catalogApi.indexOf("function normalizeTour", normalizeStart2);\nconst normalizeVehicle2 = catalogApi.slice(normalizeStart2, normalizeEnd2);\nif (/\\n\\s*images,/.test(normalizeVehicle2) || /cover_image:/.test(normalizeVehicle2)) failures.push("generic vehicle API can still write media columns");\nif (/metadata:\\s*\\{\\s*\.\.\.input/.test(normalizeVehicle2)) failures.push("generic vehicle API can still persist raw media shadows");\n'''
          insert='if (failures.length) { console.error(failures.join("\\n")); process.exit(1); }'
          if insert not in text: raise SystemExit('media guard final marker missing')
          text=text.replace(insert,append+'\n'+insert,1)
          p.write_text(text,encoding='utf-8')

          # Date-control guard becomes permanent in the primary quality gate.
          p=Path('.github/workflows/alperler-quality-gate.yml'); text=p.read_text(encoding='utf-8')
          marker='''      - name: TalkBack button accessibility guard\n        run: npm run a11y:buttons\n'''
          if marker not in text: raise SystemExit('quality gate a11y button marker missing')
          text=text.replace(marker,marker+'''\n      - name: TalkBack date-control accessibility guard\n        run: npm run a11y:dates\n''',1)
          p.write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/v114-cloud-vehicle-truth-once.yml
          git diff --check
      - name: Validate all vehicle truth and accessibility guards
        run: |
          npm ci --no-audit --no-fund
          npm run media:vehicles
          npm run a11y:buttons
          npm run a11y:dates
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build
      - name: Commit verified V116 cleanup
        run: |
          rm -f .github/workflows/v116-vehicle-truth-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V116: make every vehicle card and cloud record authoritative"
          git push origin HEAD:main
