name: V117 Remove Vehicle Fallback Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v117-remove-vehicle-fallback-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Delete static rental and sale vehicle fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          p=Path('src/services/mock-data.ts'); text=p.read_text(encoding='utf-8')
          start=text.find('  // --- KİRALIK (RENTAL) ARAÇLAR ---')
          end=text.find('  // --- TURLAR (TOUR) ---')
          if start < 0 or end < 0 or end <= start: raise SystemExit('vehicle fallback section markers missing')
          text=text[:start] + '  // --- TURLAR (TOUR) ---' + text[end + len('  // --- TURLAR (TOUR) ---'):]
          p.write_text(text,encoding='utf-8')

          # Cloud rows are now returned as-is; there is no vehicle fallback to merge.
          p=Path('src/services/car.service.ts'); text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'''        const mergedVehicles = source\.map\(\(vehicle\) =>\n          this\.mergeVehicleWithFallback\(vehicle\),\n        \);\n        this\.replaceVehicleCatalog\(mergedVehicles\);''','''        this.replaceVehicleCatalog(source);''',text,count=1)
          if n!=1: raise SystemExit('cloud vehicle merge call not found')
          text,n=re.subn(r'''\n  private mergeVehicleWithFallback\(vehicle: Vehicle\): Vehicle \{[\s\S]*?\n  \}\n\n  private replaceVehicleCatalog''','''\n  private replaceVehicleCatalog''',text,count=1)
          if n!=1: raise SystemExit('mergeVehicleWithFallback method not found')
          p.write_text(text,encoding='utf-8')

          # Rewrite the permanent vehicle-media guard for the server-authoritative model.
          Path('scripts/check-vehicle-media.mjs').write_text('''import fs from "node:fs";\n\nconst failures = [];\nconst mock = fs.readFileSync("src/services/mock-data.ts", "utf8");\nconst admin = fs.readFileSync("src/pages/admin/admin-catalog-editor.component.ts", "utf8");\nconst service = fs.readFileSync("src/services/catalog-media.service.ts", "utf8");\nconst carService = fs.readFileSync("src/services/car.service.ts", "utf8");\nconst adminEditor = fs.readFileSync("src/services/catalog-admin-editor.service.ts", "utf8");\nconst catalogApi = fs.readFileSync("api/catalog.ts", "utf8");\n\nif (/category:\\s*["\\'](?:RENTAL|SALE)["\\']/.test(mock)) failures.push("static rental/sale fallback inventory still exists");\nfor (const token of ["externalUrl", "addExternalMedia", "Kaynaklı Medyayı Ekle", "Dış görsel", "Dış video"]) if (admin.includes(token)) failures.push(`admin still exposes ${token}`);\nif (/async\\s+addExternal\\s*\\(/.test(service)) failures.push("CatalogMediaService still exposes addExternal()");\nif (carService.includes('localStorage.setItem("db_cars') || carService.includes('localStorage.setItem("db_saleCars')) failures.push("vehicle catalogue is still persisted to browser storage");\nif (carService.includes('this.readStorage("db_cars') || carService.includes('this.readStorage("db_saleCars')) failures.push("vehicle catalogue can still restore stale browser storage");\nif (carService.includes("mergeVehicleWithFallback")) failures.push("cloud vehicles can still enter a static fallback merge path");\nconst vehicleSaveStart = adminEditor.indexOf("async saveVehicle(record: VehicleAdminRecord)");\nconst vehicleSaveEnd = adminEditor.indexOf("async saveTour(record: TourAdminRecord)", vehicleSaveStart);\nconst vehicleSave = adminEditor.slice(vehicleSaveStart, vehicleSaveEnd);\nif (/images:\\s*record\\.images/.test(vehicleSave) || /cover_image:\\s*record\\.coverImage/.test(vehicleSave)) failures.push("saveVehicle can still overwrite media authority");\nif (!catalogApi.includes("VEHICLE_MEDIA_STORAGE_ONLY") || !catalogApi.includes("trustedVehicleMediaUrl") || !catalogApi.includes('case "vehicles":\\n      return "no-store"')) failures.push("vehicle API media/cache guard missing");\nif (failures.length) { console.error(failures.join("\\n")); process.exit(1); }\nconsole.log("Vehicle truth guard passed: rental/sale inventory is cloud-only, file-backed and URL authoring is disabled.");\n''',encoding='utf-8')
          PY
          rm -f .github/workflows/v114-cloud-vehicle-truth-once.yml .github/workflows/v116-vehicle-truth-ui-once.yml
          git diff --check
      - name: Validate cloud-only vehicle inventory
        run: |
          npm ci --no-audit --no-fund
          npm run media:vehicles
          npm run a11y:buttons
          npm run a11y:dates
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build
      - name: Commit verified fallback removal
        run: |
          rm -f .github/workflows/v117-remove-vehicle-fallback-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V117: delete static rental and sale fallback inventory"
          git push origin HEAD:main
