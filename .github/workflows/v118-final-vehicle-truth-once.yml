name: V118 Final Vehicle Truth Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v118-final-vehicle-truth-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Finalize vehicle source, media and card truth
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path,text): Path(path).parent.mkdir(parents=True,exist_ok=True); Path(path).write_text(text,encoding='utf-8'); print('patched',path)

          # 1. Delete all static RENTAL/SALE records. Keep tour fallbacks only.
          path='src/services/mock-data.ts'; text=load(path)
          start=text.find('  // --- KİRALIK (RENTAL) ARAÇLAR ---')
          end=text.find('  // --- TURLAR (TOUR) ---')
          if start >= 0 and end > start:
              text=text[:start] + text[end:]
          if re.search(r"category:\s*['\"](?:RENTAL|SALE)['\"]", text):
              raise SystemExit('static rental/sale fallback remains in mock-data')
          save(path,text)

          # 2. Cloud vehicles enter catalogue directly. No static fact merge.
          path='src/services/car.service.ts'; text=load(path)
          text=re.sub(r'''        const mergedVehicles = source\.map\(\(vehicle\) =>\s*\n\s*this\.mergeVehicleWithFallback\(vehicle\),\s*\n\s*\);\s*\n\s*this\.replaceVehicleCatalog\(mergedVehicles\);''','''        this.replaceVehicleCatalog(source);''',text,count=1)
          text=re.sub(r'''\n  private mergeVehicleWithFallback\(vehicle: Vehicle\): Vehicle \{[\s\S]*?\n  \}\n\n  private replaceVehicleCatalog''','''\n  private replaceVehicleCatalog''',text,count=1)
          if 'mergeVehicleWithFallback' in text: raise SystemExit('mergeVehicleWithFallback still exists')
          save(path,text)

          # 3. Local vehicle image fallback file.
          save('public/icons/vehicle-placeholder.svg','''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect width="800" height="500" fill="#e2e8f0"/><path d="M195 322h410l-35-103c-9-27-34-45-62-45H292c-28 0-53 18-62 45l-35 103Z" fill="#64748b"/><path d="M251 244h298l-19-53H270l-19 53Z" fill="#cbd5e1"/><rect x="160" y="287" width="480" height="59" rx="22" fill="#475569"/><circle cx="280" cy="329" r="48" fill="#0f172a"/><circle cx="520" cy="329" r="48" fill="#0f172a"/><circle cx="280" cy="329" r="22" fill="#cbd5e1"/><circle cx="520" cy="329" r="22" fill="#cbd5e1"/><text x="400" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#334155">ALPERLER AUTO</text></svg>''')

          # 4. Both vehicle card components use only the local error placeholder.
          for path in ['src/components/vehicle-list-item.component.ts','src/components/vehicle-card.component.ts']:
              text=load(path)
              text=re.sub(r'image\.src\s*=\s*(?:\n\s*)?"https://images\.unsplash\.com/[^";]+";', 'image.src = "/icons/vehicle-placeholder.svg";',text)
              if 'images.unsplash.com' in text: raise SystemExit(f'{path}: external image fallback remains')
              save(path,text)

          # 5. Full card shows only record-backed facts, including per-vehicle driver fee.
          path='src/components/vehicle-card.component.ts'; text=load(path)
          text=re.sub(r'''\n        <div\n          class="mt-3 mb-2 flex flex-col gap-1\.5 text-\[11px\] sm:text-xs font-semibold text-slate-700"\n        >[\s\S]*?\n        </div>\n\n        <div\n          class="flex flex-col sm:flex-row''','''\n        <div\n          class="flex flex-col sm:flex-row''',text,count=1)
          text=text.replace('{{ t().car.premiumGallery }}','{{ car.availability || "Satışta" }}')
          text=text.replace('{{ t().car.location }}','{{ car.location || carService.getConfig()().address || "Konum belirtilmedi" }}')
          text=text.replace('(withDriver ? car.price + 1500 : car.price) | turkishCurrency','(withDriver ? car.price + (car.driverDailyFee || 0) : car.price) | turkishCurrency')
          for forbidden in ['%100 Kaskolu & Yol Yardım','101 Nokta Ekspertizli','Alperler Güvencesi','t().car.premiumGallery','car.price + 1500']:
              if forbidden in text: raise SystemExit(f'vehicle-card stale claim remains: {forbidden}')
          save(path,text)

          # 6. Type the dynamic driver fee once.
          path='src/models/car.model.ts'; text=load(path)
          if 'driverDailyFee?: number;' not in text:
              marker="  driverOption?: 'WITH_DRIVER' | 'WITHOUT_DRIVER' | 'BOTH';\n"
              if marker not in text: raise SystemExit('driverOption model marker missing')
              text=text.replace(marker,marker+'  driverDailyFee?: number;\n',1)
          save(path,text)

          # 7. Generic vehicle mutation validates legacy URL input but never writes media columns or shadow metadata.
          path='api/catalog.ts'; text=load(path)
          start=text.index('function normalizeVehicle')
          end=text.index('function normalizeTour',start)
          block=text[start:end]
          block=re.sub(r'\n\s*const images = submittedImages;','',block,count=1)
          block=re.sub(r'\n\s*images,\n\s*cover_image: submittedCover \|\| images\[0\] \|\| null,','',block,count=1)
          block=block.replace('metadata: { ...input, legacyId: id, cloudId: undefined, cloudStockCode: undefined },','''metadata: (() => {\n      const { image: _image, images: _images, gallery: _gallery, videos: _videos, expertReport: _expertReport, viewers: _viewers, viewersCount: _viewersCount, cloudId: _cloudId, cloudStockCode: _cloudStockCode, ...businessMetadata } = input;\n      return { ...businessMetadata, legacyId: id };\n    })(),''')
          if re.search(r'\n\s*images,',block) or 'cover_image:' in block: raise SystemExit('normalizeVehicle still writes media columns')
          if 'metadata: { ...input' in block: raise SystemExit('normalizeVehicle still persists raw metadata')
          text=text[:start]+block+text[end:]
          save(path,text)

          # 8. Warranty filter uses explicit cloud boolean; fix a11y wording.
          path='src/pages/sales-results.component.ts'; text=load(path)
          text=text.replace('this.filterWarranty() === "yes" && !(car.hasWarranty || car.warranty)','this.filterWarranty() === "yes" && car.hasWarranty !== true')
          save(path,text)
          path='src/pages/sales-results.component.html'; text=load(path).replace('aria-label="Satılık araç araçları"','aria-label="Satılık araç işlemleri"')
          save(path,text)

          # 9. Rewrite permanent vehicle guard around the authoritative model.
          save('scripts/check-vehicle-media.mjs','''import fs from "node:fs";\nconst failures=[];\nconst mock=fs.readFileSync("src/services/mock-data.ts","utf8");\nconst admin=fs.readFileSync("src/pages/admin/admin-catalog-editor.component.ts","utf8");\nconst service=fs.readFileSync("src/services/catalog-media.service.ts","utf8");\nconst carService=fs.readFileSync("src/services/car.service.ts","utf8");\nconst adminEditor=fs.readFileSync("src/services/catalog-admin-editor.service.ts","utf8");\nconst catalogApi=fs.readFileSync("api/catalog.ts","utf8");\nif(/category:\\s*["'](?:RENTAL|SALE)["']/.test(mock)) failures.push("static rental/sale fallback inventory still exists");\nif(carService.includes("mergeVehicleWithFallback")) failures.push("cloud vehicle fallback merge still exists");\nif(carService.includes('localStorage.setItem("db_cars')||carService.includes('localStorage.setItem("db_saleCars')||carService.includes('this.readStorage("db_cars')||carService.includes('this.readStorage("db_saleCars')) failures.push("stale browser vehicle persistence still exists");\nfor(const token of ["externalUrl","addExternalMedia","Kaynaklı Medyayı Ekle","Dış görsel","Dış video"]) if(admin.includes(token)) failures.push(`admin still exposes ${token}`);\nif(/async\\s+addExternal\\s*\\(/.test(service)) failures.push("CatalogMediaService still exposes addExternal()");\nconst saveStart=adminEditor.indexOf("async saveVehicle(record: VehicleAdminRecord)");const saveEnd=adminEditor.indexOf("async saveTour(record: TourAdminRecord)",saveStart);const vehicleSave=adminEditor.slice(saveStart,saveEnd);\nif(/images:\\s*record\\.images/.test(vehicleSave)||/cover_image:\\s*record\\.coverImage/.test(vehicleSave)) failures.push("saveVehicle can overwrite media authority");\nif(!catalogApi.includes("VEHICLE_MEDIA_STORAGE_ONLY")||!catalogApi.includes("trustedVehicleMediaUrl")||!catalogApi.includes('case "vehicles":\\n      return "no-store"')) failures.push("vehicle API media/cache guard missing");\nconst ns=catalogApi.indexOf("function normalizeVehicle"),ne=catalogApi.indexOf("function normalizeTour",ns),nv=catalogApi.slice(ns,ne);\nif(/\\n\\s*images,/.test(nv)||/cover_image:/.test(nv)) failures.push("generic vehicle API can still write media columns");\nif(/metadata:\\s*\\{\\s*\.\.\.input/.test(nv)) failures.push("generic vehicle API can still persist raw media shadows");\nfor(const file of ["src/components/vehicle-list-item.component.ts","src/components/vehicle-card.component.ts","src/pages/car-detail.component.ts","src/pages/sale-car-detail.component.ts"]){const s=fs.readFileSync(file,"utf8");if(/images\\.unsplash\\.com|wikimedia\\.org|commons\\.wikimedia/i.test(s)) failures.push(`${file} contains a third-party vehicle image URL`);}\nif(!fs.existsSync("public/icons/vehicle-placeholder.svg")) failures.push("local vehicle placeholder missing");\nif(failures.length){console.error(failures.join("\\n"));process.exit(1);}\nconsole.log("Vehicle truth guard passed: cloud-only inventory, Storage-only media, no stale browser/fallback paths.");\n''')

          # 10. Make date accessibility guard permanent in the main quality gate.
          path='.github/workflows/alperler-quality-gate.yml'; text=load(path)
          if 'npm run a11y:dates' not in text:
              marker='      - name: TalkBack button accessibility guard\n        run: npm run a11y:buttons\n'
              if marker not in text: raise SystemExit('quality gate accessibility marker missing')
              text=text.replace(marker,marker+'\n      - name: TalkBack date-control accessibility guard\n        run: npm run a11y:dates\n',1)
          save(path,text)
          PY
          git diff --check
      - name: Validate final vehicle architecture
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run media:vehicles
          npm run a11y:buttons
          npm run a11y:dates
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build
      - name: Commit verified V118
        run: |
          set -euo pipefail
          rm -f .github/workflows/v118-final-vehicle-truth-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V118: finalize cloud-only truthful vehicle architecture"
          git push origin HEAD:main
