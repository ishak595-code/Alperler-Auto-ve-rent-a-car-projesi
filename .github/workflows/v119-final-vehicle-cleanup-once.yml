name: V119 Final Vehicle Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v119-final-vehicle-cleanup-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply final vehicle cleanup
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path,text): Path(path).parent.mkdir(parents=True,exist_ok=True); Path(path).write_text(text,encoding='utf-8'); print('patched',path)

          # Static vehicle fallbacks are deleted. Tour fallbacks remain intentionally.
          path='src/services/mock-data.ts'; text=load(path)
          start=text.find('  // --- KİRALIK (RENTAL) ARAÇLAR ---')
          end=text.find('  // --- TURLAR (TOUR) ---')
          if start >= 0 and end > start: text=text[:start]+text[end:]
          if re.search(r"category:\s*['\"](?:RENTAL|SALE)['\"]",text): raise SystemExit('static vehicle fallback remains')
          save(path,text)

          # Rental/sale cloud data goes straight in. Tour fallback enrichment stays separate.
          path='src/services/car.service.ts'; text=load(path)
          text=re.sub(r'''        const mergedVehicles = source\.map\(\(vehicle\) =>\n          this\.mergeVehicleWithFallback\(vehicle\),\n        \);\n        this\.replaceVehicleCatalog\(mergedVehicles\);''','''        this.replaceVehicleCatalog(source);''',text,count=1)
          text=text.replace('this.mergeVehicleWithFallback(tour) as Tour','this.mergeTourWithFallback(tour) as Tour')
          text=text.replace('private mergeVehicleWithFallback(vehicle: Vehicle): Vehicle {','private mergeTourWithFallback(vehicle: Vehicle): Vehicle {')
          if 'mergeVehicleWithFallback' in text: raise SystemExit('vehicle fallback merge remains')
          save(path,text)

          # A local image error placeholder replaces all remote vehicle fallbacks.
          save('public/icons/vehicle-placeholder.svg','''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect width="800" height="500" fill="#e2e8f0"/><path d="M195 322h410l-35-103c-9-27-34-45-62-45H292c-28 0-53 18-62 45l-35 103Z" fill="#64748b"/><path d="M251 244h298l-19-53H270l-19 53Z" fill="#cbd5e1"/><rect x="160" y="287" width="480" height="59" rx="22" fill="#475569"/><circle cx="280" cy="329" r="48" fill="#0f172a"/><circle cx="520" cy="329" r="48" fill="#0f172a"/><circle cx="280" cy="329" r="22" fill="#cbd5e1"/><circle cx="520" cy="329" r="22" fill="#cbd5e1"/><text x="400" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#334155">ALPERLER AUTO</text></svg>''')
          for path in ['src/components/vehicle-list-item.component.ts','src/components/vehicle-card.component.ts']:
              text=load(path)
              text=re.sub(r'image\.src\s*=\s*(?:\n\s*)?"https://images\.unsplash\.com/[^";]+";', 'image.src = "/icons/vehicle-placeholder.svg";',text)
              if 'images.unsplash.com' in text: raise SystemExit(f'{path}: remote fallback remains')
              save(path,text)

          # Remove universal marketing claims and use the actual record values.
          path='src/components/vehicle-card.component.ts'; text=load(path)
          text=re.sub(r'''\n        <div\n          class="mt-3 mb-2 flex flex-col gap-1\.5 text-\[11px\] sm:text-xs font-semibold text-slate-700"\n        >[\s\S]*?\n        </div>\n\n        <div\n          class="flex flex-col sm:flex-row''','''\n        <div\n          class="flex flex-col sm:flex-row''',text,count=1)
          text=text.replace('{{ t().car.premiumGallery }}','{{ car.availability || "Satışta" }}')
          text=text.replace('{{ t().car.location }}','{{ car.location || carService.getConfig()().address || "Konum belirtilmedi" }}')
          text=text.replace('(withDriver ? car.price + 1500 : car.price) | turkishCurrency','(withDriver ? car.price + (car.driverDailyFee || 0) : car.price) | turkishCurrency')
          for token in ['%100 Kaskolu & Yol Yardım','101 Nokta Ekspertizli','Alperler Güvencesi','t().car.premiumGallery','car.price + 1500']:
              if token in text: raise SystemExit(f'vehicle-card stale claim: {token}')
          save(path,text)

          path='src/models/car.model.ts'; text=load(path)
          if 'driverDailyFee?: number;' not in text:
              marker="  driverOption?: 'WITH_DRIVER' | 'WITHOUT_DRIVER' | 'BOTH';\n"
              if marker not in text: raise SystemExit('driverOption marker missing')
              text=text.replace(marker,marker+'  driverDailyFee?: number;\n',1)
          save(path,text)

          # Generic vehicle API never writes media columns and never stores media shadow fields.
          path='api/catalog.ts'; text=load(path)
          s=text.index('function normalizeVehicle'); e=text.index('function normalizeTour',s); block=text[s:e]
          block=re.sub(r'\n\s*const images = submittedImages;','',block,count=1)
          block=re.sub(r'\n\s*images,\n\s*cover_image: submittedCover \|\| images\[0\] \|\| null,','',block,count=1)
          old='metadata: { ...input, legacyId: id, cloudId: undefined, cloudStockCode: undefined },'
          if old in block:
              new='''metadata: (() => {\n      const businessMetadata = { ...input };\n      for (const key of ["image", "images", "gallery", "videos", "expertReport", "viewers", "viewersCount", "cloudId", "cloudStockCode"]) delete businessMetadata[key];\n      return { ...businessMetadata, legacyId: id };\n    })(),'''
              block=block.replace(old,new,1)
          if re.search(r'\n\s*images,',block) or 'cover_image:' in block: raise SystemExit('generic API still writes media')
          if 'metadata: { ...input' in block: raise SystemExit('generic API still stores raw metadata')
          text=text[:s]+block+text[e:]; save(path,text)

          # Warranty filter reads explicit DB boolean only.
          path='src/pages/sales-results.component.ts'; text=load(path)
          text=text.replace('this.filterWarranty() === "yes" && !(car.hasWarranty || car.warranty)','this.filterWarranty() === "yes" && car.hasWarranty !== true')
          save(path,text)
          path='src/pages/sales-results.component.html'; text=load(path).replace('aria-label="Satılık araç araçları"','aria-label="Satılık araç işlemleri"'); save(path,text)

          # Permanent architecture guard.
          save('scripts/check-vehicle-media.mjs','''import fs from "node:fs";\nconst failures=[];\nconst mock=fs.readFileSync("src/services/mock-data.ts","utf8");\nconst admin=fs.readFileSync("src/pages/admin/admin-catalog-editor.component.ts","utf8");\nconst service=fs.readFileSync("src/services/catalog-media.service.ts","utf8");\nconst carService=fs.readFileSync("src/services/car.service.ts","utf8");\nconst adminEditor=fs.readFileSync("src/services/catalog-admin-editor.service.ts","utf8");\nconst catalogApi=fs.readFileSync("api/catalog.ts","utf8");\nif(/category:\\s*["'](?:RENTAL|SALE)["']/.test(mock)) failures.push("static rental/sale fallback inventory exists");\nif(carService.includes("mergeVehicleWithFallback")) failures.push("vehicle fallback merge exists");\nif(carService.includes('localStorage.setItem("db_cars')||carService.includes('localStorage.setItem("db_saleCars')||carService.includes('this.readStorage("db_cars')||carService.includes('this.readStorage("db_saleCars')) failures.push("browser vehicle persistence exists");\nfor(const token of ["externalUrl","addExternalMedia","Kaynaklı Medyayı Ekle","Dış görsel","Dış video"]) if(admin.includes(token)) failures.push(`admin exposes ${token}`);\nif(/async\\s+addExternal\\s*\\(/.test(service)) failures.push("CatalogMediaService exposes addExternal()");\nconst ss=adminEditor.indexOf("async saveVehicle(record: VehicleAdminRecord)"),se=adminEditor.indexOf("async saveTour(record: TourAdminRecord)",ss),vehicleSave=adminEditor.slice(ss,se);\nif(/images:\\s*record\\.images/.test(vehicleSave)||/cover_image:\\s*record\\.coverImage/.test(vehicleSave)) failures.push("saveVehicle overwrites media authority");\nif(!catalogApi.includes("VEHICLE_MEDIA_STORAGE_ONLY")||!catalogApi.includes("trustedVehicleMediaUrl")||!catalogApi.includes('case "vehicles":\\n      return "no-store"')) failures.push("vehicle API media/cache guard missing");\nconst ns=catalogApi.indexOf("function normalizeVehicle"),ne=catalogApi.indexOf("function normalizeTour",ns),nv=catalogApi.slice(ns,ne);\nif(/\\n\\s*images,/.test(nv)||/cover_image:/.test(nv)) failures.push("generic vehicle API writes media columns");\nif(/metadata:\\s*\\{\\s*\.\.\.input/.test(nv)) failures.push("generic vehicle API stores raw shadow metadata");\nfor(const file of ["src/components/vehicle-list-item.component.ts","src/components/vehicle-card.component.ts","src/pages/car-detail.component.ts","src/pages/sale-car-detail.component.ts"]){const source=fs.readFileSync(file,"utf8");if(/images\\.unsplash\\.com|wikimedia\\.org|commons\\.wikimedia/i.test(source)) failures.push(`${file} contains third-party vehicle image URL`);}\nif(!fs.existsSync("public/icons/vehicle-placeholder.svg")) failures.push("local vehicle placeholder missing");\nif(failures.length){console.error(failures.join("\\n"));process.exit(1);}\nconsole.log("Vehicle truth guard passed: vehicles are cloud-only and media is Storage-only.");\n''')

          path='.github/workflows/alperler-quality-gate.yml'; text=load(path)
          if 'npm run a11y:dates' not in text:
              marker='      - name: TalkBack button accessibility guard\n        run: npm run a11y:buttons\n'
              if marker not in text: raise SystemExit('quality gate marker missing')
              text=text.replace(marker,marker+'\n      - name: TalkBack date-control accessibility guard\n        run: npm run a11y:dates\n',1)
          save(path,text)
          PY
          git diff --check
      - name: Validate vehicle and accessibility architecture
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run media:vehicles
          npm run a11y:buttons
          npm run a11y:dates
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build
      - name: Commit verified V119
        run: |
          set -euo pipefail
          rm -f .github/workflows/v119-final-vehicle-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V119: finalize cloud-only vehicle data and truthful cards"
          git push origin HEAD:main
