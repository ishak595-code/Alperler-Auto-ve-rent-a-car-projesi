name: V127 Unified UI Patch Once
on:
  push:
    branches: [v127-unified-detail-campaign-flow]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'V127: finalize unified detail UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v127-unified-detail-campaign-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch rental detail and campaign showcase
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Rental detail: one database-authoritative loader and one compact expandable details surface.
          p = Path('src/pages/car-detail.component.ts')
          s = p.read_text()
          s = s.replace('import { CatalogService } from "../services/catalog.service";\n', 'import { PublicDetailDataService } from "../services/public-detail-data.service";\n')
          s = s.replace('  private readonly catalog = inject(CatalogService);', '  private readonly detailData = inject(PublicDetailDataService);')
          s = s.replace('  readonly techOpen = signal(false);\n', '  readonly detailsOpen = signal(false);\n')
          s = s.replace('  async ngOnInit(): Promise<void> {\n    const shared = this.findVehicle(this.carService.getAllVehicles()());\n    if (shared) this.vehicle.set(this.prepareVehicle(shared as Car));\n    await this.reload();\n  }', '  async ngOnInit(): Promise<void> { await this.reload(); }')
          old_reload = '''      const records = await this.catalog.loadVehicles(true);\n      const match = this.findVehicle(records);\n      if (!match) throw new Error("Bu kiralık araç veritabanında bulunamadı.");\n      this.vehicle.set(this.prepareVehicle(match as Car));'''
          new_reload = '''      const match = await this.detailData.load("RENTAL", this.routeId) as Car;\n      this.vehicle.set(this.prepareVehicle(match));'''
          if old_reload not in s:
              raise SystemExit('rental reload block not found')
          s = s.replace(old_reload, new_reload)
          find_start = s.find('  private findVehicle(records: Car[]): Car | undefined {')
          find_end = s.find('  private prepareVehicle(car: Car): Car {', find_start)
          if find_start >= 0 and find_end > find_start:
              s = s[:find_start] + s[find_end:]
          media_start = s.find('  private toMediaUrl(value?: string): string {')
          media_end = s.find('\n  summaryMeta(car: Car): string {', media_start)
          if media_start < 0 or media_end < 0:
              raise SystemExit('rental media method not found')
          s = s[:media_start] + '  private toMediaUrl(value?: string): string { return this.detailData.mediaUrl(value); }\n' + s[media_end+1:]

          start = s.find('            <section class="panel" aria-labelledby="vehicle-details-title">')
          end = s.find('          </div>\n\n          <aside class="reservation-panel"', start)
          if start < 0 or end < 0:
              raise SystemExit('rental detail content block not found')
          replacement = '''            <section class="panel all-details-panel" aria-labelledby="all-details-title">
              <button type="button" class="all-details-toggle" (click)="detailsOpen.update(v => !v)" [attr.aria-expanded]="detailsOpen()" aria-controls="rental-all-details">
                <span><strong id="all-details-title">Tüm Özellikler ve Açıklama</strong><small>Araç bilgileri, donanım, açıklama ve teknik özellikler</small></span>
                <mat-icon aria-hidden="true">{{ detailsOpen() ? 'expand_less' : 'expand_more' }}</mat-icon>
              </button>
              @if (detailsOpen()) {
                <div id="rental-all-details" class="all-details-content">
                  <section class="details-group" aria-labelledby="vehicle-details-title"><h3 id="vehicle-details-title">Araç Bilgileri</h3><dl class="detail-list">
                    <div><dt>Gövde tipi</dt><dd>{{ displayValue(car.type) }}</dd></div><div><dt>Konum</dt><dd>{{ displayValue(car.location) }}</dd></div><div><dt>Sürücü seçeneği</dt><dd>{{ driverOptionLabel(car.driverOption) }}</dd></div>
                    @if (car.dailyMileageLimit) { <div><dt>Günlük kilometre</dt><dd>{{ car.dailyMileageLimit }} km</dd></div> }
                    @if (car.deposit !== undefined) { <div><dt>Depozito</dt><dd>{{ car.deposit | turkishCurrency }}</dd></div> }
                    @if (car.minAge) { <div><dt>Minimum yaş</dt><dd>{{ car.minAge }}</dd></div> }
                    @if (car.minLicenseYears) { <div><dt>Minimum ehliyet</dt><dd>{{ car.minLicenseYears }} yıl</dd></div> }
                  </dl></section>
                  @if (car.description) { <section class="details-group" aria-labelledby="description-title"><h3 id="description-title">Açıklama</h3><p class="description">{{ car.description }}</p></section> }
                  @if (car.features?.length) { <section class="details-group" aria-labelledby="features-title"><h3 id="features-title">Donanım ve Özellikler</h3><ul class="feature-list">@for (feature of car.features; track feature) { <li><mat-icon aria-hidden="true">check_circle</mat-icon><span>{{ feature }}</span></li> }</ul></section> }
                  @if (technicalSpecs(); as specs) { <section class="details-group" aria-labelledby="tech-title"><h3 id="tech-title">Teknik Özellikler</h3><dl class="tech-grid">@for (row of specRows(specs); track row.label) { <div><dt>{{ row.label }}</dt><dd>{{ row.value }}</dd></div> }</dl></section> }
                </div>
              }
            </section>
'''
          s = s[:start] + replacement + s[end:]
          marker = '.reservation-panel>p{margin:0;color:#93c5fd'
          css = '.all-details-panel{padding:0;overflow:hidden}.all-details-toggle{display:flex;width:100%;min-height:74px;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;padding:16px 18px;color:#fff;text-align:left}.all-details-toggle strong{display:block;color:#fff;font-size:18px}.all-details-toggle small{display:block;margin-top:4px;color:#94a3b8}.all-details-toggle:focus-visible{outline:3px solid #60a5fa;outline-offset:-3px}.all-details-content{border-top:1px solid #1e293b;padding:0 18px 18px}.details-group{padding-top:16px}.details-group+ .details-group{margin-top:16px;border-top:1px solid #1e293b}.details-group h3{margin:0 0 10px;color:#fff;font-size:15px}.all-details-content .detail-list{margin:0}.all-details-content .tech-grid{margin-top:0}'
          if marker not in s:
              raise SystemExit('rental css marker not found')
          s = s.replace(marker, css + marker)
          p.write_text(s)

          # Campaign cards: button + Angular router, real deadline only.
          p = Path('src/components/dynamic-home-section.component.ts')
          s = p.read_text()
          s = s.replace("import { RouterLink } from '@angular/router';", "import { Router, RouterLink } from '@angular/router';")
          s = s.replace("import { BranchService } from '../services/branch.service';", "import { BranchService } from '../services/branch.service';\nimport { PublicDetailDataService } from '../services/public-detail-data.service';")
          s = s.replace('  private readonly layout = inject(HomepageLayoutService);', '  private readonly layout = inject(HomepageLayoutService);\n  private readonly router = inject(Router);\n  private readonly detailData = inject(PublicDetailDataService);')
          block_start = s.find("            @if (section.sectionType === 'CAMPAIGN') {")
          block_end = s.find("            @if (section.sectionType === 'TOURS') {", block_start)
          if block_start < 0 or block_end < 0:
              raise SystemExit('campaign template block not found')
          campaign_block = '''            @if (section.sectionType === 'CAMPAIGN') {
              <div class="content-rail" [class.grid-layout]="isGrid()">
                @for (campaign of campaigns(); track campaign.id) {
                  <article class="offer-card">
                    <button type="button" class="offer-link campaign-button" (click)="openCampaign(campaign)" [attr.aria-label]="campaignAriaLabel(campaign)">
                      <div class="media"><img [src]="campaignImage(campaign) || fallbackImage" [alt]="campaign.title" loading="lazy" />
                        @if (campaign.badge || campaign.discountPercent) { <span class="media-badge">{{ campaign.badge || ('%' + campaign.discountPercent + ' avantaj') }}</span> }
                        @if (campaign.endsAt) { <span class="campaign-time" [class.urgent]="campaignUrgent(campaign.endsAt)"><mat-icon aria-hidden="true">schedule</mat-icon>{{ campaignCountdown(campaign.endsAt) }}</span> }
                      </div>
                      <div class="card-body">
                        <p class="micro">{{ campaignHook(campaign) }}</p><h3>{{ campaign.title }}</h3><p>{{ campaign.shortDescription || campaign.description || 'Fırsatın kapsamını ve koşullarını inceleyin.' }}</p>
                        <div class="price-row"><div>@if (campaign.oldPrice && campaign.newPrice && campaign.oldPrice > campaign.newPrice) { <span class="old-price">{{ formatPrice(campaign.oldPrice) }}</span> } @if (campaign.newPrice != null) { <strong>{{ formatPrice(campaign.newPrice) }}</strong> }</div>@if (campaignSavings(campaign) > 0) { <span class="saving">{{ formatPrice(campaignSavings(campaign)) }} avantaj</span> }</div>
                        <span class="card-cta">{{ campaign.ctaLabel || 'Fırsatı İncele' }} <mat-icon aria-hidden="true">arrow_forward</mat-icon></span>
                      </div>
                    </button>
                  </article>
                }
              </div>
            }

'''
          s = s[:block_start] + campaign_block + s[block_end:]
          css_marker = '.offer-link,.image-card{display:block;color:inherit;text-decoration:none}'
          css_add = '.offer-link,.image-card{display:block;color:inherit;text-decoration:none}.campaign-button{width:100%;border:0;background:transparent;padding:0;text-align:left;font:inherit;cursor:pointer}.campaign-button:focus-visible{outline:3px solid #60a5fa;outline-offset:-3px}.campaign-time{position:absolute;z-index:2;left:.65rem;bottom:.65rem;display:flex;align-items:center;gap:.2rem;border-radius:999px;background:#fff;padding:.35rem .5rem;color:#0f172a;font-size:.57rem;font-weight:950}.campaign-time.urgent{background:#dc2626;color:#fff}.campaign-time mat-icon{width:14px;height:14px;font-size:14px}'
          if css_marker not in s:
              raise SystemExit('campaign css marker not found')
          s = s.replace(css_marker, css_add)
          method_start = s.find('  campaignHref(campaign: CampaignRecord): string {')
          method_end = s.find('\n  private orderedEntities', method_start)
          if method_start < 0 or method_end < 0:
              raise SystemExit('campaignHref method not found')
          methods = '''  campaignImage(campaign: CampaignRecord): string { return this.detailData.mediaUrl(campaign.coverImage); }
  campaignCountdown(value: string): string { const remaining = new Date(value).getTime() - Date.now(); if (!Number.isFinite(remaining) || remaining <= 0) return 'Süre doldu'; const hours = Math.floor(remaining / 3_600_000); const days = Math.floor(hours / 24); if (days > 1) return `${days} gün kaldı`; if (days === 1) return '1 gün kaldı'; return `${Math.max(1, hours)} saat kaldı`; }
  campaignUrgent(value: string): boolean { const remaining = new Date(value).getTime() - Date.now(); return Number.isFinite(remaining) && remaining > 0 && remaining <= 48 * 3_600_000; }
  campaignAriaLabel(campaign: CampaignRecord): string { return `${campaign.title}. ${campaign.endsAt ? this.campaignCountdown(campaign.endsAt) + '. ' : ''}${campaign.ctaLabel || 'Fırsatı incele'}`; }
  async openCampaign(campaign: CampaignRecord): Promise<void> { const route = await this.detailData.resolveCampaignTarget(campaign.targetType, campaign.targetId, campaign.ctaUrl); await this.router.navigateByUrl(route); }
'''
          s = s[:method_start] + methods + s[method_end:]
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/v127-unified-ui-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/car-detail.component.ts src/components/dynamic-home-section.component.ts .github/workflows/v127-unified-ui-patch-once.yml
          git diff --check
          git commit -m "V127: finalize unified detail UI"
          git push origin HEAD:v127-unified-detail-campaign-flow
