name: Apply V152 date and duration patch

on:
  push:
    branches:
      - v152-date-picker-duration-fix
    paths:
      - "project/apply-v152-date-duration.mjs"
      - ".github/workflows/v152-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: node project/apply-v152-date-duration.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore stable calendar picker and add weekly rentals"
          git push origin HEAD:v152-date-picker-duration-fix
