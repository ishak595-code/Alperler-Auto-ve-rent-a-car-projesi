name: V163 Booking BFF Patch

on:
  push:
    branches:
      - v163-production-security-data-integrity
    paths:
      - "scripts/v163-booking-bff-trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-data-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Harden booking gateway BFF boundary
        run: node scripts/v163-booking-bff-patch.mjs
      - name: Commit booking gateway only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/booking-gateway/index.ts
          git diff --cached --check
          git commit -m "V163: make booking gateway BFF-only"
          git push origin HEAD:v163-production-security-data-integrity
