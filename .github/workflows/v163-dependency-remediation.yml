name: V163 Dependency Remediation

on:
  push:
    branches:
      - v163-production-security-verification
    paths:
      - ".github/workflows/v163-dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-verification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Upgrade vulnerable production framework dependencies within current majors
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

          ANGULAR_VERSION="$(npm view @angular/core@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          MATERIAL_VERSION="$(npm view @angular/material@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          BUILD_VERSION="$(npm view @angular/build@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          CLI_VERSION="$(npm view @angular/cli@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          NODEMAILER_VERSION="$(npm view nodemailer version)"
          EXPRESS_VERSION="$(npm view express@5 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          VITE_VERSION="$(npm view vite@6 version --json | jq -r 'if type == "array" then .[-1] else . end')"

          echo "Angular ${ANGULAR_VERSION}; Material ${MATERIAL_VERSION}; Build ${BUILD_VERSION}; CLI ${CLI_VERSION}; Express ${EXPRESS_VERSION}; Nodemailer ${NODEMAILER_VERSION}; Vite ${VITE_VERSION}"

          npm install --save-exact \
            "@angular/common@${ANGULAR_VERSION}" \
            "@angular/compiler@${ANGULAR_VERSION}" \
            "@angular/core@${ANGULAR_VERSION}" \
            "@angular/forms@${ANGULAR_VERSION}" \
            "@angular/material@${MATERIAL_VERSION}" \
            "@angular/platform-browser@${ANGULAR_VERSION}" \
            "@angular/router@${ANGULAR_VERSION}" \
            "express@${EXPRESS_VERSION}" \
            "nodemailer@${NODEMAILER_VERSION}" \
            --no-audit --no-fund

          npm install --save-dev --save-exact \
            "@angular/build@${BUILD_VERSION}" \
            "@angular/cli@${CLI_VERSION}" \
            "@angular/compiler-cli@${ANGULAR_VERSION}" \
            "@types/pdfkit@0.17.6" \
            "postcss@8.5.26" \
            "vite@${VITE_VERSION}" \
            --no-audit --no-fund

          npm audit fix --no-audit --no-fund || true

      - name: Require clean high-severity production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Compile upgraded dependency graph
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit remediated dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency graph already remediated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "V163: remediate production dependency vulnerabilities"
          git push origin HEAD:v163-production-security-verification
