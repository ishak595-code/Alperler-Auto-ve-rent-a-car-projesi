name: V163 Dependency Remediation

on:
  push:
    branches:
      - v163-production-security-verification
    paths:
      - ".github/workflows/v163-dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-verification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rebuild a clean patched dependency graph
        shell: bash
        run: |
          set -euo pipefail

          ANGULAR_VERSION="$(npm view @angular/core@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          MATERIAL_VERSION="$(npm view @angular/material@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          BUILD_VERSION="$(npm view @angular/build@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          CLI_VERSION="$(npm view @angular/cli@21 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          NODEMAILER_VERSION="$(npm view nodemailer version)"
          EXPRESS_VERSION="$(npm view express@5 version --json | jq -r 'if type == "array" then .[-1] else . end')"
          VITE_VERSION="$(npm view vite@6 version --json | jq -r 'if type == "array" then .[-1] else . end')"

          echo "Angular ${ANGULAR_VERSION}; Material/CDK ${MATERIAL_VERSION}; Build ${BUILD_VERSION}; CLI ${CLI_VERSION}; Express ${EXPRESS_VERSION}; Nodemailer ${NODEMAILER_VERSION}; Vite ${VITE_VERSION}"

          npm pkg delete \
            'dependencies.@angular/build' \
            'dependencies.@angular/cli' \
            'dependencies.@angular/compiler-cli' \
            'dependencies.@types/pdfkit'

          npm pkg set \
            "dependencies.@angular/common=${ANGULAR_VERSION}" \
            "dependencies.@angular/compiler=${ANGULAR_VERSION}" \
            "dependencies.@angular/core=${ANGULAR_VERSION}" \
            "dependencies.@angular/forms=${ANGULAR_VERSION}" \
            "dependencies.@angular/cdk=${MATERIAL_VERSION}" \
            "dependencies.@angular/material=${MATERIAL_VERSION}" \
            "dependencies.@angular/platform-browser=${ANGULAR_VERSION}" \
            "dependencies.@angular/router=${ANGULAR_VERSION}" \
            "dependencies.express=${EXPRESS_VERSION}" \
            "dependencies.nodemailer=${NODEMAILER_VERSION}" \
            "devDependencies.@angular/build=${BUILD_VERSION}" \
            "devDependencies.@angular/cli=${CLI_VERSION}" \
            "devDependencies.@angular/compiler-cli=${ANGULAR_VERSION}" \
            "devDependencies.@types/pdfkit=0.17.6" \
            "devDependencies.postcss=8.5.26" \
            "devDependencies.vite=${VITE_VERSION}"

          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Require clean high-severity production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Compile upgraded dependency graph
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit remediated dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency graph already remediated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "V163: remediate production dependency vulnerabilities"
          git push origin HEAD:v163-production-security-verification
