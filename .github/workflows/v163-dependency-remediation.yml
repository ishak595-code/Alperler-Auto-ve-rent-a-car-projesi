name: V163 Dependency Remediation

on:
  push:
    branches:
      - v163-production-security-data-integrity
    paths:
      - "scripts/v163-dependency-remediation-trigger.txt"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-data-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install current lockfile
        run: npm ci --no-audit --no-fund
      - name: Upgrade vulnerable framework and mail roots
        shell: bash
        run: |
          set -euo pipefail
          npm install --save \
            @angular/animations@21.2.19 \
            @angular/cdk@21.2.6 \
            @angular/common@21.2.19 \
            @angular/compiler@21.2.19 \
            @angular/core@21.2.19 \
            @angular/forms@21.2.19 \
            @angular/material@21.2.6 \
            @angular/platform-browser@21.2.19 \
            @angular/platform-browser-dynamic@21.2.19 \
            @angular/router@21.2.19 \
            nodemailer@9.0.5 \
            --no-audit --no-fund
          npm install --save-dev \
            @angular/build@21.2.19 \
            @angular/cli@21.2.19 \
            @angular/compiler-cli@21.2.19 \
            @types/nodemailer@latest \
            --no-audit --no-fund
      - name: Apply remaining compatible audit fixes
        run: npm audit fix --no-fund
      - name: Verify production vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Verify full dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Verify TypeScript
        run: npm run lint
      - name: Verify API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Verify production build
        run: npm run build
      - name: Commit dependency manifests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "V163: remediate framework and production dependency vulnerabilities"
          git push origin HEAD:v163-production-security-data-integrity
