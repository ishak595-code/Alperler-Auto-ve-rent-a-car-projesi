name: V163 Dependency Remediation

on:
  push:
    branches:
      - v163-production-security-data-integrity
    paths:
      - "scripts/v163-dependency-remediation-trigger.txt"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-data-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install current lockfile
        run: npm ci --no-audit --no-fund
      - name: Apply non-breaking audit fixes
        run: npm audit fix --omit=dev --no-fund
      - name: Upgrade direct vulnerable mail transport if still required
        shell: bash
        run: |
          set -euo pipefail
          if npm audit --omit=dev --audit-level=high >/tmp/audit-before.txt 2>&1; then
            cat /tmp/audit-before.txt
            exit 0
          fi
          cat /tmp/audit-before.txt
          if grep -q "nodemailer" /tmp/audit-before.txt; then
            npm install --save nodemailer@latest @types/nodemailer@latest --no-audit --no-fund
          fi
      - name: Verify production vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Verify TypeScript
        run: npm run lint
      - name: Verify production build
        run: npm run build
      - name: Commit dependency manifests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "V163: remediate production dependency vulnerabilities"
          git push origin HEAD:v163-production-security-data-integrity
