name: V163 Dependency Remediation

on:
  push:
    branches:
      - v163-production-security-verification
    paths:
      - ".github/workflows/v163-dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-verification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Upgrade vulnerable production framework dependencies within current majors
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --save-exact @angular/common@21 @angular/compiler@21 @angular/core@21 @angular/forms@21 @angular/material@21 @angular/platform-browser@21 @angular/router@21 express@5 nodemailer@latest --no-audit --no-fund
          npm install --save-dev --save-exact @angular/build@21 @angular/cli@21 @angular/compiler-cli@21 @types/pdfkit@0.17.6 postcss@8.5.26 vite@6 --no-audit --no-fund
          npm audit fix --no-audit --no-fund || true

      - name: Require clean high-severity production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Compile upgraded dependency graph
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build

      - name: Commit remediated dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency graph already remediated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "V163: remediate production dependency vulnerabilities"
          git push origin HEAD:v163-production-security-verification
