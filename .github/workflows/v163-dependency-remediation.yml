name: V163 Dependency Remediation

on:
  push:
    branches:
      - v163-production-security-data-integrity
    paths:
      - "scripts/v163-dependency-remediation-trigger.txt"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-data-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install current lockfile
        run: npm ci --no-audit --no-fund
      - name: Upgrade vulnerable framework and mail roots
        shell: bash
        run: |
          set -euo pipefail
          npm install --save \
            @angular/animations@^21.2.20 \
            @angular/common@^21.2.20 \
            @angular/compiler@^21.2.20 \
            @angular/core@^21.2.20 \
            @angular/forms@^21.2.20 \
            @angular/platform-browser@^21.2.20 \
            @angular/platform-browser-dynamic@^21.2.20 \
            @angular/router@^21.2.20 \
            @angular/cdk@^21.2.0 \
            @angular/material@^21.2.0 \
            nodemailer@^9.0.5 \
            --no-audit --no-fund
          npm install --save-dev \
            @angular/build@^21.2.20 \
            @angular/cli@^21.2.20 \
            @angular/compiler-cli@^21.2.20 \
            @types/pdfkit@^0.17.6 \
            @types/nodemailer@^7.0.0 \
            tailwindcss@4.2.1 \
            --no-audit --no-fund
          npm uninstall @types/pdfkit --save --no-audit --no-fund || true
          npm install --save-dev @types/pdfkit@^0.17.6 --no-audit --no-fund
      - name: Apply compatible transitive fixes
        run: npm audit fix --no-fund
      - name: Verify production vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Verify full dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Verify TypeScript
        run: npm run lint
      - name: Verify API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Verify production build
        run: npm run build
      - name: Commit dependency manifests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "V163: remediate framework and production dependency vulnerabilities"
          git push origin HEAD:v163-production-security-data-integrity
