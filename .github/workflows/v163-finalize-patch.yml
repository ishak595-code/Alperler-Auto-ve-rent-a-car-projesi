name: V163 Finalize Patch

on:
  push:
    branches:
      - v163-production-security-data-integrity
    paths:
      - ".github/scripts/v163-finalize.cjs"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v163-production-security-data-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply V163 final architecture patch
        run: node .github/scripts/v163-finalize.cjs
      - name: Commit finalized architecture
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/services/booking.service.ts \
            supabase/functions/booking-gateway/index.ts \
            supabase/functions/customer-document-upload/index.ts \
            supabase/migrations/20260825071000_v163_pending_approval_and_alternatives.sql \
            scripts/check-production-security-v163.mjs
          git commit -m "V163: complete production approval and security architecture"
          git push origin HEAD:v163-production-security-data-integrity
