name: V163.2 Fix CI
on:
  push:
    branches: [v1632-production-integration-audit]
    paths:
      - scripts/v1632-fix-ci.mjs
      - .github/workflows/v1632-fix-ci.yml
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v1632-ci-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1632-production-integration-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v1632-fix-ci.mjs
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/booking-checkout.component.ts
          git commit -m "V163.2: repair checkout compile and branch error UX [v1632-ci-fixed]"
          git push origin HEAD:v1632-production-integration-audit
