name: V165 Branch Partner Origin Patch

on:
  push:
    branches:
      - v165-production-hardening
    paths:
      - ".github/workflows/v165-patch-branch-partner-origin.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v165-production-hardening
          fetch-depth: 0

      - name: Apply deterministic origin hardening patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/functions/branch-partner-v164/index.ts")
          src = path.read_text()

          marker = 'const SERVICE_KEY = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "";\n'
          insertion = '''const SERVICE_KEY = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "";\nconst ALLOWED_ORIGINS = new Set(\n  (Deno.env.get("APP_ALLOWED_ORIGINS") || "")\n    .split(",")\n    .map((value) => value.trim())\n    .filter(Boolean)\n    .map((value) => { try { return new URL(value).origin; } catch { return ""; } })\n    .filter(Boolean),\n);\n'''
          if src.count(marker) != 1:
              raise SystemExit("SERVICE_KEY marker mismatch")
          src = src.replace(marker, insertion, 1)

          old_cors = '''function cors(request: Request): Record<string, string> {\n  const origin = clean(request.headers.get("origin"), 240);\n  return {\n    ...(origin ? { "access-control-allow-origin": origin } : {}),\n    "access-control-allow-methods": "GET,POST,PATCH,OPTIONS",\n    "access-control-allow-headers": "authorization,apikey,content-type,x-client-info,x-request-id,x-client-ip,x-app-origin",\n    "access-control-max-age": "600",\n    vary: "Origin",\n  };\n}\n'''
          new_cors = '''function allowedOrigin(request: Request): string | null {\n  const raw = clean(request.headers.get("origin"), 240);\n  if (!raw) return null;\n  try {\n    const parsed = new URL(raw);\n    const local = (parsed.hostname === "localhost" || parsed.hostname === "127.0.0.1") && (parsed.protocol === "http:" || parsed.protocol === "https:");\n    return local || ALLOWED_ORIGINS.has(parsed.origin) ? parsed.origin : "";\n  } catch {\n    return "";\n  }\n}\nfunction cors(request: Request): Record<string, string> {\n  const origin = allowedOrigin(request);\n  return {\n    ...(origin ? { "access-control-allow-origin": origin } : {}),\n    "access-control-allow-methods": "GET,POST,PATCH,OPTIONS",\n    "access-control-allow-headers": "authorization,apikey,content-type,x-client-info,x-request-id,x-client-ip,x-app-origin",\n    "access-control-max-age": "600",\n    vary: "Origin",\n  };\n}\n'''
          if src.count(old_cors) != 1:
              raise SystemExit("CORS block marker mismatch")
          src = src.replace(old_cors, new_cors, 1)

          serve_marker = '''Deno.serve(async (request) => {\n  const id = requestId(request);\n  if (request.method === "OPTIONS") return new Response(null, { status: 204, headers: { ...cors(request), "x-request-id": id } });\n'''
          serve_replacement = '''Deno.serve(async (request) => {\n  const id = requestId(request);\n  const origin = allowedOrigin(request);\n  if (request.headers.get("origin") && origin === "") return json(request, { ok: false, code: "ORIGIN_NOT_ALLOWED", requestId: id }, 403, id);\n  if (request.method === "OPTIONS") return new Response(null, { status: 204, headers: { ...cors(request), "x-request-id": id } });\n'''
          if src.count(serve_marker) != 1:
              raise SystemExit("Deno.serve marker mismatch")
          src = src.replace(serve_marker, serve_replacement, 1)
          path.write_text(src)

          guard = Path("scripts/check-v165-production-hardening.mjs")
          g = guard.read_text()
          guard_marker = 'contains(branchPartner, "allowedRedirectOrigin", "Branch invite redirects must be allow-listed");\n'
          guard_replacement = guard_marker + 'contains(branchPartner, "APP_ALLOWED_ORIGINS", "Branch partner direct Edge boundary must use configured origin allow-list");\ncontains(branchPartner, "ORIGIN_NOT_ALLOWED", "Branch partner direct Edge boundary must reject untrusted origins");\n'
          if g.count(guard_marker) != 1:
              raise SystemExit("hardening guard marker mismatch")
          guard.write_text(g.replace(guard_marker, guard_replacement, 1))

          Path(".github/workflows/v165-patch-branch-partner-origin.yml").unlink()

      - name: Commit deterministic patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V165: enforce origin allow-list on branch partner Edge boundary"
          git push origin HEAD:v165-production-hardening
