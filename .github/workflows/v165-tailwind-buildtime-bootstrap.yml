name: V165 Build-time Tailwind Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - v165-production-hardening
    paths:
      - ".github/workflows/v165-tailwind-buildtime-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: v165-tailwind-bootstrap
  cancel-in-progress: false

jobs:
  lockfile:
    name: regenerate-lockfile-exactly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: v165-production-hardening
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Add exact production Tailwind build dependencies
        run: npm install --save-dev --save-exact @tailwindcss/postcss@4.2.1 postcss@8.5.26 --no-audit --no-fund

      - name: Verify dependency graph and lockfile
        run: |
          npm ls @tailwindcss/postcss postcss tailwindcss --depth=0
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.devDependencies['@tailwindcss/postcss']!=='4.2.1') process.exit(1); if(p.devDependencies.postcss!=='8.5.26') process.exit(1); if(l.packages[''].devDependencies['@tailwindcss/postcss']!=='4.2.1') process.exit(1); if(l.packages[''].devDependencies.postcss!=='8.5.26') process.exit(1);"

      - name: Commit lockfile generated by npm
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "V165: lock build-time Tailwind PostCSS toolchain"
          git push origin HEAD:v165-production-hardening
