name: V168 Sale Showcase Truth Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - ".github/workflows/v168-sale-showcase-integrity.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: v168-sale-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sale-showcase-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: V168 sale publication database contract
        shell: bash
        run: |
          set -euo pipefail
          MIG="supabase/migrations/20260825181000_v168_sale_publication_truth_gate.sql"
          test -f "$MIG"
          for token in SALE_MILEAGE_REQUIRED SALE_FUEL_REQUIRED SALE_TRANSMISSION_REQUIRED SALE_BODY_TYPE_REQUIRED SALE_COLOR_REQUIRED SALE_ENGINE_REQUIRED SALE_LOCATION_REQUIRED SALE_DAMAGE_STATUS_REQUIRED SALE_TRAMER_DECLARATION_REQUIRED; do grep -q "$token" "$MIG"; done
          grep -q "new.category='SALE'" "$MIG"
      - name: Bounded sale catalog and canonical detail contract
        shell: bash
        run: |
          set -euo pipefail
          SHOW="src/pages/sale-catalog-v217.component.ts"
          CARD="src/components/sale-vehicle-card-v168.component.ts"
          DETAIL="src/pages/sale-car-detail.component.ts"
          test -f "$SHOW" && test -f "$CARD" && test -f "$DETAIL"
          grep -q "vehicleFacets('SALE')" "$SHOW"
          grep -q "minPrice" "$SHOW"
          grep -q "maxPrice" "$SHOW"
          grep -q "minKm" "$SHOW"
          grep -q "maxKm" "$SHOW"
          grep -q "branchLabel(car" "$SHOW"
          grep -q "tramer-unverified" "$SHOW"
          grep -q "SaleVehicleCardV168Component" "$SHOW"
          grep -q "cloudStockCode" "$CARD"
          grep -q "branchLabel" "$CARD"
          grep -q "İLAN BİLGİLERİ" "$DETAIL"
          grep -q "AÇIKLAMA" "$DETAIL"
          grep -q "KONUM" "$DETAIL"
          grep -q "readonly listingRows = computed<ListingRow\[]>" "$DETAIL"
          grep -q "tramerStatusLabel" "$DETAIL"
          grep -q "damageExpertise" "$DETAIL"
          grep -q "technicalRows" "$DETAIL"
          grep -q "bottom-actions" "$DETAIL"
          grep -q "launchExternal" "$DETAIL"
          if grep -Fq 'class="summary"' "$DETAIL" || grep -Fq "summaryMeta(" "$DETAIL"; then
            echo "Sale hero must not duplicate year/km/fuel/transmission/body facts above İlan Bilgileri"
            exit 1
          fi
          if grep -Eq "priceOptions|kmOptions|0-500000|150000\+" "$SHOW"; then
            echo "Sale price/km filters must derive from live numeric bounds"
            exit 1
          fi
          if grep -q "config().address\|getConfig()().address" "$CARD" "$DETAIL"; then
            echo "Sale showcase/detail must not mask vehicle location with global company address"
            exit 1
          fi
          if grep -Eq "isCampaign|discountRate" "$CARD"; then
            echo "Sale card must not use legacy campaign shadow flags"
            exit 1
          fi
          grep -q "SaleCatalogV217Component" src/pages/sales-results.component.ts
          grep -q "SaleCarDetailComponent" src/pages/catalog-detail-shells.component.ts
          test ! -f src/pages/sale-detail-v168.component.ts
          test ! -f src/pages/sale-detail-v1681.component.ts
      - name: Current Super Admin sale workspace contract
        shell: bash
        run: |
          set -euo pipefail
          ADMIN="src/pages/admin/admin-catalog-workspace.component.ts"
          HUB="src/pages/admin/admin-content-hub.component.ts"
          test -f "$ADMIN"
          for token in damageExpertise isDamageFree saleTruthError damageStatus tramerStatus local_painted frontLeftDoor rearRightFender tramerSourceUrl tramerVerifiedAt; do grep -q "$token" "$ADMIN"; done
          grep -q 'mode="SALE"' "$HUB"
          grep -q "'/admin/sales'" "$HUB"
          if grep -q "AdminSaleIntegrityV1681Component\|AdminCatalogEditorComponent" "$HUB"; then
            echo "Legacy parallel sale editors must not return to active content hub"
            exit 1
          fi
      - name: Preserve V167 rental commercial integrity
        shell: bash
        run: |
          set -euo pipefail
          RENTAL="src/pages/rental-catalog-v217.component.ts"
          test -f supabase/migrations/20260825170000_v167_rental_campaign_integrity.sql
          grep -q "RentalCatalogV217Component" src/pages/fleet.component.ts
          grep -q "RentalVehicleCardV167Component" "$RENTAL"
          grep -q "VisibleCampaignsV217Service" "$RENTAL"
          grep -q "CarDetailComponent" src/pages/catalog-detail-shells.component.ts
          grep -q "campaign_redemptions_required_extras_v167" supabase/migrations/20260825170000_v167_rental_campaign_integrity.sql
      - name: Frontend TypeScript check
        run: npm run lint
      - name: Vercel API TypeScript check
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Accessibility and installability guards
        run: |
          npm run a11y:buttons
          npm run a11y:dates
          npm run pwa:installability
          npm run vercel:functions
      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Booking gateway regression check
        run: deno check --node-modules-dir=auto supabase/functions/booking-gateway-v166/index.ts
      - name: Production Angular build
        run: npm run build
