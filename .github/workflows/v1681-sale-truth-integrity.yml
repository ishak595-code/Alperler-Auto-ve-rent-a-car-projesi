name: V168.1 Sale Truth Integrity
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sale-truth-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Structured tramer database contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260825183500_v1681_structured_tramer_truth.sql
          test -f "$FILE"
          grep -Fq "DECLARED_CLEAN" "$FILE"
          grep -Fq "VERIFIED_RECORD" "$FILE"
          grep -Fq "SALE_TRAMER_AMOUNT_REQUIRED" "$FILE"
          grep -Fq "SALE_TRAMER_VERIFICATION_PROVENANCE_REQUIRED" "$FILE"
          grep -Fq "local_painted" "$FILE"
          grep -Fq "SALE_DAMAGE_FREE_EXPERTISE_CONFLICT" "$FILE"
          grep -Fq "expertiseSummary" "$FILE"
          grep -Fq "13-v_known" "$FILE"
      - name: Canonical sale admin workspace contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/admin/admin-catalog-workspace.component.ts
          HUB=src/pages/admin/admin-content-hub.component.ts
          test -f "$FILE" && test -f "$HUB"
          grep -Fq "damageExpertise" "$FILE"
          grep -Fq "isDamageFree" "$FILE"
          grep -Fq "saleTruthError" "$FILE"
          grep -Fq "tramerStatus" "$FILE"
          grep -Fq "tramerAmount" "$FILE"
          grep -Fq "tramerSourceUrl" "$FILE"
          grep -Fq "local_painted" "$FILE"
          grep -Fq "frontLeftDoor" "$FILE"
          grep -Fq "rearRightFender" "$FILE"
          grep -Fq 'mode="SALE"' "$HUB"
          if grep -Fq "AdminSaleIntegrityV1681Component" "$HUB" || grep -Fq "AdminCatalogEditorComponent" "$HUB"; then
            echo "Legacy parallel sale editors must not return to the active admin hub"
            exit 1
          fi
      - name: Canonical public sale truth renderer
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL=src/pages/sale-car-detail.component.ts
          GRAPHIC=src/components/expertise-graphic.component.ts
          CARD=src/components/sale-vehicle-card-v168.component.ts
          grep -Fq "İLAN BİLGİLERİ" "$CANONICAL"
          grep -Fq "AÇIKLAMA" "$CANONICAL"
          grep -Fq "KONUM" "$CANONICAL"
          grep -Fq "Ekspertiz Özeti" "$CANONICAL"
          grep -Fq "app-expertise-graphic" "$CANONICAL"
          grep -Fq "tramerStatusLabel" "$CANONICAL"
          grep -Fq "damageExpertise" "$CANONICAL"
          grep -Fq "readonly listingRows = computed<ListingRow[]>" "$CANONICAL"
          if grep -Fq 'class="core-facts"' "$CANONICAL"; then
            echo "Canonical sale detail must not duplicate listing facts above İlan Bilgileri"
            exit 1
          fi
          grep -Fq "local_painted" "$GRAPHIC"
          grep -Fq "rearBumper" "$GRAPHIC"
          grep -Fq "Arka tampon" "$GRAPHIC"
          grep -Fq "Bilgi yok" "$GRAPHIC"
          grep -Fq "tramerLabel" "$CARD"
          grep -Fq "Tramer: bilinmiyor" "$CARD"
          grep -Fq "tramerAmount" "$CARD"
      - name: Admin publication preflight mirrors DB
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/services/catalog-admin-editor.service.ts
          grep -Fq "tramerStatus" "$FILE"
          grep -Fq "tramerAmount" "$FILE"
          grep -Fq "local_painted" "$FILE"
          grep -Fq "tramerSourceUrl" "$FILE"
      - name: Preserve approved public detail ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "SalesShowcaseV168Component" src/pages/sales-results.component.ts
          grep -Fq "RentalShowcaseV167Component" src/pages/fleet.component.ts
          grep -Fq "CarDetailComponent" src/pages/catalog-detail-shells.component.ts
          grep -Fq "SaleCarDetailComponent" src/pages/catalog-detail-shells.component.ts
          if grep -Fq "RentalDetailV167Component" src/pages/catalog-detail-shells.component.ts || grep -Fq "SaleDetailV1681Component" src/pages/catalog-detail-shells.component.ts; then
            echo "Approved public detail owners must not be replaced by historical renderer generations"
            exit 1
          fi
      - name: Frontend TypeScript
        run: npm run lint
      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Accessibility guards
        run: |
          npm run a11y:buttons
          npm run a11y:dates
      - name: Production Angular build
        run: npm run build
