name: V168.1 Sale Truth Integrity
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sale-truth-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Structured tramer database contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260825183500_v1681_structured_tramer_truth.sql
          test -f "$FILE"
          for token in DECLARED_CLEAN VERIFIED_RECORD SALE_TRAMER_AMOUNT_REQUIRED SALE_TRAMER_VERIFICATION_PROVENANCE_REQUIRED local_painted SALE_DAMAGE_FREE_EXPERTISE_CONFLICT expertiseSummary '13-v_known'; do grep -Fq "$token" "$FILE"; done
      - name: Canonical Super Admin sale form contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/admin/admin-catalog-workspace.component.ts
          HUB=src/pages/admin/admin-content-hub.component.ts
          for token in "Toplam tramer TL" "Lokal boyalı" saleParts tramerSourceUrl tramerSourceName tramerVerifiedAt saleTruthError damageExpertise isDamageFree; do grep -Fq "$token" "$FILE"; done
          grep -Fq 'mode="SALE"' "$HUB"
          test ! -f src/pages/admin/admin-catalog-editor.component.ts
          test ! -f src/pages/admin/admin-sale-integrity-v1681.component.ts
      - name: Canonical sale truth renderer
        shell: bash
        run: |
          set -euo pipefail
          DETAIL=src/pages/sale-car-detail.component.ts
          GRAPHIC=src/components/expertise-graphic.component.ts
          CARD=src/components/sale-vehicle-card-v168.component.ts
          for token in "İLAN BİLGİLERİ" "AÇIKLAMA" "KONUM" "Ekspertiz ve Hasar Geçmişi" "app-expertise-graphic" tramerStatusLabel damageExpertise "readonly listingRows = computed<ListingRow[]>" truth-list; do grep -Fq "$token" "$DETAIL"; done
          if grep -Fq 'class="core-facts"' "$DETAIL" || grep -Fq 'class="summary"' "$DETAIL" || grep -Fq "summaryMeta(" "$DETAIL"; then
            echo "Canonical sale detail must not duplicate listing facts above İlan Bilgileri"
            exit 1
          fi
          for token in local_painted rearBumper "Arka tampon" "Bilgi yok"; do grep -Fq "$token" "$GRAPHIC"; done
          for token in tramerLabel "Tramer bilgisi paylaşılmamış" tramerAmount; do grep -Fq "$token" "$CARD"; done
          test ! -f src/pages/sale-detail-v168.component.ts
          test ! -f src/pages/sale-detail-v1681.component.ts
      - name: Admin publication preflight mirrors DB
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/services/catalog-admin-editor.service.ts
          for token in tramerStatus tramerAmount local_painted tramerSourceUrl; do grep -Fq "$token" "$FILE"; done
      - name: Preserve approved public owners
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "SaleCatalogV217Component" src/pages/sales-results.component.ts
          grep -Fq "RentalCatalogV217Component" src/pages/fleet.component.ts
          grep -Fq "SaleVehicleCardV168Component" src/pages/sale-catalog-v217.component.ts
          grep -Fq "RentalVehicleCardV167Component" src/pages/rental-catalog-v217.component.ts
          grep -Fq "CarDetailComponent" src/pages/catalog-detail-shells.component.ts
          grep -Fq "SaleCarDetailComponent" src/pages/catalog-detail-shells.component.ts
          if grep -Fq "getSaleCars()" src/pages/sale-catalog-v217.component.ts || grep -Fq "getCars()" src/pages/rental-catalog-v217.component.ts; then
            echo "V217 public listing owners must remain bounded"
            exit 1
          fi
      - name: Frontend TypeScript
        run: npm run lint
      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Accessibility guards
        run: |
          npm run a11y:buttons
          npm run a11y:dates
      - name: Production Angular build
        run: npm run build
