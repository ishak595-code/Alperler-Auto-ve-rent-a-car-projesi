name: V168.1 Sale Upload Form Patch
on:
  push:
    branches: [v1681-structured-tramer-truth]
    paths: [.github/workflows/v1681-sale-upload-form-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1681-structured-tramer-truth
      - name: Patch canonical sale upload and expertise inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f'pattern missing: {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          # Dedicated sale truth editor: add local-painted state.
          p=Path('src/pages/admin/admin-sale-integrity-v1681.component.ts'); s=p.read_text()
          s=s.replace("type PartStatus=''|'original'|'painted'|'changed';","type PartStatus=''|'original'|'local_painted'|'painted'|'changed';")
          s=s.replace('<option value="">Bilgi yok</option><option value="original">Orijinal</option><option value="painted">Boyalı</option><option value="changed">Değişen</option>', '<option value="">Bilgi yok</option><option value="original">Orijinal</option><option value="local_painted">Lokal Boyalı</option><option value="painted">Boyalı</option><option value="changed">Değişen</option>')
          s=s.replace("return s==='original'||s==='painted'||s==='changed'?s:'';", "return s==='original'||s==='local_painted'||s==='painted'||s==='changed'?s:'';")
          s=s.replace("if(value==='original'||value==='painted'||value==='changed')e[key]=value;", "if(value==='original'||value==='local_painted'||value==='painted'||value==='changed')e[key]=value;")
          s=s.replace("some(x=>x==='original'||x==='painted'||x==='changed')", "some(x=>x==='original'||x==='local_painted'||x==='painted'||x==='changed')")
          s=s.replace("some(x=>x==='painted'||x==='changed')", "some(x=>x==='local_painted'||x==='painted'||x==='changed')")
          p.write_text(s)

          # Public sale detail must treat local painted as real expertise data.
          p=Path('src/pages/sale-detail-v1681.component.ts'); s=p.read_text()
          s=s.replace("some(v=>v==='original'||v==='painted'||v==='changed')", "some(v=>v==='original'||v==='local_painted'||v==='painted'||v==='changed')")
          p.write_text(s)

          # Main vehicle upload form: replace legacy free-text sale block with structured truth fields.
          old='''                        } @else {\n                          <label class="field"><span>Hasar durumu</span><input [ngModel]="meta(car,'damageStatus')" (ngModelChange)="setMeta(car,'damageStatus',$event)" name="damageStatus" /></label>\n                          <label class="field"><span>Tramer</span><input [ngModel]="meta(car,'tramer')" (ngModelChange)="setMeta(car,'tramer',$event)" name="tramer" /></label>\n                          <label class="field"><span>Garanti</span><input [ngModel]="meta(car,'warranty')" (ngModelChange)="setMeta(car,'warranty',$event)" name="warranty" /></label>\n                        }'''
          new='''                        } @else {\n                          <label class="field md:col-span-2"><span>Hasar / boya özeti</span><input [ngModel]="meta(car,'damageStatus')" (ngModelChange)="setMeta(car,'damageStatus',$event)" name="damageStatus" placeholder="Örn. 1 lokal boyalı, değişen yok" /></label>\n                          <label class="field"><span>Tramer durumu</span><select [ngModel]="saleTramerStatus(car)" (ngModelChange)="setSaleTramerStatus(car,$event)" name="tramerStatus"><option value="UNKNOWN">Bilinmiyor / doğrulanmadı</option><option value="DECLARED_CLEAN">Beyan: kayıt yok</option><option value="DECLARED_RECORD">Beyan: kayıt var</option><option value="VERIFIED_CLEAN">Doğrulandı: kayıt yok</option><option value="VERIFIED_RECORD">Doğrulandı: kayıt var</option></select></label>\n                          <label class="field"><span>Toplam tramer tutarı TL</span><input type="number" min="0" [ngModel]="meta(car,'tramerAmount')" (ngModelChange)="setOptionalMetaNumber(car,'tramerAmount',$event)" name="tramerAmount" [disabled]="saleTramerStatus(car)==='UNKNOWN'||saleTramerStatus(car).endsWith('CLEAN')" /></label>\n                          <label class="field md:col-span-2"><span>Tramer / hasar açıklaması</span><input [ngModel]="meta(car,'tramer')" (ngModelChange)="setMeta(car,'tramer',$event)" name="tramer" placeholder="Kayıt varsa açıklayın; bilinmiyorsa açıkça belirtin" /></label>\n                          @if (isVerifiedSaleTramer(car)) {\n                            <label class="field"><span>Doğrulama kaynağı</span><input [ngModel]="meta(car,'tramerSourceName')" (ngModelChange)="setMeta(car,'tramerSourceName',$event)" name="tramerSourceName" /></label>\n                            <label class="field"><span>Kaynak HTTPS URL</span><input type="url" [ngModel]="meta(car,'tramerSourceUrl')" (ngModelChange)="setMeta(car,'tramerSourceUrl',$event)" name="tramerSourceUrl" placeholder="https://..." /></label>\n                            <label class="field"><span>Doğrulama zamanı</span><input type="datetime-local" [ngModel]="meta(car,'tramerVerifiedAt')" (ngModelChange)="setMeta(car,'tramerVerifiedAt',$event)" name="tramerVerifiedAt" /></label>\n                          }\n                          <label class="field"><span>Garanti</span><input [ngModel]="meta(car,'warranty')" (ngModelChange)="setMeta(car,'warranty',$event)" name="warranty" /></label>\n                          <label class="check md:col-span-2"><input type="checkbox" [ngModel]="meta(car,'isDamageFree')===true" (ngModelChange)="setMeta(car,'isDamageFree',$event)" name="isDamageFree" /> Hasarsız / hatasız beyanı</label>\n                          <div class="md:col-span-2 rounded-2xl border border-slate-200 bg-slate-50 p-3"><div class="mb-3"><strong class="block text-sm font-black text-slate-900">Parça Bazlı Ekspertiz</strong><span class="text-[11px] text-slate-500">Her parçayı Bilgi yok, Orijinal, Lokal Boyalı, Boyalı veya Değişen olarak seçin. Bilgi yok, orijinal sayılmaz.</span></div><div class="grid gap-2 sm:grid-cols-2 xl:grid-cols-3">@for (part of saleParts; track part.key) {<label class="field"><span>{{part.label}}</span><select [ngModel]="salePartStatus(car,part.key)" (ngModelChange)="setSalePart(car,part.key,$event)" [name]="'salePart_'+part.key"><option value="">Bilgi yok</option><option value="original">Orijinal</option><option value="local_painted">Lokal Boyalı</option><option value="painted">Boyalı</option><option value="changed">Değişen</option></select></label>}</div></div>\n                        }'''
          replace('src/pages/admin/admin-catalog-editor.component.ts',old,new)

          p=Path('src/pages/admin/admin-catalog-editor.component.ts'); s=p.read_text()
          marker='''  readonly uploading = signal(false);\n  readonly error = signal("");\n  search = "";'''
          repl='''  readonly uploading = signal(false);\n  readonly error = signal("");\n  readonly saleParts=[{key:'hood',label:'Kaput'},{key:'frontBumper',label:'Ön tampon'},{key:'rearBumper',label:'Arka tampon'},{key:'roof',label:'Tavan'},{key:'trunk',label:'Bagaj kapağı'},{key:'frontLeftDoor',label:'Sol ön kapı'},{key:'frontRightDoor',label:'Sağ ön kapı'},{key:'rearLeftDoor',label:'Sol arka kapı'},{key:'rearRightDoor',label:'Sağ arka kapı'},{key:'frontLeftFender',label:'Sol ön çamurluk'},{key:'frontRightFender',label:'Sağ ön çamurluk'},{key:'rearLeftFender',label:'Sol arka çamurluk'},{key:'rearRightFender',label:'Sağ arka çamurluk'}] as const;\n  search = "";'''
          if marker not in s: raise SystemExit('catalog property marker missing')
          s=s.replace(marker,repl,1)
          old_create='''  async createVehicle(category:"RENTAL"|"SALE"):Promise<void>{this.saving.set(true);try{const item=await this.editor.createVehicle(category);this.vehicles.update((rows)=>[item,...rows]);this.filter.set(category);await this.selectVehicle(item);this.toast.show(`${category==='RENTAL'?'Kiralık':'Satılık'} gerçek araç kaydı oluşturuldu.`,"success");}catch(error){this.toast.show(this.message(error),"error");}finally{this.saving.set(false);}}'''
          new_create='''  async createVehicle(category:"RENTAL"|"SALE"):Promise<void>{this.saving.set(true);try{const item=await this.editor.createVehicle(category);if(category==='SALE'){item.metadata={...(item.metadata||{}),tramerStatus:'UNKNOWN',tramerCurrency:'TRY',damageExpertise:{},isDamageFree:false};}this.vehicles.update((rows)=>[item,...rows]);this.filter.set(category);await this.selectVehicle(item);this.toast.show(`${category==='RENTAL'?'Kiralık':'Satılık'} gerçek araç kaydı oluşturuldu.`,"success");}catch(error){this.toast.show(this.message(error),"error");}finally{this.saving.set(false);}}'''
          if old_create not in s: raise SystemExit('createVehicle marker missing')
          s=s.replace(old_create,new_create,1)
          old_save='''if(car.category==="RENTAL"&&this.meta(car,"hourlyRentalEnabled")===true){const hourly=Number(this.meta(car,"hourlyPrice")||0),minimum=Number(this.meta(car,"minimumRentalHours")||1);if(hourly<=0){this.toast.show("Saatlik kiralama açıksa saatlik fiyat sıfırdan büyük olmalı.","error");return;}if(!Number.isInteger(minimum)||minimum<1||minimum>23){this.toast.show("Minimum saat 1 ile 23 arasında olmalı.","error");return;}}car.recordOrigin="REAL";'''
          new_save='''if(car.category==="RENTAL"&&this.meta(car,"hourlyRentalEnabled")===true){const hourly=Number(this.meta(car,"hourlyPrice")||0),minimum=Number(this.meta(car,"minimumRentalHours")||1);if(hourly<=0){this.toast.show("Saatlik kiralama açıksa saatlik fiyat sıfırdan büyük olmalı.","error");return;}if(!Number.isInteger(minimum)||minimum<1||minimum>23){this.toast.show("Minimum saat 1 ile 23 arasında olmalı.","error");return;}}if(car.category==='SALE'){const saleError=this.saleTruthError(car);if(saleError){this.toast.show(saleError,'error');return;}}car.recordOrigin="REAL";'''
          if old_save not in s: raise SystemExit('saveVehicle marker missing')
          s=s.replace(old_save,new_save,1)
          helper_marker='''metaArray(record:{metadata:Record<string,unknown>},key:string):string[]{const value=record.metadata?.[key];return Array.isArray(value)?value.map(String):[];}setMeta(record:{metadata:Record<string,unknown>},key:string,value:unknown):void{record.metadata={...(record.metadata||{}),[key]:value};}setMetaNumber(record:{metadata:Record<string,unknown>},key:string,value:unknown):void{const parsed=Number(value);this.setMeta(record,key,Number.isFinite(parsed)?parsed:null);}splitLines'''
          helpers='''metaArray(record:{metadata:Record<string,unknown>},key:string):string[]{const value=record.metadata?.[key];return Array.isArray(value)?value.map(String):[];}setMeta(record:{metadata:Record<string,unknown>},key:string,value:unknown):void{record.metadata={...(record.metadata||{}),[key]:value};}setMetaNumber(record:{metadata:Record<string,unknown>},key:string,value:unknown):void{const parsed=Number(value);this.setMeta(record,key,Number.isFinite(parsed)?parsed:null);}setOptionalMetaNumber(record:{metadata:Record<string,unknown>},key:string,value:unknown):void{if(value===''||value==null){const m={...(record.metadata||{})};delete m[key];record.metadata=m;return;}const parsed=Number(value);if(Number.isFinite(parsed))this.setMeta(record,key,Math.max(0,parsed));}saleTramerStatus(record:{metadata:Record<string,unknown>}):string{const s=String(this.meta(record,'tramerStatus')||'UNKNOWN').toUpperCase();return ['DECLARED_CLEAN','DECLARED_RECORD','VERIFIED_CLEAN','VERIFIED_RECORD'].includes(s)?s:'UNKNOWN';}isVerifiedSaleTramer(record:{metadata:Record<string,unknown>}):boolean{return this.saleTramerStatus(record).startsWith('VERIFIED_');}setSaleTramerStatus(record:{metadata:Record<string,unknown>},value:string):void{const s=['UNKNOWN','DECLARED_CLEAN','DECLARED_RECORD','VERIFIED_CLEAN','VERIFIED_RECORD'].includes(value)?value:'UNKNOWN';this.setMeta(record,'tramerStatus',s);this.setMeta(record,'tramerCurrency','TRY');if(s==='UNKNOWN'){this.setMeta(record,'tramer','Belirtilmedi / doğrulanmadı');this.setOptionalMetaNumber(record,'tramerAmount','');}if(s==='DECLARED_CLEAN'){this.setMeta(record,'tramer','Beyan: tramer kaydı yok');this.setMeta(record,'tramerAmount',0);}if(s==='VERIFIED_CLEAN'){this.setMeta(record,'tramer','Doğrulandı: tramer kaydı yok');this.setMeta(record,'tramerAmount',0);}if(!s.startsWith('VERIFIED_')){const m={...(record.metadata||{})};delete m['tramerSourceName'];delete m['tramerSourceUrl'];delete m['tramerVerifiedAt'];record.metadata=m;}}salePartStatus(record:{metadata:Record<string,unknown>},key:string):string{const raw=this.meta(record,'damageExpertise');const v=raw&&typeof raw==='object'&&!Array.isArray(raw)?String((raw as Record<string,unknown>)[key]||''):'';return ['original','local_painted','painted','changed'].includes(v)?v:'';}setSalePart(record:{metadata:Record<string,unknown>},key:string,value:string):void{const raw=this.meta(record,'damageExpertise');const map=raw&&typeof raw==='object'&&!Array.isArray(raw)?{...(raw as Record<string,unknown>)}:{};if(['original','local_painted','painted','changed'].includes(value))map[key]=value;else delete map[key];this.setMeta(record,'damageExpertise',map);}saleTruthError(record:{metadata:Record<string,unknown>,publicationStatus:string}):string{const status=this.saleTramerStatus(record);const publishing=record.publicationStatus==='PUBLISHED'||record.publicationStatus==='SCHEDULED';if(publishing&&status==='UNKNOWN')return 'Canlı satılık ilanda tramer durumu için en az beyan seçilmelidir.';if(status.endsWith('RECORD')&&Number(this.meta(record,'tramerAmount')||0)<=0)return 'Tramer kaydı varsa toplam tramer tutarını TL olarak girin.';if(status.endsWith('RECORD')&&!String(this.meta(record,'tramer')||'').trim())return 'Tramer kaydı açıklaması eksik.';if(this.isVerifiedSaleTramer(record)){if(!String(this.meta(record,'tramerSourceName')||'').trim())return 'Doğrulanmış tramer için kaynak adı zorunlu.';try{if(new URL(String(this.meta(record,'tramerSourceUrl')||'')).protocol!=='https:')return 'Tramer doğrulama bağlantısı HTTPS olmalı.';}catch{return 'Tramer doğrulama bağlantısı geçersiz.';}if(!String(this.meta(record,'tramerVerifiedAt')||'').trim())return 'Tramer doğrulama zamanı zorunlu.';}const raw=this.meta(record,'damageExpertise');const vals=raw&&typeof raw==='object'&&!Array.isArray(raw)?Object.values(raw as Record<string,unknown>).map(String):[];if(this.meta(record,'isDamageFree')===true&&vals.some(v=>v==='local_painted'||v==='painted'||v==='changed'))return 'Hasarsız beyanı ile lokal boyalı, boyalı veya değişen parça aynı anda seçilemez.';return '';}splitLines'''
          if helper_marker not in s: raise SystemExit('helper marker missing')
          s=s.replace(helper_marker,helpers,1)
          p.write_text(s)

          # Admin service: new SALE drafts start truthful, and publication preflight mirrors DB rules.
          p=Path('src/services/catalog-admin-editor.service.ts'); s=p.read_text()
          s=s.replace('''      metadata: {\n        title: category === "RENTAL" ? "Yeni Kiralık Araç" : "Yeni Satılık Araç",\n        createdFrom: "ADMIN_V52",\n      },''','''      metadata: {\n        title: category === "RENTAL" ? "Yeni Kiralık Araç" : "Yeni Satılık Araç",\n        createdFrom: "ADMIN_V1681",\n        ...(category === "SALE" ? { tramerStatus: "UNKNOWN", tramerCurrency: "TRY", damageExpertise: {}, isDamageFree: false } : {}),\n      },''')
          needle='''    if (record.dataQualityStatus !== "BUSINESS_VERIFIED") {\n      if (!(record.specSourceName || "").trim()) errors.push("Teknik kaynak adı eksik.");\n      if (!this.isHttps(record.specSourceUrl)) errors.push("Teknik kaynak URL adresi geçerli HTTPS olmalı.");\n    }'''
          inject=needle+'''\n    if (record.category === "SALE") {\n      const status=String(record.metadata?.["tramerStatus"]||"UNKNOWN").toUpperCase();\n      if (status === "UNKNOWN") errors.push("Canlı satılık ilanda tramer için en az beyan seçilmeli.");\n      if ((status === "DECLARED_RECORD" || status === "VERIFIED_RECORD") && Number(record.metadata?.["tramerAmount"]||0) <= 0) errors.push("Tramer kaydı varsa toplam tutar TL olarak girilmeli.");\n      if ((status === "DECLARED_RECORD" || status === "VERIFIED_RECORD") && !String(record.metadata?.["tramer"]||"").trim()) errors.push("Tramer kayıt açıklaması eksik.");\n      if (status.startsWith("VERIFIED_")) {\n        if (!String(record.metadata?.["tramerSourceName"]||"").trim()) errors.push("Tramer doğrulama kaynak adı eksik.");\n        if (!this.isHttps(String(record.metadata?.["tramerSourceUrl"]||""))) errors.push("Tramer doğrulama URL adresi geçerli HTTPS olmalı.");\n        if (!String(record.metadata?.["tramerVerifiedAt"]||"").trim()) errors.push("Tramer doğrulama zamanı eksik.");\n      }\n      const expertise=record.metadata?.["damageExpertise"];const values=expertise&&typeof expertise==="object"&&!Array.isArray(expertise)?Object.values(expertise as Record<string,unknown>).map(String):[];\n      if(record.metadata?.["isDamageFree"]===true&&values.some(v=>v==="local_painted"||v==="painted"||v==="changed"))errors.push("Hasarsız beyanı ile lokal boyalı, boyalı veya değişen parça çelişiyor.");\n    }'''
          if needle not in s: raise SystemExit('admin service preflight marker missing')
          s=s.replace(needle,inject,1)
          p.write_text(s)
          PY
      - name: Remove bootstrap workflow and commit
        shell: bash
        run: |
          rm .github/workflows/v1681-sale-upload-form-patch.yml
          git config user.name "alperler-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "V168.1: integrate tramer and expertise into sale upload"
          git push origin HEAD:v1681-structured-tramer-truth
