name: V169 Tour Integrity Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - ".github/workflows/v169-tour-showcase-integrity.yml"
      - ".github/workflows/v170-tour-studio-flexible-demand.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Preserve V169 historical database contract
        shell: bash
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260825191000_v169_tour_capacity_publication_integrity.sql
          test -f "$MIG"
          for token in tour_availability_v169 tour_approved_people_v169 bookings_tour_approved_day_v169_idx TOUR_CAPACITY_EXCEEDED pendingBlocksCapacity DURATION_REQUIRED CAPACITY_REQUIRED MEETING_POINT_REQUIRED ITINERARY_REQUIRED INCLUDED_ITEMS_REQUIRED EXCLUDED_ITEMS_REQUIRED; do grep -Fq "$token" "$MIG"; done
      - name: Bounded tour catalog and canonical detail ownership
        shell: bash
        run: |
          set -euo pipefail
          SHOW=src/pages/tour-catalog-v217.component.ts
          DETAIL=src/pages/tour-detail.component.ts
          test -f "$SHOW" && test -f "$DETAIL"
          grep -Fq "TourCatalogV217Component" src/pages/tours.component.ts
          grep -Fq "TourDetailComponent" src/pages/catalog-detail-shells.component.ts
          grep -Fq "tourFacets()" "$SHOW"
          grep -Fq "facets().priceMin" "$SHOW"
          grep -Fq "facets().priceMax" "$SHOW"
          grep -Fq "tour.capacity" "$SHOW"
          grep -Fq "tour.categoryName" "$SHOW"
          grep -Fq "tour.images?.length" "$SHOW"
          grep -Fq "CustomerFavoritesV217Service" "$SHOW"
          grep -Fq "hydrateVisible('TOUR'" "$SHOW"
          grep -Fq "pageSize:24" "$SHOW"
          grep -Fq "readonly reservationOpen = signal(false)" "$DETAIL"
          grep -Fq "Bu Turu Rezerve Et" "$DETAIL"
          grep -Fq "action-bar" "$DETAIL"
          grep -Fq "mapHref" "$DETAIL"
          grep -Fq "DetailMediaLightboxComponent" "$DETAIL"
          if grep -Eq "0-5000|5000-15000|15000\+|priceRanges[[:space:]]*=" "$SHOW"; then
            echo "Tour filters must remain live-data derived"
            exit 1
          fi
          if grep -Fq "getTours()" "$SHOW" || grep -Fq "loadToursDirect()" "$SHOW"; then
            echo "Tour listing must not restore full-catalog hydration"
            exit 1
          fi
          test ! -f src/pages/tour-detail-v169.component.ts
          test ! -f src/pages/tour-detail-v170.component.ts
      - name: V170 flexible demand technology is integrated into canonical detail
        shell: bash
        run: |
          set -euo pipefail
          DETAIL=src/pages/tour-detail.component.ts
          grep -Fq "TourDemandV170Service" "$DETAIL"
          grep -Fq "TourBookingV170Service" "$DETAIL"
          grep -Fq "startDate: this.tourDate" "$DETAIL"
          grep -Fq "personCount" "$DETAIL"
          grep -Fq "1_000_000_000" "$DETAIL"
          if grep -Fq "remainingSeats" "$DETAIL"; then
            echo "Canonical tour detail must not restore hard remaining-seat gating"
            exit 1
          fi
      - name: Compatibility Edge slug remains protected
        shell: bash
        run: |
          set -euo pipefail
          test -f api/bookings.ts
          test -f supabase/functions/tour-availability-v169/index.ts
          grep -Fq 'mode === "tour-availability"' api/bookings.ts
          grep -Fq "/api/bookings?mode=tour-availability" src/services/tour-demand-v170.service.ts
          grep -Fq "consume_rate_limit" supabase/functions/tour-availability-v169/index.ts
          grep -Fq "tour_demand_v170" supabase/functions/tour-availability-v169/index.ts
      - name: Current Super Admin tour workspace
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/admin/admin-catalog-workspace.component.ts
          HUB=src/pages/admin/admin-content-hub.component.ts
          for token in "Tur Programı" tour.itinerary tour.includedItems tour.excludedItems tour.capacity tour.meetingPoint "Fotoğraf & Video"; do grep -Fq "$token" "$FILE"; done
          grep -Fq 'mode="TOUR"' "$HUB"
          test ! -f src/pages/admin/admin-tour-studio-v170.component.ts
      - name: Preserve rental and sale integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "RentalCatalogV217Component" src/pages/fleet.component.ts
          grep -Fq "SaleCatalogV217Component" src/pages/sales-results.component.ts
          grep -Fq "CarDetailComponent" src/pages/catalog-detail-shells.component.ts
          grep -Fq "SaleCarDetailComponent" src/pages/catalog-detail-shells.component.ts
          test -f supabase/migrations/20260825183500_v1681_structured_tramer_truth.sql
          test -f supabase/migrations/20260825170000_v167_rental_campaign_integrity.sql
      - name: Frontend TypeScript
        run: npm run lint
      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Accessibility and Vercel function budget guards
        run: |
          npm run a11y:buttons
          npm run a11y:dates
          npm run vercel:functions
      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Current tour Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/tour-availability-v169/index.ts
          deno check --node-modules-dir=auto supabase/functions/tour-booking-v170/index.ts
      - name: Preserve booking gateway contract
        run: deno check --node-modules-dir=auto supabase/functions/booking-gateway-v166/index.ts
      - name: Production Angular build
        run: npm run build
