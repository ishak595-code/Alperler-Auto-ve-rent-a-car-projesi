name: V170 Tour Studio and Flexible Demand

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "docs/**"
      - ".github/workflows/v170-tour-studio-flexible-demand.yml"
      - ".github/workflows/v169-tour-showcase-integrity.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v170-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Flexible demand database contract
        shell: bash
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260825193000_v170_tour_flexible_demand_security.sql
          test -f "$MIG"
          for token in FLEXIBLE_DEMAND RECOMMENDED_GROUP_SIZE tour_demand_v170 tourCapacityPolicy; do grep -Fq "$token" "$MIG"; done
          grep -Fq "grant execute on function public.tour_demand_v170(text,date) to service_role" "$MIG"
          if grep -Fq "TOUR_CAPACITY_EXCEEDED" "$MIG"; then echo "V170 admin approval must not hard-stop tour demand by capacity"; exit 1; fi
      - name: Canonical dated reservation and flexible demand
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/tour-detail.component.ts
          test -f "$FILE"
          grep -Fq "app-accessible-native-date" "$FILE"
          grep -Fq "startDate: this.tourDate" "$FILE"
          grep -Fq "formattedTourDate" "$FILE"
          grep -Fq "TourDemandV170Service" "$FILE"
          grep -Fq "TourBookingV170Service" "$FILE"
          grep -Fq "1_000_000_000" "$FILE"
          grep -Fq "readonly reservationOpen = signal(false)" "$FILE"
          grep -Fq '@if (reservationOpen())' "$FILE"
          grep -Fq 'class="reservation-overlay"' "$FILE"
          grep -Fq "Bu Turu Rezerve Et" "$FILE"
          grep -Fq "action-bar" "$FILE"
          grep -Fq "mediaItems" "$FILE"
          grep -Fq "<video" "$FILE"
          grep -Fq "item.includedItems" "$FILE"
          grep -Fq "item.excludedItems" "$FILE"
          grep -Fq "item.highlights" "$FILE"
          grep -Fq "DetailMediaLightboxComponent" "$FILE"
          if grep -Fq "remainingSeats" "$FILE"; then echo "Canonical tour detail must not use remaining seats as a hard gate"; exit 1; fi
          test ! -f src/pages/tour-detail-v169.component.ts
          test ! -f src/pages/tour-detail-v170.component.ts
      - name: Large group booking technology is capacity independent
        shell: bash
        run: |
          set -euo pipefail
          EDGE=supabase/functions/tour-booking-v170/index.ts
          DETAIL=src/pages/tour-detail.component.ts
          grep -Fq "1_000_000_000" "$EDGE"
          grep -Fq "1_000_000_000" "$DETAIL"
          grep -Fq 'capacity_policy: "FLEXIBLE_DEMAND"' "$EDGE"
          if grep -Eq "persons[[:space:]]*>[[:space:]]*Number\(tour\.capacity|personCount\(\)[[:space:]]*>[[:space:]].*capacity" "$EDGE" "$DETAIL"; then echo "Tour person count must not be compared with recommended capacity"; exit 1; fi
      - name: Canonical bounded tour showcase
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/tour-catalog-v217.component.ts
          DATA=src/services/scalable-public-catalog-v217.service.ts
          test -f "$FILE" && test -f "$DATA"
          for token in ScalablePublicCatalogV217Service "tourFacets()" "facets().priceMin" "facets().priceMax" "tour.badge" "tour.capacity" "tour.categoryName" "tour.images?.length" "pageSize:24"; do grep -Fq "$token" "$FILE"; done
          for token in "listTours(" "tourFacets(" "public_tour_catalog_v217"; do grep -Fq "$token" "$DATA"; done
          grep -Fq "catalog_media" src/services/public-catalog-media.service.ts
          grep -Fq "TourCatalogV217Component" src/pages/tours.component.ts
          if grep -Eq "0-5000|5000-15000|15000\+|priceRanges[[:space:]]*=" "$FILE"; then echo "Tour price filters must remain data-derived"; exit 1; fi
          if grep -Fq "getTours()" "$FILE" || grep -Fq "TourPublicDataV170Service" "$FILE"; then echo "Active tour listing must not restore full-catalog hydration"; exit 1; fi
      - name: Super Admin owned Tour workspace contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/admin/admin-catalog-workspace.component.ts
          HUB=src/pages/admin/admin-content-hub.component.ts
          for token in CatalogMediaService "Fotoğraf & Video" tour.shortDescription tour.pricePerPerson tour.duration tour.capacity tour.locationName tour.meetingPoint tour.includedItems tour.excludedItems tour.itinerary; do grep -Fq "$token" "$FILE"; done
          grep -Fq 'mode="TOUR"' "$HUB"
          test ! -f src/pages/admin/admin-tour-studio-v170.component.ts
      - name: Service-only demand RPC and Edge boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f src/services/tour-demand-v170.service.ts
          test -f src/services/tour-booking-v170.service.ts
          test -f supabase/functions/tour-availability-v169/index.ts
          test -f supabase/functions/tour-booking-v170/index.ts
          grep -Fq "/api/bookings?mode=tour-availability" src/services/tour-demand-v170.service.ts
          grep -Fq "tour_demand_v170" supabase/functions/tour-availability-v169/index.ts
          grep -Fq "ALLOWED_ORIGINS" supabase/functions/tour-booking-v170/index.ts
          grep -Fq "consume_rate_limit" supabase/functions/tour-booking-v170/index.ts
          grep -Fq "reserve_booking_commercial_offer" supabase/functions/tour-booking-v170/index.ts
      - name: Architecture documentation
        run: |
          test -f docs/PRODUCTION_ARCHITECTURE_V170.md
          grep -Fq "Every tour booking has a required customer-selected calendar date" docs/PRODUCTION_ARCHITECTURE_V170.md
          grep -Fq "capacity" docs/PRODUCTION_ARCHITECTURE_V170.md
          grep -Fq "catalog_media" docs/PRODUCTION_ARCHITECTURE_V170.md
      - name: Frontend TypeScript
        run: npm run lint
      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Accessibility and Vercel function budget
        run: |
          npm run a11y:buttons
          npm run a11y:dates
          npm run vercel:functions
      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: V170 Edge Function checks
        run: |
          deno check --node-modules-dir=auto supabase/functions/tour-availability-v169/index.ts
          deno check --node-modules-dir=auto supabase/functions/tour-booking-v170/index.ts
          deno check --node-modules-dir=auto supabase/functions/booking-gateway-v166/index.ts
      - name: Production Angular build
        run: npm run build
