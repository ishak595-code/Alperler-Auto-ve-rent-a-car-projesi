name: V170 Tour Studio and Flexible Demand

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "supabase/**"
      - "docs/**"
      - ".github/workflows/v170-tour-studio-flexible-demand.yml"
      - ".github/workflows/v169-tour-showcase-integrity.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v170-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Flexible demand database contract
        shell: bash
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260825193000_v170_tour_flexible_demand_security.sql
          test -f "$MIG"
          grep -Fq "FLEXIBLE_DEMAND" "$MIG"
          grep -Fq "RECOMMENDED_GROUP_SIZE" "$MIG"
          grep -Fq "tour_demand_v170" "$MIG"
          grep -Fq "revoke all on function public.tour_demand_v170(text,date) from public,anon,authenticated" "$MIG"
          grep -Fq "revoke all on function public.tour_availability_v169(text,date) from public,anon,authenticated" "$MIG"
          grep -Fq "grant execute on function public.tour_demand_v170(text,date) to service_role" "$MIG"
          grep -Fq "tourCapacityPolicy" "$MIG"
          if grep -Fq "TOUR_CAPACITY_EXCEEDED" "$MIG"; then
            echo "V170 admin approval must not hard-stop tour demand by capacity"
            exit 1
          fi

      - name: Dated reservation remains mandatory
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/tour-detail-v170.component.ts
          test -f "$FILE"
          grep -Fq "app-accessible-native-date" "$FILE"
          grep -Fq "startDate:this.tourDate" "$FILE"
          grep -Fq "formattedDate" "$FILE"
          grep -Fq "Müşterinin geleceği tarih" "$FILE"
          if grep -Fq "remainingSeats" "$FILE"; then
            echo "V170 customer booking must not use remaining seats as a hard gate"
            exit 1
          fi

      - name: Large group booking is capacity independent
        shell: bash
        run: |
          set -euo pipefail
          EDGE=supabase/functions/tour-booking-v170/index.ts
          CLIENT=src/pages/tour-detail-v170.component.ts
          test -f "$EDGE"
          grep -Fq "1_000_000_000" "$EDGE"
          grep -Fq "1_000_000_000" "$CLIENT"
          grep -Fq 'capacity_policy: "FLEXIBLE_DEMAND"' "$EDGE"
          if grep -Eq "persons[[:space:]]*>[[:space:]]*Number\(tour\.capacity|personCount\(\)[[:space:]]*>[[:space:]].*capacity" "$EDGE" "$CLIENT"; then
            echo "Tour person count must not be compared with recommended capacity"
            exit 1
          fi

      - name: Canonical dynamic tour showcase
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/tour-showcase-v170.component.ts
          DATA=src/services/tour-public-data-v170.service.ts
          test -f "$FILE" && test -f "$DATA"
          grep -Fq "TourPublicDataV170Service" "$FILE"
          grep -Fq "bounds" "$FILE"
          grep -Fq "durations" "$FILE"
          grep -Fq "categories" "$FILE"
          grep -Fq "locations" "$FILE"
          grep -Fq "tour.badge" "$FILE"
          grep -Fq "tour.videos" "$FILE"
          grep -Fq "tour.capacity" "$FILE"
          grep -Fq "catalog_media" src/services/public-catalog-media.service.ts
          grep -Fq "TourShowcaseV170Component" src/pages/tours.component.ts
          if grep -Eq "0-5000|5000-15000|15000\+|priceRanges[[:space:]]*=" "$FILE"; then
            echo "Tour price filters must remain data-derived"
            exit 1
          fi

      - name: Dynamic photo and video detail
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/tour-detail-v170.component.ts
          grep -Fq "mediaItems" "$FILE"
          grep -Fq "<video" "$FILE"
          grep -Fq "poster" "$FILE"
          grep -Fq "item.includedItems" "$FILE"
          grep -Fq "item.excludedItems" "$FILE"
          grep -Fq "item.highlights" "$FILE"
          grep -Fq "TourDetailV170Component" src/pages/catalog-detail-shells.component.ts

      - name: Super Admin Tour Studio contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/pages/admin/admin-tour-studio-v170.component.ts
          test -f "$FILE"
          grep -Fq "CatalogMediaService" "$FILE"
          grep -Fq "Fotoğraf & Video" "$FILE"
          grep -Fq "tour.shortDescription" "$FILE"
          grep -Fq "tour.pricePerPerson" "$FILE"
          grep -Fq "tour.duration" "$FILE"
          grep -Fq "tour.capacity" "$FILE"
          grep -Fq "tour.locationName" "$FILE"
          grep -Fq "tour.meetingPoint" "$FILE"
          grep -Fq "tour.includedItems" "$FILE"
          grep -Fq "tour.excludedItems" "$FILE"
          grep -Fq "tour.itinerary" "$FILE"
          grep -Fq "isCover:true" "$FILE"
          grep -Fq "app-admin-tour-studio-v170" src/pages/admin/admin-content-hub.component.ts

      - name: Sale selected cover remains canonical
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/components/sale-vehicle-card-v168.component.ts
          grep -Fq "this.car.image||this.car.images?.[0]" "$FILE"
          grep -Fq "tramerLabel" "$FILE"
          grep -Fq "damageLabel" "$FILE"
          grep -Fq "warrantyLabel" "$FILE"

      - name: Service-only demand RPC and Edge boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f src/services/tour-demand-v170.service.ts
          test -f src/services/tour-booking-v170.service.ts
          test -f supabase/functions/tour-availability-v169/index.ts
          test -f supabase/functions/tour-booking-v170/index.ts
          grep -Fq "/api/bookings?mode=tour-availability" src/services/tour-demand-v170.service.ts
          grep -Fq "tour_demand_v170" supabase/functions/tour-availability-v169/index.ts
          grep -Fq "ALLOWED_ORIGINS" supabase/functions/tour-booking-v170/index.ts
          grep -Fq "consume_rate_limit" supabase/functions/tour-booking-v170/index.ts
          grep -Fq "reserve_booking_commercial_offer" supabase/functions/tour-booking-v170/index.ts

      - name: Architecture documentation
        run: |
          test -f docs/PRODUCTION_ARCHITECTURE_V170.md
          grep -Fq "Every tour booking has a required customer-selected calendar date" docs/PRODUCTION_ARCHITECTURE_V170.md
          grep -Fq "capacity" docs/PRODUCTION_ARCHITECTURE_V170.md
          grep -Fq "catalog_media" docs/PRODUCTION_ARCHITECTURE_V170.md

      - name: Frontend TypeScript
        run: npm run lint

      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Accessibility and Vercel function budget
        run: |
          npm run a11y:buttons
          npm run a11y:dates
          npm run vercel:functions

      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: V170 Edge Function checks
        run: |
          deno check --node-modules-dir=auto supabase/functions/tour-availability-v169/index.ts
          deno check --node-modules-dir=auto supabase/functions/tour-booking-v170/index.ts
          deno check --node-modules-dir=auto supabase/functions/booking-gateway-v166/index.ts

      - name: Production Angular build
        run: npm run build
