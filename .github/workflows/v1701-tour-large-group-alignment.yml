name: V170.1 Tour Large Group Alignment

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - ".github/workflows/v1701-tour-large-group-alignment.yml"
      - ".github/workflows/v170-tour-studio-flexible-demand.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1701-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Tour person-count database contract
        shell: bash
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260825195500_v1701_tour_person_count_alignment.sql
          test -f "$MIG"
          grep -Fq "booking_type = 'TOUR'" "$MIG"
          grep -Fq "person_count between 1 and 1000000000" "$MIG"
          grep -Fq "booking_type <> 'TOUR'" "$MIG"
          grep -Fq "person_count between 1 and 100" "$MIG"

      - name: Edge email and money integrity
        shell: bash
        run: |
          set -euo pipefail
          EDGE=supabase/functions/tour-booking-v170/index.ts
          grep -Fq "MAX_TOUR_PERSON_COUNT = 1_000_000_000" "$EDGE"
          grep -Fq "MAX_BOOKING_MONEY = 999_999_999_999.99" "$EDGE"
          grep -Fq 'if (!customerEmail) throw new Error("INVALID_EMAIL")' "$EDGE"
          grep -Fq "maxBillablePeople" "$EDGE"
          grep -Fq "capacity_policy: \"FLEXIBLE_DEMAND\"" "$EDGE"
          if grep -Fq "TOUR_CAPACITY_EXCEEDED" "$EDGE"; then
            echo "Hard tour capacity must not return"
            exit 1
          fi

      - name: Preserve canonical dated demand architecture
        shell: bash
        run: |
          set -euo pipefail
          SHELL=src/pages/catalog-detail-shells.component.ts
          DETAIL=src/pages/tour-detail.component.ts
          ADMIN=src/pages/admin/admin-catalog-workspace.component.ts
          HUB=src/pages/admin/admin-content-hub.component.ts
          test -f "$SHELL" && test -f "$DETAIL" && test -f "$ADMIN" && test -f "$HUB"
          grep -Fq "TourDetailComponent" "$SHELL"
          if grep -Fq "TourDetailV170Component" "$SHELL" || grep -Fq "TourDetailV169Component" "$SHELL"; then
            echo "Legacy tour detail renderer must not return to the public shell"
            exit 1
          fi
          grep -Fq "TourBookingV170Service" "$DETAIL"
          grep -Fq "TourDemandV170Service" "$DETAIL"
          grep -Fq "startDate: this.tourDate" "$DETAIL"
          grep -Fq "1_000_000_000" "$DETAIL"
          grep -Fq "onDateChange" "$DETAIL"
          grep -Fq "capacity" "$DETAIL"
          grep -Fq "reservationOpen" "$DETAIL"
          grep -Fq "action-bar" "$DETAIL"
          grep -Fq "tour.itinerary" "$ADMIN"
          grep -Fq "tour.capacity" "$ADMIN"
          grep -Fq "tour.meetingPoint" "$ADMIN"
          grep -Fq 'mode="TOUR"' "$HUB"
          if grep -Fq "AdminTourStudioV170Component" "$HUB" || grep -Fq "app-admin-tour-studio-v170" "$HUB"; then
            echo "Legacy parallel tour studio must not return to the active admin hub"
            exit 1
          fi
          grep -Fq "tour_demand_v170" supabase/migrations/20260825193000_v170_tour_flexible_demand_security.sql

      - name: Frontend TypeScript
        run: npm run lint

      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Accessibility and Vercel function budget
        run: |
          npm run a11y:buttons
          npm run a11y:dates
          npm run vercel:functions

      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: V170.1 tour booking Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/tour-booking-v170/index.ts

      - name: Production Angular build
        run: npm run build
