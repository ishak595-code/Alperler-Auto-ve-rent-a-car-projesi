name: V177 Branch Lifecycle Registry Security

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260826025000_v177_branch_lifecycle_registry_security.sql"
      - "supabase/functions/branch-operations-gateway-v177/**"
      - "src/services/admin-branch-operations-v171.service.ts"
      - "src/services/branch-network-admin.service.ts"
      - "api/partner.ts"
      - ".github/workflows/v177-branch-lifecycle-registry-security.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v177-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Service-only lifecycle and registry boundary
        shell: bash
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260826025000_v177_branch_lifecycle_registry_security.sql
          for fn in service_set_branch_lifecycle_v177 service_search_vehicle_registry_v177 service_upsert_vehicle_registry_v177; do
            grep -Fq "create or replace function public.${fn}" "$MIG"
            grep -Fq "revoke all on function public.${fn}" "$MIG"
            grep -Fq "grant execute on function public.${fn}" "$MIG"
          done
          grep -Fq "private.can_actor_manage_content_v174" "$MIG"
          grep -Fq "private.can_actor_manage_operations" "$MIG"
          grep -Fq "BRANCH_LIFECYCLE_ADMIN_REQUIRED" "$MIG"
          grep -Fq "VEHICLE_REGISTRY_UPDATE_V177" "$MIG"

      - name: Browser privileged RPC isolation
        shell: bash
        run: |
          set -euo pipefail
          OPS=src/services/admin-branch-operations-v171.service.ts
          NET=src/services/branch-network-admin.service.ts
          grep -Fq '/api/partner?op=branch-operations-admin' "$OPS"
          grep -Fq '/api/partner?op=branch-network-admin' "$NET"
          if grep -E 'SUPABASE_PROJECT_URL|SUPABASE_PUBLISHABLE_KEY|/rest/v1/rpc/admin_(set_branch_lifecycle_v1718|search_vehicle_registry_v1718|upsert_vehicle_registry_v1718)|/functions/v1/branch-network-admin' "$OPS" "$NET"; then
            echo "Legacy direct Supabase branch admin path detected"
            exit 1
          fi

      - name: Same-origin proxy contract
        shell: bash
        run: |
          set -euo pipefail
          API=api/partner.ts
          grep -Fq 'operation === "branch-network-admin"' "$API"
          grep -Fq 'edgeFunction: "branch-network-admin"' "$API"
          grep -Fq 'operation === "branch-operations-admin"' "$API"
          grep -Fq 'edgeFunction: "branch-operations-gateway-v177"' "$API"
          grep -Fq 'requireAuth: true' "$API"

      - name: Narrow Edge authorization contract
        shell: bash
        run: |
          set -euo pipefail
          EDGE=supabase/functions/branch-operations-gateway-v177/index.ts
          grep -Fq 'SET_LIFECYCLE' "$EDGE"
          grep -Fq 'SEARCH_VEHICLE_REGISTRY' "$EDGE"
          grep -Fq 'SAVE_VEHICLE_IDENTIFIERS' "$EDGE"
          grep -Fq 'canLifecycle' "$EDGE"
          grep -Fq 'canRegistry' "$EDGE"
          grep -Fq 'service_set_branch_lifecycle_v177' "$EDGE"
          grep -Fq 'service_search_vehicle_registry_v177' "$EDGE"
          grep -Fq 'service_upsert_vehicle_registry_v177' "$EDGE"

      - name: Frontend TypeScript and lint
        run: npm run lint
      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Accessibility guards
        run: |
          npm run a11y:buttons
          npm run a11y:dates
      - name: Vercel function budget
        run: npm run vercel:functions
      - name: Premium design contract
        run: npm run design:premium
      - name: Edge Function TypeScript
        run: npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/branch-operations-gateway-v177/index.ts
      - name: Production Angular build
        run: npm run build
