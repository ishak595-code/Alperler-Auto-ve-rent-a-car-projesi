name: V183 Telematics Portability Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/telematics-admin/**"
      - "api/partner.ts"
      - "src/services/telematics.service.ts"
      - ".github/workflows/v183-telematics-portability-hardening.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v183-telematics-portability-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 22 from immutable action
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Browser telematics path must be same-origin
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/services/telematics.service.ts
          grep -Fq '/api/partner?op=telematics-admin' "$FILE"
          ! grep -Fq 'SUPABASE_PROJECT_URL' "$FILE"
          ! grep -Fq '/functions/v1/telematics-admin' "$FILE"
          ! grep -Fq 'SUPABASE_PUBLISHABLE_KEY' "$FILE"

      - name: BFF telematics proxy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'operation === "telematics-admin"' api/partner.ts
          grep -Fq 'edgeFunction: "telematics-admin"' api/partner.ts
          grep -Fq 'allowedMethods: ["GET", "POST"]' api/partner.ts
          grep -Fq 'requireAuth: true' api/partner.ts
          grep -Fq 'maxBodyBytes: 16 * 1024' api/partner.ts

      - name: Edge origin payload and abuse guards
        shell: bash
        run: |
          set -euo pipefail
          EDGE=supabase/functions/telematics-admin/index.ts
          grep -Fq 'Deno.env.get("PUBLIC_SITE_URL")' "$EDGE"
          grep -Fq '.vercel.app' "$EDGE"
          grep -Fq 'ORIGIN_NOT_ALLOWED' "$EDGE"
          grep -Fq 'MAX_BODY_BYTES = 16 * 1024' "$EDGE"
          grep -Fq 'PAYLOAD_TOO_LARGE' "$EDGE"
          grep -Fq 'consume_rate_limit' "$EDGE"
          grep -Fq 'telematics-read-v183' "$EDGE"
          grep -Fq 'telematics-config-v183' "$EDGE"
          grep -Fq 'telematics-command-v183' "$EDGE"
          grep -Fq 'RATE_LIMITED' "$EDGE"
          ! grep -Fq "$(printf '%s%s%s' 'alperler' 'rentaacar' '.com')" "$EDGE"
          ! grep -Fq '"access-control-allow-origin": "*"' "$EDGE"
          ! grep -Fq "'access-control-allow-origin':'*'" "$EDGE"

      - name: Remote command safety invariants must remain intact
        shell: bash
        run: |
          set -euo pipefail
          EDGE=supabase/functions/telematics-admin/index.ts
          for TOKEN in \
            'TELEMETRY_STALE' \
            'VEHICLE_NOT_STATIONARY' \
            'VEHICLE_MOVING' \
            'CAPABILITY_NOT_AVAILABLE' \
            'IMMOBILIZE_NEXT_STOP' \
            'CLEAR_IMMOBILIZER' \
            'speed > 3' \
            '5 * 60 * 1000' \
            'HMAC' \
            'SHA-256' \
            'providerBridgeReady()' \
            'protocol === "https:"'; do
            grep -Fq "$TOKEN" "$EDGE"
          done

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend TypeScript
        run: npm run lint

      - name: Vercel API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Telematics Edge Function TypeScript
        run: npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/telematics-admin/index.ts

      - name: Vercel function budget
        run: npm run vercel:functions

      - name: Production build
        run: npm run build
