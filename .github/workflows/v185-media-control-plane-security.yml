name: V185 Media Control Plane Security

on:
  pull_request:
    branches: [main]
    paths:
      - "src/services/catalog-media.service.ts"
      - "src/services/admin-media.service.ts"
      - "src/services/branch-media-v171.service.ts"
      - "api/partner.ts"
      - "supabase/functions/media-control-admin-v185/**"
      - "supabase/migrations/20260826090000_v185_media_control_plane_security.sql"
      - "supabase/migrations/20260826090100_v185_catalog_media_cover_state_invariant.sql"
      - ".github/workflows/v185-media-control-plane-security.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v185-media-control-plane-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Service-only PostgreSQL media contract
        shell: bash
        run: |
          set -euo pipefail
          SQL=supabase/migrations/20260826090000_v185_media_control_plane_security.sql
          COVER=supabase/migrations/20260826090100_v185_catalog_media_cover_state_invariant.sql
          for RPC in \
            service_catalog_media_list_v185 \
            service_catalog_media_create_v185 \
            service_catalog_media_update_v185 \
            service_catalog_media_set_cover_v185 \
            service_catalog_media_remove_v185 \
            service_register_media_asset_v185; do
            grep -Fq "function public.${RPC}" "$SQL"
          done
          grep -Fq 'private.can_actor_manage_content_v174(p_actor)' "$SQL"
          grep -Fq 'STORAGE_OBJECT_OWNERSHIP_REQUIRED' "$SQL"
          grep -Fq "listing_origin='CENTRAL'" "$SQL"
          grep -Fq 'CATALOG_LIVE_LAST_IMAGE_BLOCKED' "$SQL"
          grep -Fq 'CATALOG_LIVE_COVER_CHANGE_REQUIRES_REPLACEMENT' "$SQL"
          grep -Fq "left(v_path,6)<>'admin/'" "$SQL"
          grep -Fq 'from public,anon,authenticated' "$SQL"
          ! grep -Eq 'grant execute .* to (anon|authenticated)' "$SQL"
          ! grep -Eiq 'drop trigger|disable trigger|alter table public\.catalog_media.*disable' "$SQL"
          ! grep -Eiq 'drop policy.*branch|revoke .* on (table )?public\.catalog_media' "$SQL"
          grep -Fq 'catalog_media_cover_active_image_check' "$COVER"
          grep -Fq "is_cover is not true or (is_active is true and kind='IMAGE')" "$COVER"

      - name: Central metadata must use same-origin control plane
        shell: bash
        run: |
          set -euo pipefail
          CATALOG=src/services/catalog-media.service.ts
          ADMIN=src/services/admin-media.service.ts
          grep -Fq 'op=media-control-admin' "$CATALOG"
          grep -Fq 'op=media-control-admin' "$ADMIN"
          ! grep -Fq '/rest/v1/catalog_media' "$CATALOG"
          ! grep -Fq '/rest/v1/rpc/set_catalog_media_cover' "$CATALOG"
          ! grep -Fq '/rest/v1/rpc/remove_catalog_media_safe' "$CATALOG"
          ! grep -Fq '/rest/v1/media_assets' "$ADMIN"
          grep -Fq '/storage/v1/object/' "$CATALOG"
          grep -Fq '/storage/v1/upload/resumable' "$CATALOG"
          grep -Fq '/storage/v1/object/' "$ADMIN"

      - name: Branch media RLS path remains independent
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=src/services/branch-media-v171.service.ts
          grep -Fq 'BranchPortalAuthService' "$BRANCH"
          grep -Fq '/rest/v1/catalog_media' "$BRANCH"
          grep -Fq '/storage/v1/object/' "$BRANCH"
          grep -Fq 'branch/${branchId}/' "$BRANCH"
          ! grep -Fq 'media-control-admin' "$BRANCH"

      - name: Same-origin BFF contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'operation === "media-control-admin"' api/partner.ts
          grep -Fq 'edgeFunction: "media-control-admin-v185"' api/partner.ts
          grep -Fq 'allowedMethods: ["GET", "POST", "PATCH"]' api/partner.ts
          grep -Fq 'maxBodyBytes: 64 * 1024' api/partner.ts
          grep -Fq 'forwardQuery: ["entityType", "entityId"]' api/partner.ts

      - name: Edge auth and abuse controls
        shell: bash
        run: |
          set -euo pipefail
          EDGE=supabase/functions/media-control-admin-v185/index.ts
          grep -Fq 'Deno.env.get("PUBLIC_SITE_URL")' "$EDGE"
          grep -Fq '.vercel.app' "$EDGE"
          grep -Fq 'ORIGIN_NOT_ALLOWED' "$EDGE"
          grep -Fq 'MAX_BODY_BYTES = 64 * 1024' "$EDGE"
          grep -Fq 'media-control-read-v185' "$EDGE"
          grep -Fq 'media-control-write-v185' "$EDGE"
          grep -Fq 'consume_rate_limit' "$EDGE"
          grep -Fq 'service_catalog_media_create_v185' "$EDGE"
          grep -Fq 'service_register_media_asset_v185' "$EDGE"
          ! grep -Fq "$(printf '%s%s%s' 'alperler' 'rentaacar' '.com')" "$EDGE"
          ! grep -Fq '"access-control-allow-origin": "*"' "$EDGE"

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend lint
        run: npm run lint

      - name: API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Media Edge TypeScript
        run: npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/media-control-admin-v185/index.ts

      - name: Vercel function budget
        run: npm run vercel:functions

      - name: Production build
        run: npm run build
