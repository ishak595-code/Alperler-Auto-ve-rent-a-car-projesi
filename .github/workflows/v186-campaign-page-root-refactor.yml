name: V186 Campaign Page Root Refactor

on:
  push:
    branches:
      - v186-portability-recovery-runbook
    paths:
      - .github/workflows/v186-campaign-page-root-refactor.yml

permissions:
  contents: write

concurrency:
  group: v186-campaign-page-root-refactor
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v186-portability-recovery-runbook
          persist-credentials: true
          fetch-depth: 0

      - name: Apply assertion-guarded campaign page refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/campaigns.component.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { Component, DestroyRef, computed, inject, signal } from "@angular/core";',
              'import { Component, computed, inject } from "@angular/core";',
              'angular imports',
          )
          replace_once(
              'import { CampaignRecord, CampaignService } from "../services/campaign.service";',
              'import { CampaignProof, CampaignRecord, CampaignService } from "../services/campaign.service";',
              'campaign imports',
          )
          replace_once(
              '''import { SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY } from "../supabase.config";\n\ninterface CampaignProof {\n  campaignId: string;\n  pageViewsTotal: number;\n  uniqueViewersTotal: number;\n  recentViewers24h: number;\n  activeViewers15m: number;\n}\n''',
              '',
              'local network proof model',
          )
          replace_once(
              '''  private readonly location = inject(Location);\n  private readonly destroyRef = inject(DestroyRef);\n  private readonly proofByCampaign = signal<Record<string, CampaignProof>>({});''',
              '''  private readonly location = inject(Location);\n  private readonly proofByCampaign = this.campaignService.proofByCampaign;''',
              'local proof state',
          )
          replace_once(
              '''  constructor() {\n    void this.campaignService.loadPublic().catch(() => undefined);\n    void this.loadProof();\n    if (typeof window !== "undefined") { const timer = window.setInterval(() => void this.loadProof(), 60_000); this.destroyRef.onDestroy(() => window.clearInterval(timer)); }\n  }''',
              '''  constructor() {\n    void this.campaignService.loadPublic().catch(() => undefined);\n  }''',
              'campaign page scheduler',
          )

          start = text.find('  private async loadProof(): Promise<void> {')
          if start < 0:
              raise SystemExit('loadProof start marker missing')
          end = text.find('\n  }\n}', start)
          if end < 0:
              raise SystemExit('loadProof end marker missing')
          text = text[:start] + text[end + len('\n  }'):]

          forbidden = ('SUPABASE_PROJECT_URL', 'SUPABASE_PUBLISHABLE_KEY', 'campaign_social_proof', 'setInterval', 'DestroyRef', 'loadProof')
          leaked = [token for token in forbidden if token in text]
          if leaked:
              raise SystemExit(f'campaign page retained duplicate network ownership: {leaked!r}')
          if 'this.campaignService.proofByCampaign' not in text:
              raise SystemExit('campaign page not wired to shared CampaignService proof')
          if not text.rstrip().endswith('}'):
              raise SystemExit('campaign component class closure damaged')

          path.write_text(text)
          PY

      - name: Verify app contract
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit campaign page root fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/campaigns.component.ts
          git diff --cached --check
          git commit -m "perf(v186): share campaign social proof across pages"
          git push origin HEAD:v186-portability-recovery-runbook
