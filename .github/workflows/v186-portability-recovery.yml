name: V186 Production Portability Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".env.example"
      - "scripts/check-portability-v186.mjs"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "docs/PRODUCTION_RECOVERY_RUNBOOK_V186.md"
      - ".github/workflows/v186-portability-recovery.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "index.tsx"
      - "api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v186-production-portability-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Production portability source parity
        run: node scripts/check-portability-v186.mjs

      - name: Homepage social-proof singleton invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rpc_path = '/rest/v1/rpc/campaign_social_proof'
          owners = []
          for path in Path('src').rglob('*.ts'):
              text = path.read_text()
              count = text.count(rpc_path)
              if count:
                  owners.append((path.as_posix(), count))

          expected = [('src/services/campaign.service.ts', 1)]
          if owners != expected:
              raise SystemExit(f'social-proof RPC ownership drifted: {owners!r}')

          campaign = Path('src/services/campaign.service.ts').read_text()
          dynamic = Path('src/components/dynamic-home-section.component.ts').read_text()
          bootstrap = Path('index.tsx').read_text()

          required_campaign_tokens = (
              '@Injectable({ providedIn: "root" })',
              'readonly proofByCampaign = this._proofByCampaign.asReadonly();',
              'readonly clock = this._clock.asReadonly();',
              'socialProofInFlight',
              'socialProofLastLoadedAt',
              'async refreshPublicState(',
              'controller.abort()',
          )
          missing = [token for token in required_campaign_tokens if token not in campaign]
          if missing:
              raise SystemExit(f'CampaignService singleton hardening missing: {missing!r}')

          forbidden_dynamic = ('setInterval', 'DestroyRef', 'SUPABASE_PROJECT_URL', rpc_path)
          leaked = [token for token in forbidden_dynamic if token in dynamic]
          if leaked:
              raise SystemExit(f'dynamic homepage regained per-instance network/timer ownership: {leaked!r}')

          forbidden_bootstrap = ('installCampaignSocialProofFetchBroker', 'campaign-social-proof-fetch-broker', 'window.fetch =')
          leaked = [token for token in forbidden_bootstrap if token in bootstrap]
          if leaked:
              raise SystemExit(f'global fetch interception returned: {leaked!r}')

          if Path('src/services/campaign-social-proof-fetch-broker.ts').exists():
              raise SystemExit('obsolete global fetch broker file must stay deleted')
          PY

      - name: V186 Edge TypeScript
        run: |
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/analytics-admin-v186/index.ts
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/newsletter-admin-read-v186/index.ts
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/newsletter-admin/index.ts
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/newsletter-gateway/index.ts
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/bootstrap-owner-once/index.ts
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/owner-bootstrap-once/index.ts
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/v109-vehicle-media-import/index.ts
          npx -y deno@2.2.12 check --node-modules-dir=auto supabase/functions/v124-tour-media-import/index.ts

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend lint
        run: npm run lint

      - name: API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Vercel function budget
        run: npm run vercel:functions

      - name: Production build
        run: npm run build
