name: V187 Public Content Orchestration

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app.component.ts"
      - "src/pages/home-v71.component.ts"
      - "src/components/dynamic-home-section.component.ts"
      - "src/services/car.service.ts"
      - "src/services/campaign.service.ts"
      - "src/services/branch.service.ts"
      - "src/services/homepage-layout.service.ts"
      - "src/services/public-content-refresh-coordinator.service.ts"
      - "src/services/public-content-realtime.service.ts"
      - "scripts/check-public-content-orchestration-v187.mjs"
      - "docs/V187_PUBLIC_CONTENT_ORCHESTRATION.md"
      - ".github/workflows/v187-public-content-orchestration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v187-public-content-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Public content orchestration invariant
        run: node scripts/check-public-content-orchestration-v187.mjs

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend type check
        run: npm run lint

      - name: Production build
        run: npm run build
