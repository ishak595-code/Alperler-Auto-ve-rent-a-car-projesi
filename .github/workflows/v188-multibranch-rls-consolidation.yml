name: V188 Multi-Branch RLS Consolidation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260826223000_v188_multibranch_rls_policy_consolidation.sql"
      - "scripts/check-v188-rls-policy-consolidation.mjs"
      - "docs/V188_MULTIBRANCH_RLS_CONSOLIDATION.md"
      - ".github/workflows/v188-multibranch-rls-consolidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v188-multibranch-rls-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: V188 RLS semantic consolidation guard
        run: node scripts/check-v188-rls-policy-consolidation.mjs

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend type check
        run: npm run lint

      - name: API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build
