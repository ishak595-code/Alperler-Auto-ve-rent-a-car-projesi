name: V189 Security Definer Surface Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260826234500_v189_security_definer_surface_hardening.sql"
      - "scripts/check-v189-security-definer-surface.mjs"
      - "scripts/check-production-completion-invariants.mjs"
      - "src/services/branch.service.ts"
      - "src/services/branch-public-v171.service.ts"
      - "src/services/public-content-refresh-coordinator.service.ts"
      - "src/pages/campaigns.component.ts"
      - "vercel.json"
      - ".github/workflows/v189-security-definer-surface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v189-security-definer-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: V189 SECURITY DEFINER semantic guard
        run: node scripts/check-v189-security-definer-surface.mjs

      - name: Production completion invariants
        run: node scripts/check-production-completion-invariants.mjs

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend type check
        run: npm run lint

      - name: API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build
