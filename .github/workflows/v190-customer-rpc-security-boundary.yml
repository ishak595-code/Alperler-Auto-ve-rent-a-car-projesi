name: V190 Customer RPC Security Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260826235900_v190_customer_rpc_security_boundary.sql"
      - "scripts/check-v190-customer-rpc-security-boundary.mjs"
      - "docs/V190_CUSTOMER_RPC_SECURITY_BOUNDARY.md"
      - "src/services/customer-account.service.ts"
      - "src/services/customer-auth.service.ts"
      - ".github/workflows/v190-customer-rpc-security-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v190-customer-rpc-security-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: V190 RPC privilege-boundary guard
        run: node scripts/check-v190-customer-rpc-security-boundary.mjs

      - name: V189 historical security boundary guard
        run: node scripts/check-v189-security-definer-surface.mjs

      - name: Production completion invariants
        run: node scripts/check-production-completion-invariants.mjs

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend type check
        run: npm run lint

      - name: API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build
