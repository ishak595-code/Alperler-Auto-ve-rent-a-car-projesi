name: V193 Home Brand and Cinematic 3D

on:
  pull_request:
    branches: [main]
    paths:
      - "angular.json"
      - "index.html"
      - "public/manifest.json"
      - "public/brand/**"
      - "src/pages/home-v71.component.ts"
      - "src/services/admin-media.service.ts"
      - "src/services/theme.service.ts"
      - "src/prestige-palette-defaults.css"
      - "src/v193-cinematic-3d.css"
      - "scripts/check-v193-home-brand-3d.mjs"
      - "scripts/check-home-runtime-v192.mjs"
      - "scripts/check-public-content-orchestration-v187.mjs"
      - "docs/V193_HOME_BRAND_3D.md"
      - ".github/workflows/v193-home-brand-3d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v193-home-brand-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: V193 cinematic brand and 3D invariant
        run: node scripts/check-v193-home-brand-3d.mjs

      - name: V192 homepage runtime regression invariant
        run: node scripts/check-home-runtime-v192.mjs

      - name: V187 orchestration regression invariant
        run: node scripts/check-public-content-orchestration-v187.mjs

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend type check
        run: npm run lint

      - name: Production build
        run: npm run build
