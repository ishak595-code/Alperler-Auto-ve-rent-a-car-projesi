name: V194 Homepage Runtime Jank Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/admin/admin-homepage.component.ts"
      - "src/v193-cinematic-3d.css"
      - "public/service-worker.js"
      - "scripts/check-v191-responsive-runtime.mjs"
      - "scripts/check-v193-home-brand-3d.mjs"
      - "scripts/check-v194-home-runtime-jank.mjs"
      - "scripts/check-home-runtime-v192.mjs"
      - "scripts/check-public-content-orchestration-v187.mjs"
      - "scripts/check-pwa-installability.mjs"
      - "docs/V194_HOME_RUNTIME_JANK_HARDENING.md"
      - ".github/workflows/v194-home-runtime-jank.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v194-home-runtime-jank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Frontend type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: V194 homepage runtime jank invariant
        run: node scripts/check-v194-home-runtime-jank.mjs

      - name: V193 cinematic brand regression invariant
        run: node scripts/check-v193-home-brand-3d.mjs

      - name: V192 homepage runtime regression invariant
        run: node scripts/check-home-runtime-v192.mjs

      - name: V191 responsive runtime regression invariant
        run: node scripts/check-v191-responsive-runtime.mjs

      - name: V187 public orchestration regression invariant
        run: node scripts/check-public-content-orchestration-v187.mjs

      - name: PWA installability regression invariant
        run: node scripts/check-pwa-installability.mjs
