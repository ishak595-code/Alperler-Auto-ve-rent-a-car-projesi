name: V196 Dependency Governance

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - "scripts/check-dependency-governance-v196.mjs"
      - ".github/workflows/v196-dependency-governance.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - "scripts/check-dependency-governance-v196.mjs"
      - ".github/workflows/v196-dependency-governance.yml"

permissions:
  contents: read

jobs:
  dependency-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 22 from immutable action
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Verify dependency governance
        run: node scripts/check-dependency-governance-v196.mjs
