name: V198 Admin Content Ownership

on:
  pull_request:
    paths:
      - 'src/pages/admin/**'
      - 'src/pages/blog-detail.component.ts'
      - 'src/services/blog-admin.service.ts'
      - 'src/services/public-catalog-media.service.ts'
      - 'src/services/public-detail-data.service.ts'
      - 'scripts/check-v198-admin-content-ownership.mjs'
      - '.github/workflows/v198-admin-content-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/admin/**'
      - 'src/pages/blog-detail.component.ts'
      - 'src/services/blog-admin.service.ts'
      - 'src/services/public-catalog-media.service.ts'
      - 'src/services/public-detail-data.service.ts'
      - 'scripts/check-v198-admin-content-ownership.mjs'
      - '.github/workflows/v198-admin-content-ownership.yml'

permissions:
  contents: read

jobs:
  ownership-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-v198-admin-content-ownership.mjs
