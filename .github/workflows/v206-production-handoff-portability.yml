name: V206 Production Handoff Portability

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.nvmrc'
      - '.editorconfig'
      - 'package.json'
      - 'angular.json'
      - 'src/prestige-palette-defaults.css'
      - 'src/services/theme.service.ts'
      - 'src/services/navigation-config.service.ts'
      - 'src/services/default-site-config.ts'
      - 'src/services/payment-settings.service.ts'
      - 'src/pages/admin/admin-payment-settings.component.ts'
      - 'src/components/customer-mobile-dock.component.ts'
      - 'src/v193-cinematic-3d.css'
      - 'src/device-experience.css'
      - 'src/mobile-target-fixes.css'
      - 'src/app.routes.ts'
      - 'api/payments.ts'
      - 'api/_lib/integration-config.ts'
      - 'api/_lib/public-origin.ts'
      - 'supabase/functions/admin-core-gateway-v178/**'
      - 'supabase/migrations/20260831180700_v221_mobile_dock_profile_canonical.sql'
      - 'supabase/migrations/20260831182300_v221_payment_provider_contract.sql'
      - 'scripts/check-v204-mobile-conversion-account.mjs'
      - 'scripts/check-v206-handoff.mjs'
      - 'scripts/check-portability-v186.mjs'
      - 'scripts/check-v203-canonical-runtime-integrity.mjs'
      - 'scripts/check-v205-responsive-prestige.mjs'
      - 'scripts/check-v207-customer-experience.mjs'
      - 'scripts/check-v208-repository-governance.mjs'
      - 'scripts/cancel-stale-pr-workflows.mjs'
      - 'docs/**'
      - 'playwright.v204.config.ts'
      - 'playwright.v205.config.ts'
      - 'tests/v204/**'
      - 'tests/v205/**'
      - '.github/workflows/v205-responsive-prestige.yml'
      - '.github/workflows/v206-production-handoff-portability.yml'
      - '.github/workflows/v208-repository-governance.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.nvmrc'
      - '.editorconfig'
      - 'package.json'
      - 'angular.json'
      - 'src/prestige-palette-defaults.css'
      - 'src/services/theme.service.ts'
      - 'src/services/navigation-config.service.ts'
      - 'src/services/default-site-config.ts'
      - 'src/services/payment-settings.service.ts'
      - 'src/pages/admin/admin-payment-settings.component.ts'
      - 'src/components/customer-mobile-dock.component.ts'
      - 'src/v193-cinematic-3d.css'
      - 'src/device-experience.css'
      - 'src/mobile-target-fixes.css'
      - 'src/app.routes.ts'
      - 'api/payments.ts'
      - 'api/_lib/integration-config.ts'
      - 'api/_lib/public-origin.ts'
      - 'supabase/functions/admin-core-gateway-v178/**'
      - 'supabase/migrations/20260831180700_v221_mobile_dock_profile_canonical.sql'
      - 'supabase/migrations/20260831182300_v221_payment_provider_contract.sql'
      - 'scripts/check-v204-mobile-conversion-account.mjs'
      - 'scripts/check-v206-handoff.mjs'
      - 'scripts/check-portability-v186.mjs'
      - 'scripts/check-v203-canonical-runtime-integrity.mjs'
      - 'scripts/check-v205-responsive-prestige.mjs'
      - 'scripts/check-v207-customer-experience.mjs'
      - 'scripts/check-v208-repository-governance.mjs'
      - 'scripts/cancel-stale-pr-workflows.mjs'
      - 'docs/**'
      - 'playwright.v204.config.ts'
      - 'playwright.v205.config.ts'
      - 'tests/v204/**'
      - 'tests/v205/**'
      - '.github/workflows/v205-responsive-prestige.yml'
      - '.github/workflows/v206-production-handoff-portability.yml'
      - '.github/workflows/v208-repository-governance.yml'

permissions:
  contents: read

concurrency:
  group: v206-handoff-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  handoff-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Mobile dock release contract
        run: node scripts/check-v204-mobile-conversion-account.mjs
      - name: Customer experience release contract
        run: node scripts/check-v207-customer-experience.mjs
      - name: Full handoff certification
        run: npm run verify:handoff

  handoff-devices:
    needs: handoff-static
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install pinned browser tooling
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Android Apple tablet desktop regression
        run: npx playwright test --config=playwright.v205.config.ts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v206-handoff-device-artifacts
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
