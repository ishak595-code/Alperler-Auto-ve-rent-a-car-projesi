name: V208.3 Server-Only Boundaries

on:
  pull_request:
  push:
    branches:
      - main
      - v2083-server-only-boundaries

concurrency:
  group: v2083-server-only-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-only-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: false
      - name: Enforce server-only database boundaries
        run: node scripts/check-v2083-server-only-boundaries.mjs
