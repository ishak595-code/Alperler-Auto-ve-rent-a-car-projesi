name: V218 Initial Bundle Ownership

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app.component.ts'
      - 'src/app.routes.ts'
      - 'src/components/checkout-loyalty-panel.component.ts'
      - 'src/components/admin-customer-lifetime-panel.component.ts'
      - 'angular.json'
      - 'scripts/check-v218-initial-bundle-ownership.mjs'
      - '.github/workflows/v218-initial-bundle-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'src/app.component.ts'
      - 'src/app.routes.ts'
      - 'src/components/checkout-loyalty-panel.component.ts'
      - 'src/components/admin-customer-lifetime-panel.component.ts'
      - 'angular.json'
      - 'scripts/check-v218-initial-bundle-ownership.mjs'
      - '.github/workflows/v218-initial-bundle-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v218-initial-bundle-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  initial-bundle-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund

      - name: V218 initial bundle ownership invariant
        run: node scripts/check-v218-initial-bundle-ownership.mjs

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npm run lint

      - name: Production build with hard 1MB initial ceiling
        run: npm run build
