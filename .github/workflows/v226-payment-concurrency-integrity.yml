name: V226 Payment Concurrency Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - v226-production-hardening-zero-regression

permissions:
  contents: read

jobs:
  saved-card-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify saved-card concurrency and security contract
        run: node scripts/check-v226-payment-concurrency.mjs
