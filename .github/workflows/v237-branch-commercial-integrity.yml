name: V237 Branch Commercial Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/branch-plans-v171.component.ts"
      - "src/pages/branch-subscription-v171.component.ts"
      - "src/pages/branch-directory-v171.component.ts"
      - "src/pages/branch-detail-v171.component.ts"
      - "src/pages/admin/admin-branch-subscriptions-v171.component.ts"
      - "src/services/branch-subscription-v171.service.ts"
      - "src/services/branch-communication.service.ts"
      - "supabase/migrations/20260903*_v237_*.sql"
      - "supabase/functions/branch-partner-v164/index.ts"
      - ".github/workflows/v237-branch-commercial-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-commercial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Complimentary plan is admin-granted and one active listing
        shell: bash
        run: |
          set -euo pipefail
          PLAN=supabase/migrations/20260903114500_v237_complimentary_single_listing_plan.sql
          GUARD=supabase/migrations/20260903115000_v237_complimentary_plan_contract_guard.sql
          QUOTA=supabase/migrations/20260903093000_v237_active_listing_quota_semantics.sql
          USAGE=supabase/migrations/20260903113000_v237_branch_listing_usage_portal.sql
          INVOKER=supabase/migrations/20260903120000_v237_listing_usage_security_invoker.sql
          test -f "$PLAN" && test -f "$GUARD" && test -f "$QUOTA" && test -f "$USAGE" && test -f "$INVOKER"
          grep -Fq "'{listingLimit}', '1'::jsonb" "$PLAN"
          grep -Fq "'{adminGrantOnly}', 'true'::jsonb" "$PLAN"
          grep -Fq "monthly_fee = 0" "$GUARD"
          grep -Fq '"listingLimit":1,"adminGrantOnly":true' "$GUARD"
          grep -Fq "new.publication_status = 'PUBLISHED'" "$QUOTA"
          grep -Fq "BRANCH_ACTIVE_LISTING_LIMIT_REACHED" "$QUOTA"
          grep -Fq "my_branch_listing_usage_v237" "$USAGE"
          grep -Fq "security invoker" "$INVOKER"
          grep -Fq "m.user_id = auth.uid()" "$INVOKER"

      - name: Due diligence is enforced at edge and database boundaries
        shell: bash
        run: |
          set -euo pipefail
          DB_GUARD=supabase/migrations/20260903121000_v237_branch_due_diligence_db_guard.sql
          EDGE=supabase/functions/branch-partner-v164/index.ts
          test -f "$DB_GUARD" && test -f "$EDGE"
          grep -Fq 'BUSINESS_DUE_DILIGENCE_REQUIRED' "$EDGE"
          grep -Fq 'BRANCH_DUE_DILIGENCE_REQUIRED' "$DB_GUARD"
          grep -Fq 'branch_partner_approval_due_diligence_v237' "$DB_GUARD"
          grep -Fq 'branch_provision_due_diligence_v237' "$DB_GUARD"
          grep -Fq 'old.status is distinct from' "$DB_GUARD"

      - name: Public discovery hides discretionary grant
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=src/services/branch-subscription-v171.service.ts
          ADMIN=src/pages/admin/admin-branch-subscriptions-v171.component.ts
          PORTAL=src/pages/branch-subscription-v171.component.ts
          grep -Fq 'plan.entitlements?.["adminGrantOnly"]!==true' "$SERVICE"
          grep -Fq 'Yalnız Super Admin atar · 1 aktif ilan' "$ADMIN"
          grep -Fq 'this.adminGrantOnly(plan)?0:' "$ADMIN"
          grep -Fq 'Aktif İlan Hakkı' "$PORTAL"
          grep -Fq 'Taslak ve merkez incelemesindeki ilanlar aktif ilan hakkından düşmez' "$PORTAL"

      - name: Branch communication routes stay canonical and safe
        shell: bash
        run: |
          set -euo pipefail
          COMM=src/services/branch-communication.service.ts
          test -f "$COMM"
          grep -Fq 'https://wa.me/' "$COMM"
          grep -Fq 'emailUrl' "$COMM"
          grep -Fq 'httpsUrl' "$COMM"
          grep -Fq 'BranchCommunicationService' src/pages/branch-directory-v171.component.ts
          grep -Fq 'BranchCommunicationService' src/pages/branch-detail-v171.component.ts
          ! grep -Fq "'tel:'+branch.phone" src/pages/branch-directory-v171.component.ts
          ! grep -Fq "'tel:'+current.phone" src/pages/branch-detail-v171.component.ts
          ! grep -Fq 'whatsappUrl(value:string)' src/pages/branch-detail-v171.component.ts

      - name: TypeScript and production build
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.api.json
          npm run build
