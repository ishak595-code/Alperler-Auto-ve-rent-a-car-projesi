name: V89 Inline Media Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v89-inline-media-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch admin media inputs in context
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Site settings: real Storage uploads instead of browser base64; remove fake profile images.
          path = 'src/pages/admin/admin-settings.component.ts'
          replace_once(path,
              'import { ConfirmService } from "../../services/confirm.service";\n',
              'import { ConfirmService } from "../../services/confirm.service";\nimport { AdminMediaService } from "../../services/admin-media.service";\n')
          replace_once(path,
              '  confirmService = inject(ConfirmService);\n  router = inject(Router);',
              '  confirmService = inject(ConfirmService);\n  mediaService = inject(AdminMediaService);\n  router = inject(Router);')
          replace_once(path,
              '''  onFileSelected(event: any, member: TeamMember) {\n    const file = event.target.files[0];\n    if (file) {\n      const reader = new FileReader();\n      reader.onload = (e: any) => {\n        member.image = e.target.result;\n      };\n      reader.readAsDataURL(file);\n    }\n  }\n\n  onLogoSelected(event: any) {\n    const file = event.target.files[0];\n    if (file) {\n      const reader = new FileReader();\n      reader.onload = (e: any) => {\n        this.formConfig.logoUrl = e.target.result;\n      };\n      reader.readAsDataURL(file);\n    }\n  }\n''',
              '''  async onFileSelected(event: Event, member: TeamMember) {\n    const input = event.target as HTMLInputElement;\n    const file = input.files?.[0];\n    if (!file) return;\n    try {\n      const uploaded = await this.mediaService.uploadImage(file, "TEAM_MEMBER", String(member.id), "profile");\n      member.image = uploaded.publicUrl;\n      this.toastService.show("Ekip fotoğrafı Supabase Storage'a yüklendi.", "success");\n    } catch (error) {\n      this.toastService.show(error instanceof Error ? error.message : "Fotoğraf yüklenemedi.", "error");\n    } finally { input.value = ""; }\n  }\n\n  async onLogoSelected(event: Event) {\n    const input = event.target as HTMLInputElement;\n    const file = input.files?.[0];\n    if (!file) return;\n    try {\n      const uploaded = await this.mediaService.uploadImage(file, "SITE_CONFIG", "main", "logo");\n      this.formConfig.logoUrl = uploaded.publicUrl;\n      this.toastService.show("Logo Supabase Storage'a yüklendi.", "success");\n    } catch (error) {\n      this.toastService.show(error instanceof Error ? error.message : "Logo yüklenemedi.", "error");\n    } finally { input.value = ""; }\n  }\n\n  async onAdminProfileSelected(event: Event) {\n    const input = event.target as HTMLInputElement;\n    const file = input.files?.[0];\n    if (!file) return;\n    try {\n      const uploaded = await this.mediaService.uploadImage(file, "SITE_CONFIG", "main", "admin-profile");\n      this.formConfig.adminProfileUrl = uploaded.publicUrl;\n      this.toastService.show("Admin profil fotoğrafı Supabase Storage'a yüklendi.", "success");\n    } catch (error) {\n      this.toastService.show(error instanceof Error ? error.message : "Profil fotoğrafı yüklenemedi.", "error");\n    } finally { input.value = ""; }\n  }\n\n  async onOgImageSelected(event: Event) {\n    const input = event.target as HTMLInputElement;\n    const file = input.files?.[0];\n    if (!file) return;\n    try {\n      const uploaded = await this.mediaService.uploadImage(file, "SITE_CONFIG", "main", "og-image");\n      this.formConfig.seoOgImage = uploaded.publicUrl;\n      this.toastService.show("Paylaşım görseli Supabase Storage'a yüklendi.", "success");\n    } catch (error) {\n      this.toastService.show(error instanceof Error ? error.message : "Paylaşım görseli yüklenemedi.", "error");\n    } finally { input.value = ""; }\n  }\n''')
          replace_once(path,
              '      image: "https://picsum.photos/200/200",',
              '      image: "",')
          replace_once(path,
              '''                  <input [(ngModel)]="formConfig.adminProfileUrl" name="adminProfileUrl" class="w-full rounded-lg border bg-white p-3 text-sm text-slate-700" placeholder="https://..." />\n                </label>''',
              '''                  <input [(ngModel)]="formConfig.adminProfileUrl" name="adminProfileUrl" class="w-full rounded-lg border bg-white p-3 text-sm text-slate-700" placeholder="https://..." />\n                  <label class="mt-2 inline-flex min-h-11 cursor-pointer items-center justify-center rounded-lg border border-blue-200 bg-blue-50 px-4 text-xs font-black text-blue-700">\n                    Dosya Seç\n                    <input type="file" accept="image/jpeg,image/png,image/webp,image/avif" class="sr-only" (change)="onAdminProfileSelected($event)" aria-label="Admin profil fotoğrafı dosyası seç" />\n                  </label>\n                </label>''')
          replace_once(path,
              '''                <input\n                  [(ngModel)]="formConfig.seoOgImage"\n                  name="seoOgImage"\n                  class="w-full p-3 border rounded text-sm"\n                  placeholder="https://... (önerilen boyut: 1200x630)"\n                />''',
              '''                <input\n                  [(ngModel)]="formConfig.seoOgImage"\n                  name="seoOgImage"\n                  class="w-full p-3 border rounded text-sm"\n                  placeholder="https://... (önerilen boyut: 1200x630)"\n                />\n                <label class="mt-2 inline-flex min-h-11 cursor-pointer items-center justify-center rounded-lg border border-blue-200 bg-blue-50 px-4 text-xs font-black text-blue-700">\n                  Dosya Seç\n                  <input type="file" accept="image/jpeg,image/png,image/webp,image/avif" class="sr-only" (change)="onOgImageSelected($event)" aria-label="Sosyal medya paylaşım görseli dosyası seç" />\n                </label>''')

          # Campaign cover: URL + real file upload.
          path = 'src/pages/admin/admin-campaigns.component.ts'
          replace_once(path,
              'import { ToastService } from "../../services/toast.service";\n',
              'import { ToastService } from "../../services/toast.service";\nimport { AdminMediaService } from "../../services/admin-media.service";\n')
          replace_once(path,
              '  private readonly toast = inject(ToastService);\n  readonly campaigns',
              '  private readonly toast = inject(ToastService);\n  private readonly adminMedia = inject(AdminMediaService);\n  readonly campaigns')
          replace_once(path,
              '              <label class="field"><span>Kapak görseli URL</span><input [(ngModel)]="coverImage" name="coverImage" type="url" placeholder="https://..." /></label>',
              '''              <div class="field"><span>Kapak görseli</span><input [(ngModel)]="coverImage" name="coverImage" type="url" placeholder="https://..." aria-label="Kampanya kapak görseli URL adresi" />\n                <label class="flex min-h-11 cursor-pointer items-center justify-center rounded-xl border border-amber-200 bg-amber-50 px-4 text-xs font-black text-amber-800">Dosya Seç\n                  <input type="file" accept="image/jpeg,image/png,image/webp,image/avif" class="sr-only" (change)="onCampaignCoverSelected($event)" aria-label="Kampanya kapak görseli dosyası seç" />\n                </label>\n                @if (coverImage) { <img [src]="coverImage" alt="Kampanya kapak önizlemesi" class="mt-2 aspect-video w-full rounded-xl object-cover" /> }\n              </div>''')
          replace_once(path,
              '  edit(campaign: CampaignRecord): void {',
              '''  async onCampaignCoverSelected(event: Event): Promise<void> {\n    const input = event.target as HTMLInputElement;\n    const file = input.files?.[0];\n    if (!file) return;\n    try {\n      const entityId = this.editingId || `draft-${Date.now()}`;\n      const uploaded = await this.adminMedia.uploadImage(file, "CAMPAIGN", entityId, "cover");\n      this.coverImage = uploaded.publicUrl;\n      this.toast.show("Kampanya görseli Supabase Storage'a yüklendi.", "success");\n    } catch (error) { this.toast.show(this.message(error), "error"); }\n    finally { input.value = ""; }\n  }\n\n  edit(campaign: CampaignRecord): void {''')

          # Blog cover: remove fake picsum and add real file upload next to URL.
          path = 'src/pages/admin/admin-blog.component.ts'
          replace_once(path,
              "import { ConfirmService } from '../../services/confirm.service';\n",
              "import { ConfirmService } from '../../services/confirm.service';\nimport { AdminMediaService } from '../../services/admin-media.service';\n")
          replace_once(path,
              '''                             <input [(ngModel)]="newPost.image" placeholder="https://..." class="w-full p-3 border border-slate-200 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none mb-4">''',
              '''                             <input [(ngModel)]="newPost.image" placeholder="https://..." aria-label="Blog kapak görseli URL adresi" class="w-full p-3 border border-slate-200 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none mb-2">\n                             <label class="mb-4 flex min-h-11 cursor-pointer items-center justify-center rounded-lg border border-blue-200 bg-blue-50 px-4 text-xs font-black text-blue-700">Dosya Seç\n                               <input type="file" accept="image/jpeg,image/png,image/webp,image/avif" class="sr-only" (change)="onBlogImageSelected($event)" aria-label="Blog kapak görseli dosyası seç" />\n                             </label>''')
          replace_once(path,
              "  confirmService = inject(ConfirmService);\n  router = inject(Router);",
              "  confirmService = inject(ConfirmService);\n  mediaService = inject(AdminMediaService);\n  router = inject(Router);")
          replace_once(path,
              "      title: '', summary: '', content: '', image: 'https://picsum.photos/800/600', readTime: '', date: new Date().toLocaleDateString('tr-TR')",
              "      title: '', summary: '', content: '', image: '', readTime: '', date: new Date().toLocaleDateString('tr-TR')")
          # second identical reset occurrence
          p = Path(path); txt = p.read_text(); txt = txt.replace("{ title: '', summary: '', content: '', image: 'https://picsum.photos/800/600', readTime: '', date: new Date().toLocaleDateString('tr-TR') }", "{ title: '', summary: '', content: '', image: '', readTime: '', date: new Date().toLocaleDateString('tr-TR') }"); p.write_text(txt)
          replace_once(path,
              '  goBack() {\n      this.router.navigate([\'/admin/dashboard\']);\n  }',
              '''  async onBlogImageSelected(event: Event) {\n      const input = event.target as HTMLInputElement;\n      const file = input.files?.[0];\n      if (!file) return;\n      try {\n          const entityId = String(this.newPost.cloudId || this.newPost.id || `draft-${Date.now()}`);\n          const uploaded = await this.mediaService.uploadImage(file, 'BLOG', entityId, 'cover');\n          this.newPost.image = uploaded.publicUrl;\n          this.toastService.show("Blog görseli Supabase Storage'a yüklendi.", 'success');\n      } catch (error) {\n          this.toastService.show(error instanceof Error ? error.message : 'Blog görseli yüklenemedi.', 'error');\n      } finally { input.value = ''; }\n  }\n\n  goBack() {\n      this.router.navigate(['/admin/dashboard']);\n  }''')

          print('V89 inline media patches applied successfully')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/admin-settings.component.ts src/pages/admin/admin-campaigns.component.ts src/pages/admin/admin-blog.component.ts
          git diff --cached --check
          git commit -m "V89: integrate file uploads into content editors"
          git push origin HEAD:main
