name: V91 Team Top Actions Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v91-team-top-actions-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Add team search and contextual create action to top header
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p=Path('src/pages/admin/admin-team.component.ts')
          t=p.read_text()
          def rep(old,new,label):
              global t
              c=t.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1, got {c}')
              t=t.replace(old,new,1)

          old='''            <button type="button" (click)="refresh()" [disabled]="loading()" class="min-h-12 rounded-xl bg-white px-5 font-black text-slate-950 disabled:opacity-50">{{ loading() ? 'Yükleniyor…' : 'Veriyi Yenile' }}</button>'''
          new='''            <div class="grid w-full gap-2 lg:w-auto lg:grid-cols-[minmax(220px,1fr)_auto_auto]">\n              @if (tab() !== 'assignments') {\n                <input [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" type="search" autocomplete="off" [placeholder]="teamSearchPlaceholder()" aria-label="Ekip yönetimi kayıtlarında ara" class="min-h-12 rounded-xl border border-white/15 bg-white/10 px-4 text-sm font-bold text-white outline-none placeholder:text-slate-400 focus:border-blue-400" />\n              } @else {\n                <div class="hidden lg:block"></div>\n              }\n              <button type="button" (click)="startNewForCurrentTab()" class="min-h-12 rounded-xl bg-blue-600 px-5 text-sm font-black text-white">+ {{ newActionLabel() }}</button>\n              <button type="button" (click)="refresh()" [disabled]="loading()" class="min-h-12 rounded-xl bg-white px-5 text-sm font-black text-slate-950 disabled:opacity-50">{{ loading() ? 'Yükleniyor…' : 'Yenile' }}</button>\n            </div>'''
          rep(old,new,'team top actions')

          rep('<form (ngSubmit)="inviteAdmin()" class="rounded-3xl','<form id="team-admin-form" (ngSubmit)="inviteAdmin()" class="rounded-3xl','admin form id')
          rep('<form (ngSubmit)="saveStaff()" class="rounded-3xl','<form id="team-staff-form" (ngSubmit)="saveStaff()" class="rounded-3xl','staff form id')
          rep('<form (ngSubmit)="saveBranch()" class="rounded-3xl','<form id="team-branch-form" (ngSubmit)="saveBranch()" class="rounded-3xl','branch form id')
          rep('<section class="grid gap-5 lg:grid-cols-3">','<section id="team-assignment-form" class="grid gap-5 lg:grid-cols-3">','assignment section id')

          rep('@for (admin of admins(); track admin.userId)','@for (admin of filteredAdmins(); track admin.userId)','filtered admins loop')
          rep('@for (staff of staff(); track staff.id)','@for (staff of filteredStaff(); track staff.id)','filtered staff loop')
          old_branch='''@for (branch of branches(); track branch.id) {\n                <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">'''
          new_branch='''@for (branch of filteredBranches(); track branch.id) {\n                <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">'''
          rep(old_branch,new_branch,'filtered branches loop')

          old='''  readonly saving = signal(false);\n  readonly admins = this.management.admins;'''
          new='''  readonly saving = signal(false);\n  readonly searchQuery = signal("");\n  readonly admins = this.management.admins;'''
          rep(old,new,'team search signal')

          old='''  readonly activeStaff = computed(() => this.staff().filter((row) => row.isActive));\n  readonly cloudVehicles = computed(() => this.cars.getAllVehicles()().filter((row) => row.category !== "TOUR" && row.cloudId));'''
          new='''  readonly activeStaff = computed(() => this.staff().filter((row) => row.isActive));\n  readonly filteredAdmins = computed(() => {\n    const q = this.searchQuery().trim().toLocaleLowerCase("tr-TR");\n    if (!q) return this.admins();\n    return this.admins().filter((row) => `${row.displayName || ""} ${row.email} ${row.role}`.toLocaleLowerCase("tr-TR").includes(q));\n  });\n  readonly filteredStaff = computed(() => {\n    const q = this.searchQuery().trim().toLocaleLowerCase("tr-TR");\n    if (!q) return this.staff();\n    return this.staff().filter((row) => `${row.displayName} ${row.jobTitle || ""} ${row.department} ${row.email || ""} ${row.phone || ""}`.toLocaleLowerCase("tr-TR").includes(q));\n  });\n  readonly filteredBranches = computed(() => {\n    const q = this.searchQuery().trim().toLocaleLowerCase("tr-TR");\n    if (!q) return this.branches();\n    return this.branches().filter((row) => `${row.code} ${row.name} ${row.city} ${row.district || ""} ${row.address || ""}`.toLocaleLowerCase("tr-TR").includes(q));\n  });\n  readonly cloudVehicles = computed(() => this.cars.getAllVehicles()().filter((row) => row.category !== "TOUR" && row.cloudId));'''
          rep(old,new,'team filtered computed')

          marker='''  ngOnInit(): void { void this.refresh(); }'''
          methods='''  ngOnInit(): void { void this.refresh(); }\n\n  teamSearchPlaceholder(): string {\n    return this.tab() === "admins" ? "Yönetici adı, e-posta veya rol ara…" : this.tab() === "staff" ? "Çalışan, unvan veya departman ara…" : "Şube, kod, şehir veya ilçe ara…";\n  }\n\n  newActionLabel(): string {\n    return this.tab() === "admins" ? "Yeni Yönetici" : this.tab() === "staff" ? "Yeni Çalışan" : this.tab() === "branches" ? "Yeni Şube" : "Yeni Görev";\n  }\n\n  startNewForCurrentTab(): void {\n    this.searchQuery.set("");\n    if (this.tab() === "staff") this.resetStaffForm();\n    if (this.tab() === "branches") this.resetBranchForm();\n    if (this.tab() === "admins") { this.adminName = ""; this.adminEmail = ""; this.adminRole = "admin"; this.adminBranchId = ""; }\n    const target = this.tab() === "admins" ? "team-admin-form" : this.tab() === "staff" ? "team-staff-form" : this.tab() === "branches" ? "team-branch-form" : "team-assignment-form";\n    if (typeof document !== "undefined") document.getElementById(target)?.scrollIntoView({ behavior: "smooth", block: "start" });\n  }'''
          rep(marker,methods,'team helper methods')

          p.write_text(t)
          PY
          git rm .github/workflows/v91-team-top-actions-once.yml
          git diff --check
      - name: Commit team top-action standard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V91: keep team search and create actions at the top"
          git push origin HEAD:main
