name: V92 Admin Sticky Primary Actions Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v92-admin-sticky-primary-actions-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Keep primary admin actions reachable at the top
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count} in {path}')
              p.write_text(text.replace(old, new, 1))

          # 1) Catalog studio: move search, type filters and all create actions
          # into one compact sticky control surface below the global admin topbar.
          path = 'src/pages/admin/admin-catalog-editor.component.ts'
          create_block = '''            <div class="grid gap-2 sm:grid-cols-3">\n              <button type="button" (click)="createVehicle('RENTAL')" [disabled]="saving()" class="min-h-12 rounded-xl bg-blue-600 px-4 font-black text-white disabled:opacity-40">+ Yeni Kiralık</button>\n              <button type="button" (click)="createVehicle('SALE')" [disabled]="saving()" class="min-h-12 rounded-xl bg-emerald-600 px-4 font-black text-white disabled:opacity-40">+ Yeni Satılık</button>\n              <button type="button" (click)="createTour()" [disabled]="saving()" class="min-h-12 rounded-xl bg-violet-600 px-4 font-black text-white disabled:opacity-40">+ Yeni Tur</button>\n            </div>'''
          patch(path, create_block, '', 'catalog remove hero create actions')
          search_block = '''          <div class="mt-5 grid gap-3 lg:grid-cols-[minmax(260px,1fr)_auto]">\n            <input [(ngModel)]="search" type="search" aria-label="Katalogda ara" placeholder="Marka, model, stok kodu veya tur ara…" class="min-h-12 w-full rounded-xl border border-white/15 bg-white/10 px-4 text-sm font-bold text-white outline-none placeholder:text-slate-400 focus:border-blue-400" />\n            <div class="grid grid-cols-3 gap-2" role="tablist" aria-label="Katalog türü">\n              <button type="button" (click)="filter.set('RENTAL')" [class.bg-blue-600]="filter()==='RENTAL'" [class.text-white]="filter()==='RENTAL'" class="min-h-12 rounded-xl bg-white/10 px-4 text-xs font-black text-slate-200">Kiralık</button>\n              <button type="button" (click)="filter.set('SALE')" [class.bg-emerald-600]="filter()==='SALE'" [class.text-white]="filter()==='SALE'" class="min-h-12 rounded-xl bg-white/10 px-4 text-xs font-black text-slate-200">Satılık</button>\n              <button type="button" (click)="filter.set('TOUR')" [class.bg-violet-600]="filter()==='TOUR'" [class.text-white]="filter()==='TOUR'" class="min-h-12 rounded-xl bg-white/10 px-4 text-xs font-black text-slate-200">Turlar</button>\n            </div>\n          </div>'''
          patch(path, search_block, '', 'catalog remove hero search')
          marker = '''        </header>\n\n        @if (error()) {'''
          sticky = '''        </header>\n\n        <section class="sticky top-16 z-40 rounded-2xl border border-slate-200 bg-white/95 p-3 shadow-lg backdrop-blur" aria-label="Katalog hızlı işlemleri">\n          <div class="grid gap-2 xl:grid-cols-[minmax(280px,1fr)_auto_auto] xl:items-center">\n            <input [(ngModel)]="search" type="search" aria-label="Katalogda ara" placeholder="Marka, model, stok kodu veya tur ara…" class="min-h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm font-bold text-slate-900 outline-none placeholder:text-slate-400 focus:border-blue-500" />\n            <div class="grid grid-cols-3 gap-2" role="tablist" aria-label="Katalog türü">\n              <button type="button" (click)="filter.set('RENTAL')" [class.bg-blue-600]="filter()==='RENTAL'" [class.text-white]="filter()==='RENTAL'" class="min-h-12 rounded-xl bg-slate-100 px-3 text-xs font-black text-slate-700">Kiralık</button>\n              <button type="button" (click)="filter.set('SALE')" [class.bg-emerald-600]="filter()==='SALE'" [class.text-white]="filter()==='SALE'" class="min-h-12 rounded-xl bg-slate-100 px-3 text-xs font-black text-slate-700">Satılık</button>\n              <button type="button" (click)="filter.set('TOUR')" [class.bg-violet-600]="filter()==='TOUR'" [class.text-white]="filter()==='TOUR'" class="min-h-12 rounded-xl bg-slate-100 px-3 text-xs font-black text-slate-700">Turlar</button>\n            </div>\n            <div class="grid grid-cols-3 gap-2">\n              <button type="button" (click)="createVehicle('RENTAL')" [disabled]="saving()" class="min-h-12 rounded-xl bg-blue-600 px-3 text-xs font-black text-white disabled:opacity-40">+ Kiralık</button>\n              <button type="button" (click)="createVehicle('SALE')" [disabled]="saving()" class="min-h-12 rounded-xl bg-emerald-600 px-3 text-xs font-black text-white disabled:opacity-40">+ Satılık</button>\n              <button type="button" (click)="createTour()" [disabled]="saving()" class="min-h-12 rounded-xl bg-violet-600 px-3 text-xs font-black text-white disabled:opacity-40">+ Tur</button>\n            </div>\n          </div>\n        </section>\n\n        @if (error()) {'''
          patch(path, marker, sticky, 'catalog sticky controls')

          # 2) Campaigns: keep search, create and refresh in a sticky compact bar.
          path = 'src/pages/admin/admin-campaigns.component.ts'
          block = '''          <div class="mt-5 grid gap-3 lg:grid-cols-[minmax(260px,1fr)_auto_auto]">\n            <input [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" type="search" autocomplete="off" placeholder="Kampanya adı, rozet veya durum ara…" aria-label="Kampanyalarda ara" class="min-h-12 rounded-xl border border-white/15 bg-white/10 px-4 text-sm font-bold text-white outline-none placeholder:text-slate-400 focus:border-amber-400" />\n            <button type="button" (click)="startNewCampaign()" class="min-h-12 rounded-xl bg-amber-500 px-5 text-sm font-black text-slate-950">+ Yeni Kampanya</button>\n            <button type="button" (click)="refresh()" class="min-h-12 rounded-xl border border-white/15 bg-white/10 px-5 text-sm font-black text-white">Yenile</button>\n          </div>'''
          patch(path, block, '', 'campaign remove hero actions')
          marker = '''        </header>\n\n        <section class="grid gap-5 xl:grid-cols-[430px_1fr]">'''
          sticky = '''        </header>\n\n        <section class="sticky top-16 z-40 rounded-2xl border border-slate-200 bg-white/95 p-3 shadow-lg backdrop-blur" aria-label="Kampanya hızlı işlemleri">\n          <div class="grid gap-2 sm:grid-cols-[minmax(220px,1fr)_auto_auto]">\n            <input [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" type="search" autocomplete="off" placeholder="Kampanya adı, rozet veya durum ara…" aria-label="Kampanyalarda ara" class="min-h-12 rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm font-bold text-slate-900 outline-none placeholder:text-slate-400 focus:border-amber-500" />\n            <button type="button" (click)="startNewCampaign()" class="min-h-12 rounded-xl bg-amber-500 px-5 text-sm font-black text-slate-950">+ Yeni Kampanya</button>\n            <button type="button" (click)="refresh()" class="min-h-12 rounded-xl border border-slate-200 bg-white px-5 text-sm font-black text-slate-900">Yenile</button>\n          </div>\n        </section>\n\n        <section class="grid gap-5 xl:grid-cols-[430px_1fr]">'''
          patch(path, marker, sticky, 'campaign sticky controls')

          # 3) Homepage builder: keep create/refresh available without returning to top.
          path = 'src/pages/admin/admin-homepage.component.ts'
          block = '''          <div class="hero-actions">\n            <button type="button" class="primary-button" (click)="creating.set(!creating())" [attr.aria-expanded]="creating()" aria-controls="new-section-panel">{{ creating() ? 'Yeni Bölümü Kapat' : '+ Yeni Bölüm' }}</button>\n            <button type="button" class="secondary-button" (click)="refresh()" [disabled]="loading()" aria-label="Ana sayfa verilerini yenile">{{ loading() ? 'Yükleniyor…' : 'Veriyi Yenile' }}</button>\n          </div>'''
          patch(path, block, '', 'homepage remove hero actions')
          marker = '''        </header>\n\n        @if (error()) {'''
          sticky = '''        </header>\n\n        <div class="sticky top-16 z-40 flex flex-col gap-2 rounded-2xl border border-slate-200 bg-white/95 p-3 shadow-lg backdrop-blur sm:flex-row sm:justify-end" aria-label="Ana sayfa hızlı işlemleri">\n          <button type="button" class="primary-button" (click)="creating.set(!creating())" [attr.aria-expanded]="creating()" aria-controls="new-section-panel">{{ creating() ? 'Yeni Bölümü Kapat' : '+ Yeni Bölüm' }}</button>\n          <button type="button" class="secondary-button" (click)="refresh()" [disabled]="loading()" aria-label="Ana sayfa verilerini yenile">{{ loading() ? 'Yükleniyor…' : 'Veriyi Yenile' }}</button>\n        </div>\n\n        @if (error()) {'''
          patch(path, marker, sticky, 'homepage sticky controls')

          # 4) Team: search/create/refresh follows the active internal tab and stays reachable.
          path = 'src/pages/admin/admin-team.component.ts'
          block = '''            <div class="grid w-full gap-2 lg:w-auto lg:grid-cols-[minmax(220px,1fr)_auto_auto]">\n              @if (tab() !== 'assignments') {\n                <input [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" type="search" autocomplete="off" [placeholder]="teamSearchPlaceholder()" aria-label="Ekip yönetimi kayıtlarında ara" class="min-h-12 rounded-xl border border-white/15 bg-white/10 px-4 text-sm font-bold text-white outline-none placeholder:text-slate-400 focus:border-blue-400" />\n              } @else {\n                <div class="hidden lg:block"></div>\n              }\n              <button type="button" (click)="startNewForCurrentTab()" class="min-h-12 rounded-xl bg-blue-600 px-5 text-sm font-black text-white">+ {{ newActionLabel() }}</button>\n              <button type="button" (click)="refresh()" [disabled]="loading()" class="min-h-12 rounded-xl bg-white px-5 text-sm font-black text-slate-950 disabled:opacity-50">{{ loading() ? 'Yükleniyor…' : 'Yenile' }}</button>\n            </div>'''
          patch(path, block, '', 'team remove hero actions')
          marker = '''        </header>\n\n        <nav class="grid grid-cols-2 gap-2 rounded-2xl border border-slate-200 bg-white p-2 shadow-sm md:grid-cols-4" aria-label="Ekip yönetimi bölümleri">'''
          sticky = '''        </header>\n\n        <section class="sticky top-16 z-40 rounded-2xl border border-slate-200 bg-white/95 p-3 shadow-lg backdrop-blur" aria-label="Ekip hızlı işlemleri">\n          <div class="grid gap-2 sm:grid-cols-[minmax(220px,1fr)_auto_auto]">\n            @if (tab() !== 'assignments') {\n              <input [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" type="search" autocomplete="off" [placeholder]="teamSearchPlaceholder()" aria-label="Ekip yönetimi kayıtlarında ara" class="min-h-12 rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm font-bold text-slate-900 outline-none placeholder:text-slate-400 focus:border-blue-500" />\n            } @else {\n              <div class="hidden sm:block"></div>\n            }\n            <button type="button" (click)="startNewForCurrentTab()" class="min-h-12 rounded-xl bg-blue-600 px-5 text-sm font-black text-white">+ {{ newActionLabel() }}</button>\n            <button type="button" (click)="refresh()" [disabled]="loading()" class="min-h-12 rounded-xl border border-slate-200 bg-white px-5 text-sm font-black text-slate-900 disabled:opacity-50">{{ loading() ? 'Yükleniyor…' : 'Yenile' }}</button>\n          </div>\n        </section>\n\n        <nav class="grid grid-cols-2 gap-2 rounded-2xl border border-slate-200 bg-white p-2 shadow-sm md:grid-cols-4" aria-label="Ekip yönetimi bölümleri">'''
          patch(path, marker, sticky, 'team sticky controls')

          # Static checks make the one-shot fail loudly if the intended standard is missing.
          checks = {
            'src/pages/admin/admin-catalog-editor.component.ts': ['sticky top-16 z-40', 'Katalog hızlı işlemleri', '+ Kiralık', '+ Satılık', '+ Tur'],
            'src/pages/admin/admin-campaigns.component.ts': ['Kampanya hızlı işlemleri', '+ Yeni Kampanya'],
            'src/pages/admin/admin-homepage.component.ts': ['Ana sayfa hızlı işlemleri', '+ Yeni Bölüm'],
            'src/pages/admin/admin-team.component.ts': ['Ekip hızlı işlemleri', 'startNewForCurrentTab()'],
          }
          for f, needles in checks.items():
              text = Path(f).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'missing {needle} in {f}')
          PY
          git rm .github/workflows/v92-admin-sticky-primary-actions-once.yml
          git diff --check
      - name: Commit sticky admin controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V92: keep admin primary actions sticky and reachable"
          git push origin HEAD:main
