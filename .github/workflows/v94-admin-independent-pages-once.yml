name: V94 Independent Admin Pages Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v94-admin-independent-pages-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize sticky offsets for independent admin pages
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          replacements = {
              'sticky top-16': 'sticky top-0',
              'sticky top-[65px]': 'sticky top-0',
              'sticky top-[64px]': 'sticky top-0',
          }
          changed = []
          for path in Path('src/pages/admin').glob('*.ts'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated independent-page sticky offsets:')
          print('\n'.join(changed) if changed else 'No stale offsets found')
          PY
          git diff --check
          git diff -- src/pages/admin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin
          git rm .github/workflows/v94-admin-independent-pages-once.yml
          git commit -m "V94: align sticky controls with independent admin pages"
          git push origin HEAD:main
