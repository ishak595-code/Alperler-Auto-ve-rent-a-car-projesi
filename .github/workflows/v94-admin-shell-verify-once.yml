name: V94 Admin Shell Verify Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v94-admin-shell-verify-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify V94 admin contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "showCustomerChrome" src/app.component.ts
          grep -q "⋮" src/pages/admin/admin-layout.component.ts
          grep -q "navigateByUrl" src/pages/admin/admin-layout.component.ts
          grep -q "Genel Ayarlar & Profil" src/pages/admin/admin-layout.component.ts
          grep -q "SEO & Ölçüm" src/pages/admin/admin-layout.component.ts
          grep -q "SSS Yönetimi" src/pages/admin/admin-layout.component.ts
          grep -q "await this.cars.updateConfig" src/pages/admin/admin-settings.component.ts
          grep -q "refreshCloudCatalog(true)" src/pages/admin/admin-settings.component.ts
          grep -q "path: 'seo'" src/app.routes.ts
          grep -q "path: 'faq-management'" src/app.routes.ts
          grep -q "catalog.saveFaq" src/pages/admin/admin-faq-management.component.ts
          grep -q "catalog.disableFaq" src/pages/admin/admin-faq-management.component.ts

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: API TypeScript quality check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build

      - name: Remove one-shot verifier after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v94-admin-shell-verify-once.yml
          git commit -m "V94: verify admin shell and live settings build"
          git push origin HEAD:main
