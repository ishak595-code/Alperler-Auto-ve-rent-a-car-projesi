name: V94 Admin Single Source Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v94-admin-single-source-cleanup-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply safe single-source cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          settings_path = Path('src/pages/admin/admin-settings.component.ts')
          settings = settings_path.read_text(encoding='utf-8')
          settings = settings.replace(
              'Marka, iletişim ve yönetici profilini tek kaynaktan yönetin. Ana sayfa, yasal metinler, ekip, footer, SEO ve SSS artık kendi yönetim sayfalarındadır.',
              'Marka kimliği, temel iletişim ve yönetici profilini tek kaynaktan yönetin. Ana sayfa, yasal metinler, ekip, footer ve sosyal medya, WhatsApp, SEO ve SSS kendi uzman yönetim sayfalarındadır.'
          )
          settings = settings.replace('            <label class="grid gap-1.5"><span class="text-xs font-black uppercase tracking-wide text-slate-500">WhatsApp Numarası</span><input [(ngModel)]="formConfig.whatsapp" name="whatsapp" inputmode="tel" class="min-h-12 rounded-xl border border-slate-300 bg-slate-50 px-4 outline-none focus:border-blue-500 focus:bg-white" /></label>\n', '')
          settings = settings.replace('            <label class="grid gap-1.5"><span class="text-xs font-black uppercase tracking-wide text-slate-500">WhatsApp Karşılama Mesajı</span><input [(ngModel)]="formConfig.whatsappMessage" name="whatsappMessage" class="min-h-12 rounded-xl border border-slate-300 bg-slate-50 px-4 outline-none focus:border-blue-500 focus:bg-white" /></label>\n', '')
          social_marker = '<h2 class="text-xl font-black">Sosyal Medya</h2>'
          security_marker = '<h2 class="text-xl font-black">Hesap Güvenliği</h2>'
          if social_marker in settings:
              social_pos = settings.index(social_marker)
              social_start = settings.rfind('\n        <section', 0, social_pos)
              security_pos = settings.index(security_marker, social_pos)
              security_start = settings.rfind('\n        <section', social_pos, security_pos)
              if social_start < 0 or security_start < 0:
                  raise SystemExit('Could not isolate legacy social media section')
              settings = settings[:social_start] + settings[security_start:]
          settings = settings.replace(
              'Bu sayfa artık ana sayfa metinlerini, ekip üyelerini, yasal içerikleri, footer ayarlarını veya SSS kayıtlarını ikinci kez tutmaz. O içerikler kendi admin modüllerinden canlı veritabanına yazılır.',
              'Bu sayfa artık ana sayfa metinlerini, ekip üyelerini, yasal içerikleri, footer ve sosyal medya ayarlarını, WhatsApp ayarlarını, SEO değerlerini veya SSS kayıtlarını ikinci kez tutmaz. Her veri yalnız kendi uzman admin modülünden canlı veritabanına yazılır.'
          )
          settings_path.write_text(settings, encoding='utf-8')

          footer_path = Path('src/pages/admin/admin-footer.component.ts')
          footer = footer_path.read_text(encoding='utf-8')
          footer = footer.replace("Metinlerin asıl kaynağı Site Ayarları → Yasal Sayfalar'dır.", "Metinlerin asıl kaynağı Yasal Metin Merkezi'dir.")
          footer = footer.replace('routerLink="/admin/settings" aria-label="Site ayarlarında yasal metinleri düzenle"', 'routerLink="/admin/legal" aria-label="Yasal Metin Merkezi sayfasını aç"')
          footer = footer.replace(
              '              <label><span>X URL</span><input [(ngModel)]="xUrl" name="xUrl" inputmode="url" placeholder="https://x.com/..." aria-label="X profil URL adresi" /></label>',
              '              <label><span>X URL</span><input [(ngModel)]="xUrl" name="xUrl" inputmode="url" placeholder="https://x.com/..." aria-label="X profil URL adresi" /></label>\n              <label><span>Facebook URL</span><input [(ngModel)]="facebookUrl" name="facebookUrl" inputmode="url" placeholder="https://facebook.com/..." aria-label="Facebook profil URL adresi" /></label>'
          )
          footer = footer.replace("  xUrl = '';", "  xUrl = '';\n  facebookUrl = '';")
          footer = footer.replace("      this.xUrl = cfg.twitterUrl || '';", "      this.xUrl = cfg.twitterUrl || '';\n      this.facebookUrl = cfg.facebookUrl || '';")
          footer = footer.replace('      const socials = [this.instagramUrl, this.tiktokUrl, this.youtubeUrl, this.xUrl];', '      const socials = [this.instagramUrl, this.tiktokUrl, this.youtubeUrl, this.xUrl, this.facebookUrl];')
          footer = footer.replace("        twitterUrl: this.xUrl.trim(),", "        twitterUrl: this.xUrl.trim(),\n        facebookUrl: this.facebookUrl.trim(),")
          old_legal = """      ['Kullanım Şartları', cfg.termsText],
      ['KVKK Aydınlatma Metni', cfg.kvkkText],
      ['Gizlilik Politikası', cfg.privacyText],
      ['Çerez Politikası', cfg.cookiesText],
      ['Mesafeli İşlem', cfg.distanceSellingText],
      ['İade ve İptal', cfg.cancellationText],
      ['Sigorta ve Sorumluluk', cfg.insuranceText],"""
          new_legal = """      ['Araç Kiralama Koşulları', cfg.rentalTermsText],
      ['Satış ve İlan Koşulları', cfg.salesTermsText],
      ['Tur ve Transfer Koşulları', cfg.tourTermsText],
      ['Aracını Değerlendir Koşulları', cfg.partnerTermsText],
      ['Şube ve Bayilik Koşulları', cfg.branchTermsText],
      ['Bülten ve Ticari İleti', cfg.commercialCommunicationText],
      ['Genel Kullanım Şartları', cfg.termsText],
      ['KVKK Aydınlatma Metni', cfg.kvkkText],
      ['Gizlilik Politikası', cfg.privacyText],
      ['Çerez Politikası', cfg.cookiesText],
      ['Mesafeli İşlem', cfg.distanceSellingText],
      ['İade ve İptal', cfg.cancellationText],
      ['Sigorta ve Sorumluluk', cfg.insuranceText],"""
          if old_legal in footer:
              footer = footer.replace(old_legal, new_legal)
          footer_path.write_text(footer, encoding='utf-8')

          homepage_path = Path('src/pages/admin/admin-homepage.component.ts')
          homepage_path.write_text(homepage_path.read_text(encoding='utf-8').replace('AlperAuto', 'Alperler Auto'), encoding='utf-8')

          car_path = Path('src/services/car.service.ts')
          car = car_path.read_text(encoding='utf-8')
          if '.replace(/AlperAuto/g, "Alperler Auto")' not in car:
              car = car.replace(
                  '      .replace(/ALPERLER OTO/g, "ALPERLER AUTO");',
                  '      .replace(/ALPERLER OTO/g, "ALPERLER AUTO")\n      .replace(/AlperAuto/g, "Alperler Auto")\n      .replace(/ALPERAUTO/g, "ALPERLER AUTO");'
              )
          car_path.write_text(car, encoding='utf-8')

          app_path = Path('src/app.component.ts')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
              'readonly showCustomerChrome = signal(this.isCustomerRoute(this.router.url));',
              "readonly showCustomerChrome = signal(this.isCustomerRoute(typeof window !== 'undefined' ? window.location.pathname : this.router.url));"
          )
          app_path.write_text(app, encoding='utf-8')
          PY

          grep -q 'routerLink="/admin/legal"' src/pages/admin/admin-footer.component.ts
          grep -q 'facebookUrl' src/pages/admin/admin-footer.component.ts
          grep -q 'Araç Kiralama Koşulları' src/pages/admin/admin-footer.component.ts
          ! grep -q '>Sosyal Medya</h2>' src/pages/admin/admin-settings.component.ts
          ! grep -q '>WhatsApp Numarası</span>' src/pages/admin/admin-settings.component.ts
          grep -q 'Alperler Auto' src/pages/admin/admin-homepage.component.ts
          grep -q 'window.location.pathname' src/app.component.ts
          git diff --check

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: API TypeScript quality check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build

      - name: Commit verified cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/admin-settings.component.ts src/pages/admin/admin-footer.component.ts src/pages/admin/admin-homepage.component.ts src/services/car.service.ts src/app.component.ts
          git rm .github/workflows/v94-admin-single-source-cleanup-once.yml
          git commit -m "V94: enforce single-source admin settings"
          git push origin HEAD:main
