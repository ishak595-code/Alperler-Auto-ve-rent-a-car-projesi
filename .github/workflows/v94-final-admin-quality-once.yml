name: V94 Final Admin Architecture Quality Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v94-final-admin-quality-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify final admin contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "navigateByUrl" src/pages/admin/admin-layout.component.ts
          grep -q "⋮" src/pages/admin/admin-layout.component.ts
          grep -q "path: 'seo'" src/app.routes.ts
          grep -q "path: 'faq-management'" src/app.routes.ts
          grep -q "window.location.pathname" src/app.component.ts
          grep -q "await this.cars.updateConfig" src/pages/admin/admin-settings.component.ts
          grep -q "await this.carService.updateConfig" src/pages/admin/admin-whatsapp-settings.component.ts
          grep -q 'routerLink="/admin/legal"' src/pages/admin/admin-footer.component.ts
          grep -q "facebookUrl" src/pages/admin/admin-footer.component.ts
          grep -q "Araç Kiralama Koşulları" src/pages/admin/admin-footer.component.ts
          grep -q "catalog.saveFaq" src/pages/admin/admin-faq-management.component.ts
          ! grep -q '>Sosyal Medya</h2>' src/pages/admin/admin-settings.component.ts
          ! grep -q '>WhatsApp Numarası</span>' src/pages/admin/admin-settings.component.ts
          ! grep -R -q "Firebase" src/pages/admin
          git diff --check

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend TypeScript quality check
        run: npm run lint

      - name: API TypeScript quality check
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Production build
        run: npm run build

      - name: Remove verifier and record success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v94-final-admin-quality-once.yml
          git commit -m "V94: verify final admin architecture"
          git push origin HEAD:main
