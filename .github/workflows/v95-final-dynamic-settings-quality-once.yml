name: V95 Final Dynamic Settings Quality Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v95-final-dynamic-settings-quality-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend TypeScript quality
        run: npm run lint
      - name: API TypeScript quality
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Verify dynamic settings wiring
        run: |
          grep -q "AdminSiteSettingsHubComponent" src/app.routes.ts
          grep -q "label:'Site Ayarları'" src/pages/admin/admin-layout.component.ts
          grep -q "queryParams: { section }" src/pages/admin/admin-site-settings-hub.component.ts
          grep -q "config.seoTitle" src/services/seo.service.ts
          grep -q "config.seoOgImage" src/services/seo.service.ts
          grep -q "updateCanonicalUrl" src/services/seo.service.ts
          grep -q "syncTrackingScripts" src/services/seo.service.ts
          ! grep -q "Canlı site_config" src/pages/admin/admin-settings.component.ts
          git diff --check
      - name: Production build
        run: npm run build
      - name: Record verified main tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v95-final-dynamic-settings-quality-once.yml
          git commit -m "V95: verify final dynamic site settings"
          git push origin main
