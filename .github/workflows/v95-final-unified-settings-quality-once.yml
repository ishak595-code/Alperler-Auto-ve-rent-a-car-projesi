name: V95 Unified Site Settings Quality Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v95-final-unified-settings-quality-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend lint and TypeScript quality
        run: npm run lint
      - name: API TypeScript quality
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Verify unified site settings wiring
        run: |
          grep -q "AdminSiteSettingsHubComponent" src/app.routes.ts
          grep -q "label:'Site Ayarları'" src/pages/admin/admin-layout.component.ts
          grep -q "Profil & Genel" src/pages/admin/admin-site-settings-hub.component.ts
          grep -q "Footer & Sosyal" src/pages/admin/admin-site-settings-hub.component.ts
          grep -q "settingsSection: 'homepage'" src/app.routes.ts
          grep -q "settingsSection: 'whatsapp'" src/app.routes.ts
          ! grep -q "Canlı site_config" src/pages/admin/admin-settings.component.ts
          ! grep -q "Canlı faqs tablosu" src/pages/admin/admin-faq-management.component.ts
          git diff --check
      - name: Production build
        run: npm run build
      - name: Record successful verification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v95-final-unified-settings-quality-once.yml
          git commit -m "V95: verify unified site settings workspace"
          git push origin main
