name: V95 Unify Site Settings Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v95-unify-site-settings-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply unified settings navigation and copy cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = Path('src/app.routes.ts')
          text = routes.read_text()
          if "AdminSiteSettingsHubComponent" not in text:
              text = text.replace(
                  "import { AdminSettingsComponent } from './pages/admin/admin-settings.component';",
                  "import { AdminSettingsComponent } from './pages/admin/admin-settings.component';\nimport { AdminSiteSettingsHubComponent } from './pages/admin/admin-site-settings-hub.component';"
              )
          replacements = {
              "{ path: 'homepage', component: AdminHomepageComponent, canActivate: [adminAreaGuard('content')] }": "{ path: 'homepage', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'homepage' }, canActivate: [adminAreaGuard('content')] }",
              "{ path: 'navigation', component: AdminNavigationComponent, canActivate: [adminAreaGuard('settings')] }": "{ path: 'navigation', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'navigation' }, canActivate: [adminAreaGuard('settings')] }",
              "{ path: 'footer', component: AdminFooterComponent, canActivate: [adminAreaGuard('settings')] }": "{ path: 'footer', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'footer' }, canActivate: [adminAreaGuard('settings')] }",
              "{ path: 'legal', component: AdminLegalCenterComponent, canActivate: [adminAreaGuard('settings')] }": "{ path: 'legal', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'legal' }, canActivate: [adminAreaGuard('settings')] }",
              "{ path: 'settings', component: AdminSettingsComponent, canActivate: [adminAreaGuard('settings')] }": "{ path: 'settings', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'general' }, canActivate: [adminAreaGuard('settings')] }",
              "{ path: 'seo', component: AdminSeoSettingsComponent, canActivate: [adminAreaGuard('settings')] }": "{ path: 'seo', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'seo' }, canActivate: [adminAreaGuard('settings')] }",
              "{ path: 'faq-management', component: AdminFaqManagementComponent, canActivate: [adminAreaGuard('content')] }": "{ path: 'faq-management', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'faq' }, canActivate: [adminAreaGuard('content')] }",
              "{ path: 'whatsapp', component: AdminWhatsappSettingsComponent, canActivate: [adminAreaGuard('settings')] }": "{ path: 'whatsapp', component: AdminSiteSettingsHubComponent, data: { settingsSection: 'whatsapp' }, canActivate: [adminAreaGuard('settings')] }",
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'route pattern missing: {old}')
              text = text.replace(old, new)
          routes.write_text(text)

          layout = Path('src/pages/admin/admin-layout.component.ts')
          text = layout.read_text()
          old = """    { id:'site', title:'Site & Görünüm', icon:'▦', items:[
      {route:'/admin/homepage',label:'Ana Sayfa Vitrini',icon:'▦',keywords:'bölüm sıra tema vitrin'},
      {route:'/admin/navigation',label:'Mobil Menü & Alt Bar',icon:'☰',keywords:'hamburger navigasyon buton'},
      {route:'/admin/footer',label:'Footer & Sosyal Medya',icon:'↓',keywords:'instagram tiktok youtube x bülten'},
      {route:'/admin/legal',label:'Yasal Metin Merkezi',icon:'§',keywords:'kvkk kiralama satış tur bayilik sözleşme'},
      {route:'/admin/settings',label:'Genel Ayarlar & Profil',icon:'⚙',keywords:'logo şirket iletişim profil hesap şifre'},
      {route:'/admin/seo',label:'SEO & Ölçüm',icon:'◎',keywords:'google analytics ads meta og arama'},
      {route:'/admin/faq-management',label:'SSS Yönetimi',icon:'?',keywords:'sık sorulan sorular cevap'},
      {route:'/admin/whatsapp',label:'WhatsApp Ayarları',icon:'✆',keywords:'mesaj iletişim'},
    ]},"""
          new = """    { id:'site', title:'Site & Görünüm', icon:'▦', items:[
      {route:'/admin/settings',label:'Site Ayarları',icon:'⚙',keywords:'profil genel ana sayfa vitrin menü alt bar footer sosyal medya yasal seo sss whatsapp logo iletişim'},
    ]},"""
          if old not in text and new not in text:
              raise SystemExit('site menu block missing')
          text = text.replace(old, new)
          layout.write_text(text)

          replacements_by_file = {
            'src/pages/admin/admin-settings.component.ts': [
              ('Canlı site_config', 'Site kimliği ve profil'),
              ('Supabase Auth + admin_users', 'Yönetici hesabı doğrulandı'),
              ('Genel ayarlar Supabase’e kaydedildi ve yayımlandı.', 'Genel ayarlar kaydedildi ve siteye uygulandı.'),
              ('Ayarlar kaydedilemedi. Oturum ve veritabanı bağlantısını kontrol edin.', 'Ayarlar kaydedilemedi. Bağlantınızı kontrol edip yeniden deneyin.'),
              ('Yönetici şifresi Supabase hesabında güncellendi.', 'Yönetici şifresi başarıyla güncellendi.'),
            ],
            'src/pages/admin/admin-footer.component.ts': [
              ("Burada kaydettiğin bilgiler production Supabase'e yazılır ve Realtime ile müşteri footer'ına yansır.", 'Burada yaptığınız değişiklikler sitenin alt bilgi alanında ve sosyal medya bağlantılarında kullanılır.'),
              ('Başlık ve açıklamalar doğrudan veritabanında tutulur.', 'Bu başlık ve açıklamalar sitenin alt bilgi bölümünde gösterilir.'),
              ('Buton yazısı ve açıklaması burada yönetilir; abonelik yine güvenli newsletter gateway üzerinden kaydedilir.', 'Bülten başlığını, açıklamasını ve abonelik butonunun yazısını buradan düzenleyin. Abonelikler güvenli şekilde kaydedilir.'),
            ],
            'src/pages/admin/admin-seo-settings.component.ts': [
              ('Canlı site_config', 'Arama ve ölçüm ayarları'),
              ('Veritabanından Yenile', 'Kayıtlı Ayarları Yenile'),
            ],
            'src/pages/admin/admin-faq-management.component.ts': [
              ('Canlı faqs tablosu', 'Müşteri yardım içeriği'),
              ('Müşteri sitesindeki sık sorulan soruları doğrudan veritabanından yönetin.', 'Müşterilerin yardım bölümünde gördüğü soru ve cevapları buradan yönetin.'),
            ],
            'src/pages/admin/admin-legal-center.component.ts': [
              ('Tek kaynak · site_config', 'Yasal içerik yönetimi'),
              ('Genel politikalar ile kiralama, satış, tur, araç değerlendirme, şube/bayilik ve bülten süreçlerine özel metinleri aynı canlı veritabanından yönetin.', 'Kiralama, satış, tur, araç değerlendirme, şube ve bülten süreçlerinde müşteriye gösterilecek yasal metinleri buradan yönetin.'),
              ('Yasal metinleri veritabanından yeniden yükle', 'Kayıtlı yasal metinleri yeniden yükle'),
              ('{{ fieldValue(field.key).length }} karakter · Kaydettiğinizde Supabase site_config güncellenir ve public legal sayfa Realtime ile yenilenir.', '{{ fieldValue(field.key).length }} karakter · Kaydettiğinizde bu metin müşterilerin gördüğü yasal bilgilendirme sayfasında güncellenir.'),
            ],
            'src/pages/admin/admin-homepage.component.ts': [
              ('{{ sections().length }} bölüm · değişiklikler Supabase ve Realtime ile canlı siteye bağlıdır', '{{ sections().length }} bölüm · burada yaptığınız değişiklikler ana sayfadaki vitrini günceller'),
              ('Veriyi Yenile', 'Vitrini Yenile'),
            ],
          }
          for filename, pairs in replacements_by_file.items():
              p = Path(filename)
              t = p.read_text()
              for old, new in pairs:
                  if old in t:
                      t = t.replace(old, new)
              p.write_text(t)
          PY
          git diff --check
          git diff -- src/app.routes.ts src/pages/admin/admin-layout.component.ts src/pages/admin/admin-settings.component.ts src/pages/admin/admin-footer.component.ts src/pages/admin/admin-seo-settings.component.ts src/pages/admin/admin-faq-management.component.ts src/pages/admin/admin-legal-center.component.ts src/pages/admin/admin-homepage.component.ts
      - name: Commit changes and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v95-unify-site-settings-once.yml
          git add src/app.routes.ts src/pages/admin/admin-layout.component.ts src/pages/admin/admin-settings.component.ts src/pages/admin/admin-footer.component.ts src/pages/admin/admin-seo-settings.component.ts src/pages/admin/admin-faq-management.component.ts src/pages/admin/admin-legal-center.component.ts src/pages/admin/admin-homepage.component.ts
          git commit -m "V95: unify site settings into one workspace"
          git push origin main
