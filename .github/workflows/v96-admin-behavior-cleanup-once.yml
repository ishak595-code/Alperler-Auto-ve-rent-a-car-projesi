name: V96 Admin Behavior Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v96-admin-behavior-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final admin UX cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} matches, found {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          # Vehicle and tour editors close after a successful save.
          path = 'src/pages/admin/admin-catalog-editor.component.ts'
          replace(path,
              'try { await this.editor.saveVehicle(car); await this.reloadCurrent(); this.toast.show("Araç bilgileri kaydedildi.", "success"); }',
              'try {\n      await this.editor.saveVehicle(car);\n      await this.reloadCurrent();\n      this.selectedVehicle.set(null);\n      this.media.set([]);\n      this.toast.show("Araç bilgileri kaydedildi.", "success");\n    }')
          replace(path,
              'try { await this.editor.saveTour(tour); await this.reloadCurrent(); this.toast.show("Tur bilgileri kaydedildi.", "success"); }',
              'try {\n      await this.editor.saveTour(tour);\n      await this.reloadCurrent();\n      this.selectedTour.set(null);\n      this.media.set([]);\n      this.toast.show("Tur bilgileri kaydedildi.", "success");\n    }')

          # Campaign editor opens only for new/edit and closes after save.
          path = 'src/pages/admin/admin-campaigns.component.ts'
          replace(path,
              '<p class="mt-2 max-w-4xl text-sm leading-relaxed text-slate-300">Aktif ve “Yayınlandı” durumundaki kampanyalar tek Supabase kaynağından okunur. Sıralamadaki ilk 3 kampanya ana sayfa vitrinine otomatik bağlanır. Yeni kampanya ekleme, metin, görsel, fiyat, gerçek bitiş süresi, CTA ve WhatsApp mesajı burada yönetilir.</p>',
              '<p class="mt-2 max-w-4xl text-sm leading-relaxed text-slate-300">Yayınladığınız kampanyalar müşterilere gösterilir. Sıralamadaki ilk 3 kampanya ana sayfa vitrinine çıkar. Metin, görsel, fiyat, bitiş zamanı, buton ve WhatsApp mesajını buradan yönetebilirsiniz.</p>')
          replace(path,
              '<div class="rounded-2xl border border-white/10 bg-white/5 p-4"><div class="text-[10px] font-black uppercase tracking-wider text-slate-400">Tek kaynak</div><div class="mt-1 text-sm font-black text-emerald-300">Admin → Supabase → Ana sayfa</div></div>',
              '<div class="rounded-2xl border border-white/10 bg-white/5 p-4"><div class="text-[10px] font-black uppercase tracking-wider text-slate-400">Yayın akışı</div><div class="mt-1 text-sm font-black text-emerald-300">Kaydet → Ana sayfada göster</div></div>')
          replace(path,
              '<section class="grid gap-5 xl:grid-cols-[430px_1fr]">',
              '<section [class]="editorOpen() ? \'grid gap-5 xl:grid-cols-[430px_1fr]\' : \'grid gap-5\'">')
          replace(path,
              '          <form id="campaign-editor" (ngSubmit)="save()" class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm xl:sticky xl:top-20 xl:self-start">',
              '          @if (editorOpen()) {\n          <form id="campaign-editor" (ngSubmit)="save()" class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm xl:sticky xl:top-20 xl:self-start">')
          replace(path,
              '          </form>\n\n          <section class="space-y-4">',
              '          </form>\n          }\n\n          <section class="space-y-4">')
          replace(path,
              'Henüz kampanya yok. Soldaki formdan ilk kampanyayı oluşturabilirsiniz.',
              'Henüz kampanya yok. Üstteki Yeni Kampanya düğmesiyle ilk kampanyayı oluşturabilirsiniz.')
          replace(path,
              '  readonly saving = signal(false);\n  readonly searchQuery = signal("");',
              '  readonly saving = signal(false);\n  readonly searchQuery = signal("");\n  readonly editorOpen = signal(false);')
          replace(path,
              '      this.reset();\n      this.toast.show("Kampanya ve ana sayfa vitrini güncellendi.", "success");',
              '      this.reset();\n      this.editorOpen.set(false);\n      this.toast.show("Kampanya ve ana sayfa vitrini güncellendi.", "success");')
          replace(path,
              '      this.toast.show("Kampanya görseli Supabase Storage\'a yüklendi.", "success");',
              '      this.toast.show("Kampanya görseli yüklendi.", "success");')
          replace(path,
              '  edit(campaign: CampaignRecord): void {\n    const benefits = this.benefitsOf(campaign);',
              '  edit(campaign: CampaignRecord): void {\n    this.editorOpen.set(true);\n    const benefits = this.benefitsOf(campaign);')
          replace(path,
              '  startNewCampaign(): void {\n    this.reset();',
              '  startNewCampaign(): void {\n    this.reset();\n    this.editorOpen.set(true);')

          # Newsletter wording is administrator-facing, not implementation-facing.
          path = 'src/pages/admin/admin-subscribers.component.ts'
          replacements = {
              'Canlı Supabase Verisi': 'Bülten Yönetimi',
              'Her kayıt doğrudan <code>subscribers</code> tablosundan gelir.': 'Arama ve filtre sonucundaki aboneleri buradan yönetin.',
              'Gönderim sonucu veritabanında alıcı bazında saklanır.': 'Gönderim sonuçlarını kampanya bazında takip edebilirsiniz.',
              'Sağlayıcı bağlı değilse kampanya ve teslimat kayıtları yine oluşturulur ancak panel gerçek durumu “E-posta sağlayıcısı bağlı değil” olarak gösterir. Sahte başarı verilmez.': 'E-posta gönderim hizmeti bağlı değilse panel bunu açıkça belirtir ve gönderimi başarılı göstermeye çalışmaz.',
              'Gönderim toplamları ve sonuçları Supabase kayıtlarından hesaplanır.': 'Gönderilen, başarısız ve atlanan alıcıları kampanya bazında görün.',
              'Bülten verileri Supabase üzerinden yüklenemedi. Yönetici oturumunu ve bağlantıyı kontrol edin.': 'Bülten bilgileri yüklenemedi. Bağlantınızı kontrol edip tekrar deneyin.',
              'Abone durumu veritabanında güncellenemedi.': 'Abone durumu güncellenemedi. Lütfen tekrar deneyin.',
          }
          for old, new in replacements.items():
              replace(path, old, new)

          # Blog upload feedback should not expose storage implementation.
          replace('src/pages/admin/admin-blog.component.ts',
              'Blog görseli Supabase Storage\'a yüklendi.',
              'Blog görseli yüklendi.')

          # Do not render a default protected child while permissions are still loading.
          for path, flag in [
              ('src/pages/admin/admin-operations-hub.component.ts', 'ready()'),
              ('src/pages/admin/admin-team-hub.component.ts', 'ready()'),
              ('src/pages/admin/admin-site-settings-hub.component.ts', 'accessReady()'),
          ]:
              p = Path(path)
              text = p.read_text()
              marker = '      <main class="content">\n        @switch (active()' if 'site-settings' not in path else '      <main class="content">\n        @switch (activeSection()'
              if marker not in text:
                  raise SystemExit(f'{path}: content switch marker missing')
              text = text.replace('      <main class="content">\n        @switch (active()', f'      <main class="content">\n        @if ({flag}) {{\n        @switch (active()', 1) if 'site-settings' not in path else text.replace('      <main class="content">\n        @switch (activeSection()', f'      <main class="content">\n        @if ({flag}) {{\n        @switch (activeSection()', 1)
              closing = '        }\n      </main>'
              idx = text.find(closing, text.find('<main class="content">'))
              if idx < 0:
                  raise SystemExit(f'{path}: switch closing marker missing')
              text = text[:idx] + '        }\n        } @else {\n          <div class="p-8 text-center text-sm font-bold text-slate-500">Yönetim alanı hazırlanıyor…</div>\n        }\n' + text[idx+len('        }\n'):]
              p.write_text(text)

          PY
          git diff --check
      - run: npm ci
      - name: Frontend TypeScript
        run: npm run lint
      - name: API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Production build
        run: npm run build
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin
          git rm .github/workflows/v96-admin-behavior-cleanup-once.yml
          git commit -m "V96: close editors and finish admin UX cleanup"
          git push
