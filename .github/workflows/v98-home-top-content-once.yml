name: V98 Homepage Top Content Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v98-home-top-content-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply V98 homepage content controls
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f'Expected block missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          # Expand typed home content fields.
          replace_once('src/models/site-config.model.ts',
            '    heroTrustLine?: string;\n    heroCtaSubtext?: string;\n',
            '    heroTrustLine?: string;\n    heroImage?: string;\n    plannerKicker?: string;\n    plannerNote?: string;\n    searchPlaceholder?: string;\n    trustPrice?: string;\n    trustSupport?: string;\n    trustVerified?: string;\n    heroCtaSubtext?: string;\n')

          # Render the homepage top copy from homeContent with safe fallbacks.
          replace_once('src/pages/home-v71.component.ts',
            '<p class="eyebrow">{{ brandName() }} · Hakkâri\'den yola çıkan güven</p>',
            '<p class="eyebrow">{{ homeContent().heroTrustLine || (brandName() + \' · Hakkâri’den yola çıkan güven\') }}</p>')
          replace_once('src/pages/home-v71.component.ts',
            'placeholder="Marka, model, tur veya ilan no" />',
            '[placeholder]="homeContent().searchPlaceholder || \'Marka, model, tur veya ilan no\'" />')
          replace_once('src/pages/home-v71.component.ts',
            '<span><mat-icon aria-hidden="true">verified</mat-icon> Açık fiyat</span>\n              <span><mat-icon aria-hidden="true">support_agent</mat-icon> Yerel destek</span>\n              <span><mat-icon aria-hidden="true">fact_check</mat-icon> Kontrol edilmiş ilan</span>',
            '<span><mat-icon aria-hidden="true">verified</mat-icon> {{ homeContent().trustPrice || \'Açık fiyat\' }}</span>\n              <span><mat-icon aria-hidden="true">support_agent</mat-icon> {{ homeContent().trustSupport || \'Yerel destek\' }}</span>\n              <span><mat-icon aria-hidden="true">fact_check</mat-icon> {{ homeContent().trustVerified || \'Kontrol edilmiş ilan\' }}</span>')
          replace_once('src/pages/home-v71.component.ts',
            '<p class="planner-kicker">Hızlı Planlama</p>',
            '<p class="planner-kicker">{{ homeContent().plannerKicker || \'Hızlı Planlama\' }}</p>')
          replace_once('src/pages/home-v71.component.ts',
            '<p class="planner-note">Teslim bölgesi ve kesin uygunluk rezervasyon öncesinde doğrulanır.</p>',
            '<p class="planner-note">{{ homeContent().plannerNote || \'Teslim bölgesi ve kesin uygunluk rezervasyon öncesinde doğrulanır.\' }}</p>')

          # Add controls to the existing Homepage Top Area panel.
          replace_once('src/pages/admin/admin-homepage.component.ts',
            '<label><span>Arka plan görseli URL</span><input [(ngModel)]="heroImage" name="homeHeroImage" type="url" placeholder="https://..." aria-label="Ana sayfa hero arka plan görseli URL adresi" /></label>',
            '<label><span>Üst güven satırı</span><input [(ngModel)]="heroTrustLine" name="homeHeroTrustLine" maxlength="140" aria-label="Ana sayfa üst güven satırı" /></label>\n              <label><span>Arama kutusu örnek metni</span><input [(ngModel)]="searchPlaceholder" name="homeSearchPlaceholder" maxlength="120" aria-label="Ana sayfa arama kutusu örnek metni" /></label>\n              <label><span>Arka plan görseli URL</span><input [(ngModel)]="heroImage" name="homeHeroImage" type="url" placeholder="https://..." aria-label="Ana sayfa hero arka plan görseli URL adresi" /></label>')
          replace_once('src/pages/admin/admin-homepage.component.ts',
            '<label><span>Planlama başlığı</span><input [(ngModel)]="bookingTitle" name="homeBookingTitle" maxlength="180" aria-label="Ana sayfa hızlı planlama başlığı" /></label>',
            '<label><span>Üst etiket</span><input [(ngModel)]="plannerKicker" name="homePlannerKicker" maxlength="100" aria-label="Ana sayfa hızlı planlama üst etiketi" /></label>\n              <label><span>Planlama başlığı</span><input [(ngModel)]="bookingTitle" name="homeBookingTitle" maxlength="180" aria-label="Ana sayfa hızlı planlama başlığı" /></label>')
          replace_once('src/pages/admin/admin-homepage.component.ts',
            '<label><span>Planlama açıklaması</span><textarea [(ngModel)]="bookingSubtitle" name="homeBookingSubtitle" rows="4" maxlength="500" aria-label="Ana sayfa hızlı planlama açıklaması"></textarea></label>\n              <p class="hint">Teslim noktaları ve araç/tur sonuçları mevcut canlı şube ve katalog verilerinden otomatik gelir.</p>',
            '<label><span>Planlama açıklaması</span><textarea [(ngModel)]="bookingSubtitle" name="homeBookingSubtitle" rows="4" maxlength="500" aria-label="Ana sayfa hızlı planlama açıklaması"></textarea></label>\n              <label><span>Planlama alt notu</span><textarea [(ngModel)]="plannerNote" name="homePlannerNote" rows="3" maxlength="300" aria-label="Ana sayfa hızlı planlama alt notu"></textarea></label>\n              <fieldset class="themes"><legend>Güven rozetleri</legend><div class="new-grid"><label><span>1. rozet</span><input [(ngModel)]="trustPrice" name="homeTrustPrice" maxlength="80" aria-label="Birinci güven rozeti" /></label><label><span>2. rozet</span><input [(ngModel)]="trustSupport" name="homeTrustSupport" maxlength="80" aria-label="İkinci güven rozeti" /></label><label><span>3. rozet</span><input [(ngModel)]="trustVerified" name="homeTrustVerified" maxlength="80" aria-label="Üçüncü güven rozeti" /></label></div></fieldset>\n              <p class="hint">Teslim noktaları ve araç/tur sonuçları mevcut canlı şube ve katalog verilerinden otomatik gelir.</p>')

          replace_once('src/pages/admin/admin-homepage.component.ts',
            "  heroTitle = '';\n  heroSubtitle = '';\n  heroImage = '';\n  bookingTitle = '';\n  bookingSubtitle = '';\n",
            "  heroTitle = '';\n  heroSubtitle = '';\n  heroTrustLine = '';\n  heroImage = '';\n  searchPlaceholder = '';\n  plannerKicker = '';\n  bookingTitle = '';\n  bookingSubtitle = '';\n  plannerNote = '';\n  trustPrice = '';\n  trustSupport = '';\n  trustVerified = '';\n")

          replace_once('src/pages/admin/admin-homepage.component.ts',
            "      homeContent['heroTitle'] = this.heroTitle.trim();\n      homeContent['heroSubtitle'] = this.heroSubtitle.trim();\n      homeContent['heroImage'] = this.heroImage.trim();\n      homeContent['bookingTitle'] = this.bookingTitle.trim();\n      homeContent['bookingSubtitle'] = this.bookingSubtitle.trim();\n",
            "      homeContent['heroTitle'] = this.heroTitle.trim();\n      homeContent['heroSubtitle'] = this.heroSubtitle.trim();\n      homeContent['heroTrustLine'] = this.heroTrustLine.trim();\n      homeContent['heroImage'] = this.heroImage.trim();\n      homeContent['searchPlaceholder'] = this.searchPlaceholder.trim();\n      homeContent['plannerKicker'] = this.plannerKicker.trim();\n      homeContent['bookingTitle'] = this.bookingTitle.trim();\n      homeContent['bookingSubtitle'] = this.bookingSubtitle.trim();\n      homeContent['plannerNote'] = this.plannerNote.trim();\n      homeContent['trustPrice'] = this.trustPrice.trim();\n      homeContent['trustSupport'] = this.trustSupport.trim();\n      homeContent['trustVerified'] = this.trustVerified.trim();\n")

          replace_once('src/pages/admin/admin-homepage.component.ts',
            "    this.heroTitle = String(home['heroTitle'] || '');\n    this.heroSubtitle = String(home['heroSubtitle'] || '');\n    this.heroImage = String(home['heroImage'] || '');\n    this.bookingTitle = String(home['bookingTitle'] || '');\n    this.bookingSubtitle = String(home['bookingSubtitle'] || '');\n",
            "    this.heroTitle = String(home['heroTitle'] || '');\n    this.heroSubtitle = String(home['heroSubtitle'] || '');\n    this.heroTrustLine = String(home['heroTrustLine'] || '');\n    this.heroImage = String(home['heroImage'] || '');\n    this.searchPlaceholder = String(home['searchPlaceholder'] || '');\n    this.plannerKicker = String(home['plannerKicker'] || '');\n    this.bookingTitle = String(home['bookingTitle'] || '');\n    this.bookingSubtitle = String(home['bookingSubtitle'] || '');\n    this.plannerNote = String(home['plannerNote'] || '');\n    this.trustPrice = String(home['trustPrice'] || '');\n    this.trustSupport = String(home['trustSupport'] || '');\n    this.trustVerified = String(home['trustVerified'] || '');\n")
          PY
      - name: V98 accessibility and behavior assertions
        run: |
          grep -q "homeContent().heroTrustLine" src/pages/home-v71.component.ts
          grep -q "homeContent().trustVerified" src/pages/home-v71.component.ts
          grep -q "plannerNote" src/pages/admin/admin-homepage.component.ts
          grep -q 'aria-label="Araç iade tarihi seç"' src/pages/home-v71.component.ts
          grep -q 'aria-label="Randevu tarihi seç"' src/pages/appointment.component.ts
          grep -q 'aria-label="Menüyü kapat"\|Menüyü kapat' src/components/navbar.component.ts
          grep -q 'aria-label="Favoriler"' src/components/navbar.component.ts
          git diff --check
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.api.json
      - run: npm run build
      - name: Commit V98 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/models/site-config.model.ts src/pages/home-v71.component.ts src/pages/admin/admin-homepage.component.ts
          git commit -m "V98: make homepage top content fully manageable"
          git push origin main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/v98-home-top-content-once.yml
          git commit -m "ci: remove V98 one-shot workflow"
          git push origin main
