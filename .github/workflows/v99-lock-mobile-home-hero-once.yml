name: V99 Lock Mobile Homepage Hero Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v99-lock-mobile-home-hero-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply approved mobile hero behavior
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Phones use the approved minimal hero from the supplied screenshot.
          # Search and planner remain tablet/desktop features only.
          replace_once(
              'src/pages/home-v71.component.ts',
              '@media(max-width:767px){.hero-grid{right:-55%;bottom:-25%;width:130%;height:52%;opacity:.12;background-size:42px 42px}.hero-copy-block,.planner{transform:none}.hero-stage{padding-top:1.05rem}.trust-row{margin-bottom:.15rem}.section-head{align-items:start}.date-grid{grid-template-columns:1fr 1fr}.offers{padding-top:1.7rem;padding-bottom:1.8rem}}',
              '@media(max-width:767px){.hero-grid{right:-55%;bottom:-25%;width:130%;height:52%;opacity:.12;background-size:42px 42px}.hero-copy-block{transform:none}.hero-stage{display:block;padding-top:1.05rem;padding-bottom:1.4rem}.desktop-search,.planner,.trust-row{display:none!important}.hero-copy-block{max-width:100%}.hero h1{max-width:680px}.hero-copy{max-width:620px}.section-head{align-items:start}.date-grid{grid-template-columns:1fr 1fr}.offers{padding-top:1.7rem;padding-bottom:1.8rem}}'
          )

          # Make the admin wording explicit so mobile is not accidentally redesigned later.
          replace_once(
              'src/pages/admin/admin-homepage.component.ts',
              '<section class="new-panel" aria-labelledby="homepage-top-area-title">',
              '<section class="new-panel" aria-labelledby="homepage-top-area-title">'
          )
          replace_once(
              'src/pages/admin/admin-homepage.component.ts',
              '<div><h2 id="homepage-top-area-title">Ana Sayfa Üst Alanı</h2><p>Hero başlığı, açıklaması, arka plan görseli ve hızlı planlama metinleri doğrudan ana sayfanın en üstünde kullanılır.</p></div>',
              '<div><h2 id="homepage-top-area-title">Ana Sayfa Üst Alanı</h2><p>Telefonlarda sade Hero kullanılır: üst satır, başlık, açıklama ve arka plan. Arama ve Hızlı Planlama yalnız tablet ve bilgisayarda gösterilir.</p></div>'
          )
          replace_once(
              'src/pages/admin/admin-homepage.component.ts',
              '<h4>Hızlı Planlama</h4>',
              '<h4>Tablet ve Bilgisayar Hızlı Planlama</h4>'
          )
          replace_once(
              'src/pages/admin/admin-homepage.component.ts',
              '<p class="hint">Teslim noktaları ve araç/tur sonuçları mevcut canlı şube ve katalog verilerinden otomatik gelir.</p>',
              '<p class="hint">Bu alan telefonda gösterilmez. Tablet ve bilgisayarda teslim noktaları ile araç/tur sonuçları mevcut canlı şube ve katalog verilerinden otomatik gelir.</p>'
          )
          PY
      - name: Verify mobile/desktop separation
        run: |
          grep -q 'desktop-search,.planner,.trust-row{display:none!important}' src/pages/home-v71.component.ts
          grep -q '@media(min-width:768px).*desktop-search{display:block}' src/pages/home-v71.component.ts
          grep -q 'Tablet ve Bilgisayar Hızlı Planlama' src/pages/admin/admin-homepage.component.ts
          git diff --check
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.api.json
      - run: npm run build
      - name: Commit approved mobile hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home-v71.component.ts src/pages/admin/admin-homepage.component.ts
          git commit -m "V99: preserve approved minimal mobile hero"
          git push origin main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/v99-lock-mobile-home-hero-once.yml
          git commit -m "ci: remove V99 one-shot workflow"
          git push origin main
