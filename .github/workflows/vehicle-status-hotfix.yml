name: One-shot vehicle status semantic hotfix

on:
  push:
    paths:
      - '.github/workflows/vehicle-status-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix sale status semantics
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/services/car.service.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    const status =\n      vehicle.category === "SALE" &&\n      vehicle.availability?.toLocaleLowerCase("tr-TR").includes("sat")\n        ? "SOLD"\n        : "AVAILABLE";'''
          new = '''    const normalizedAvailability =\n      vehicle.availability?.trim().toLocaleLowerCase("tr-TR") || "";\n    const status =\n      vehicle.category === "SALE" && normalizedAvailability === "satıldı"\n        ? "SOLD"\n        : "AVAILABLE";'''
          if old not in text:
              raise SystemExit('Expected status block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/car.service.ts
          git commit -m 'fix: distinguish sale listing from sold status'
          git push origin HEAD:main
