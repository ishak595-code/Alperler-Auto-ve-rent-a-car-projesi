<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081426">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Çevrimdışı | Alperler Rent A Car</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050a18;color:#f8fafc}
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;min-height:100%;background:#050a18}
    body{display:grid;min-height:100vh;min-height:100dvh;place-items:center;padding:max(1.25rem,env(safe-area-inset-top)) max(1.25rem,env(safe-area-inset-right)) max(1.25rem,env(safe-area-inset-bottom)) max(1.25rem,env(safe-area-inset-left));background:radial-gradient(circle at top,#10254a 0,#081426 34%,#050a18 72%)}
    main{width:min(100%,34rem);border:1px solid rgba(148,163,184,.24);border-radius:22px;background:rgba(7,17,32,.96);padding:clamp(1.35rem,5vw,2.4rem);box-shadow:0 24px 70px rgba(0,0,0,.36)}
    .mark{display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:14px;background:#2563eb;font-size:1.35rem;font-weight:900;letter-spacing:-.05em}
    h1{margin:1rem 0 .65rem;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.05}
    p{margin:0;color:#cbd5e1;font-size:1rem;line-height:1.65}
    .actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.35rem}
    button,a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;border-radius:13px;padding:.8rem 1rem;font:800 .95rem/1.2 inherit;text-decoration:none;cursor:pointer}
    button{border:0;background:#2563eb;color:#fff}
    a{border:1px solid rgba(148,163,184,.34);background:#0b1627;color:#fff}
    button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
    small{display:block;margin-top:1rem;color:#94a3b8;line-height:1.5}
  </style>
</head>
<body>
  <main aria-labelledby="offline-title">
    <div class="mark" aria-hidden="true">A</div>
    <h1 id="offline-title">İnternet bağlantısı yok</h1>
    <p>Alperler Rent A Car şu anda internete ulaşamıyor. Rezervasyon, fiyat, araç durumu ve tur bilgileri güncel kalması için çevrimdışı ortamda gösterilmez.</p>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">Tekrar dene</button>
      <a href="/">Ana sayfaya dön</a>
    </div>
    <small>Bağlantı geri geldiğinde sayfayı yeniden açmanız yeterlidir.</small>
  </main>
</body>
</html>
