# V252 — public delivery for the Cloudflare R2 media bucket.
# NOT deployed by CI. Deploy manually (see workers/media/README.md):
#   cd workers/media && npx wrangler@latest deploy
name = "alperler-media"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
# No custom domain yet: the Worker answers on https://alperler-media.<account-subdomain>.workers.dev
# Later, attach a custom domain in the Cloudflare dashboard (Workers → alperler-media →
# Settings → Domains & Routes) and switch R2_PUBLIC_BASE_URL — config only, no code change.

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "alperler-media" # must equal the R2_BUCKET env var used by the Vercel API

[vars]
# Browser caches objects for a year; keys are content-addressed (random stem per upload).
CACHE_CONTROL = "public, max-age=31536000, immutable"
# V253 hotlink policy: comma-separated host suffixes of our own sites (see index.ts). Empty = allow all.
# Add the custom domain here later (config only).
# Requests WITHOUT a Referer (social previews, chat apps, e-mail, direct opens) and from search/social hosts
# are always allowed; another website embedding our files gets 403.
ALLOWED_REFERER_HOSTS = "alperler-auto-ve-rent-a-car-projesi.vercel.app,-ishak595-codes-projects.vercel.app,localhost,127.0.0.1"

# V253 abuse protection -------------------------------------------------------------------------
# Per-IP limiter (Workers rate-limit binding; counters are per Cloudflare location, best effort).
# 300 requests / 10 s per IP is far above what one visitor's gallery needs (5 widths × ~30 images).
[[ratelimits]]
name = "MEDIA_RATE_LIMITER"
namespace_id = "25301"
simple = { limit = 300, period = 10 }

